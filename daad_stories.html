<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضاد — القصص المصوّرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('daad-preset', {
            presets: [
                [Babel.availablePresets['env'], { modules: false }],
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        badeec: { teal: '#0e8a9c', coral: '#f15a68', deep: '#086974', navy: '#2b3044', sand: '#dcb897', sky: '#eef8f9' }
                    }
                }
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Cairo:wght@400;600;700;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');
        body { margin: 0; padding: 0; background-color: #eef8f9; }
        .font-baloo { font-family: 'Baloo Bhaijaan 2', cursive; }
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .font-naskh { font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif; letter-spacing: 0.03em; word-spacing: 0.35em; overflow: visible !important; line-height: 2 !important; padding-top: 0.15em; }
        .font-naskh span, .font-naskh div { overflow: visible !important; }
        [class*='rounded'] .font-naskh, [class*='rounded'].font-naskh { overflow: visible !important; padding-top: 0.2em; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <div id="root" class="bg-badeec-sky min-h-screen font-cairo text-badeec-navy overflow-x-hidden select-none"></div>
    <script type="text/babel" data-presets="daad-preset">
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    const { useState, useEffect, useRef } = React;

    // ====== SVG ILLUSTRATION HELPERS ======
    const Sky = ({color1='#87CEEB', color2='#E0F4FF', children}) => (
        <svg viewBox="0 0 400 280" className="w-full rounded-t-2xl" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id={`sky${color1.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={color1}/><stop offset="100%" stopColor={color2}/>
            </linearGradient></defs>
            <rect width="400" height="280" fill={`url(#sky${color1.replace('#','')})`}/>
            {children}
        </svg>
    );
    const Sun = ({x=340,y=50}) => <><circle cx={x} cy={y} r="30" fill="#FFD93D"/>{[0,45,90,135,180,225,270,315].map(a=><line key={a} x1={x} y1={y} x2={x+Math.cos(a*Math.PI/180)*42} y2={y+Math.sin(a*Math.PI/180)*42} stroke="#FFD93D" strokeWidth="3"/>)}</>;
    const Cloud = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}><ellipse cx="0" cy="0" rx="25" ry="15" fill="white" opacity="0.8"/><ellipse cx="-15" cy="5" rx="18" ry="12" fill="white" opacity="0.8"/><ellipse cx="15" cy="5" rx="20" ry="12" fill="white" opacity="0.8"/></g>;
    const Ground = ({color='#4ade80', y=220}) => <><rect x="0" y={y} width="400" height={280-y} fill={color}/><rect x="0" y={y} width="400" height="8" fill={color} opacity="0.7"/></>;
    const Tree = ({x, y=210, s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}><rect x="-6" y="-40" width="12" height="40" fill="#8B5E3C" rx="3"/><circle cx="0" cy="-55" r="25" fill="#22c55e"/><circle cx="-15" cy="-45" r="18" fill="#16a34a"/><circle cx="15" cy="-45" r="18" fill="#16a34a"/></g>;
    const House = ({x, y=220}) => <g transform={`translate(${x},${y})`}><rect x="-30" y="-50" width="60" height="50" fill="#FDE68A" stroke="#D97706" strokeWidth="2"/><polygon points="-35,-50 0,-80 35,-50" fill="#EF4444" stroke="#B91C1C" strokeWidth="2"/><rect x="-10" y="-35" width="20" height="35" fill="#92400E" rx="2"/><circle cx="8" cy="-18" r="2" fill="#FFD93D"/></g>;
    const Flower = ({x, y, color='#ec4899'}) => <g transform={`translate(${x},${y})`}><line x1="0" y1="0" x2="0" y2="15" stroke="#22c55e" strokeWidth="2"/>{[0,72,144,216,288].map(a=><circle key={a} cx={Math.cos(a*Math.PI/180)*6} cy={Math.sin(a*Math.PI/180)*6-2} r="4" fill={color}/>)}<circle cx="0" cy="-2" r="3" fill="#FCD34D"/></g>;
    const Moon = ({x=50,y=40}) => <><circle cx={x} cy={y} r="25" fill="#FCD34D"/><circle cx={x+8} cy={y-5} r="20" fill="#1e3a5f"/></>;
    const Stars = () => <>{[[30,20],[80,50],[150,25],[250,40],[320,60],[370,20],[200,15],[120,55]].map(([x,y],i)=><circle key={i} cx={x} cy={y} r="2" fill="white" opacity={0.5+Math.random()*0.5}/>)}</>;

    // Animal SVG helpers
    const Bear = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="0" rx="22" ry="25" fill="#8B6914"/>
        <circle cx="-15" cy="-22" r="8" fill="#8B6914"/><circle cx="15" cy="-22" r="8" fill="#8B6914"/>
        <circle cx="-15" cy="-22" r="5" fill="#D4A843"/><circle cx="15" cy="-22" r="5" fill="#D4A843"/>
        <circle cx="-7" cy="-5" r="3" fill="#1a1a1a"/><circle cx="7" cy="-5" r="3" fill="#1a1a1a"/>
        <ellipse cx="0" cy="5" rx="8" ry="6" fill="#D4A843"/><circle cx="0" cy="3" r="3" fill="#1a1a1a"/>
        <path d="M-4,8 Q0,13 4,8" stroke="#1a1a1a" strokeWidth="1.5" fill="none"/>
    </g>;
    const Cat = ({x,y,s=1,color='#F97316'}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="5" rx="15" ry="18" fill={color}/>
        <circle cx="0" cy="-12" r="13" fill={color}/>
        <polygon points="-12,-22 -8,-10 -16,-12" fill={color}/><polygon points="12,-22 8,-10 16,-12" fill={color}/>
        <circle cx="-5" cy="-14" r="3" fill="#22c55e"/><circle cx="5" cy="-14" r="3" fill="#22c55e"/>
        <circle cx="-5" cy="-14" r="1.5" fill="#1a1a1a"/><circle cx="5" cy="-14" r="1.5" fill="#1a1a1a"/>
        <ellipse cx="0" cy="-8" rx="3" ry="2" fill="#FDA4AF"/>
        {[-1,0,1].map(i=><line key={`l${i}`} x1="-20" y1={-10+i*3} x2="-12" y2={-9+i*2} stroke={color} strokeWidth="1" opacity="0.5"/>)}
        {[-1,0,1].map(i=><line key={`r${i}`} x1="20" y1={-10+i*3} x2="12" y2={-9+i*2} stroke={color} strokeWidth="1" opacity="0.5"/>)}
    </g>;
    const Bird = ({x,y,s=1,color='#3B82F6'}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="0" rx="12" ry="8" fill={color}/>
        <circle cx="10" cy="-5" r="7" fill={color}/>
        <circle cx="13" cy="-6" r="2" fill="#1a1a1a"/>
        <polygon points="17,-5 24,-3 17,-2" fill="#F59E0B"/>
        <path d="M-5,-5 L-15,-15 L-3,-8" fill={color}/>
        <path d="M-2,-3 L-10,-18 L2,-6" fill={color} opacity="0.8"/>
    </g>;
    const Rooster = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="5" rx="18" ry="20" fill="#DC2626"/>
        <circle cx="0" cy="-15" r="12" fill="#DC2626"/>
        <path d="M-2,-27 Q0,-35 5,-27 Q8,-35 10,-25" fill="#EF4444"/>
        <circle cx="-4" cy="-16" r="2.5" fill="white"/><circle cx="-4" cy="-16" r="1.5" fill="#1a1a1a"/>
        <polygon points="6,-15 16,-13 6,-11" fill="#F59E0B"/>
        <path d="M2,-8 Q5,-2 2,2" fill="#EF4444" opacity="0.7"/>
        <line x1="-5" y1="25" x2="-5" y2="35" stroke="#F59E0B" strokeWidth="3"/>
        <line x1="5" y1="25" x2="5" y2="35" stroke="#F59E0B" strokeWidth="3"/>
        <path d="M-15,0 Q-30,5 -20,15" fill="#1e3a8a" opacity="0.8"/>
        <path d="M-12,5 Q-25,12 -15,20" fill="#3B82F6" opacity="0.7"/>
    </g>;
    const Ant = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="-8" cy="0" rx="8" ry="5" fill="#4a2c2a"/>
        <circle cx="5" cy="-2" r="6" fill="#4a2c2a"/>
        <circle cx="3" cy="-4" r="1.5" fill="white"/><circle cx="7" cy="-4" r="1.5" fill="white"/>
        <line x1="2" y1="-8" x2="-3" y2="-15" stroke="#4a2c2a" strokeWidth="1.5"/>
        <line x1="6" y1="-8" x2="10" y2="-15" stroke="#4a2c2a" strokeWidth="1.5"/>
        <line x1="-5" y1="5" x2="-10" y2="12" stroke="#4a2c2a" strokeWidth="1.5"/>
        <line x1="0" y1="5" x2="0" y2="13" stroke="#4a2c2a" strokeWidth="1.5"/>
        <line x1="5" y1="4" x2="10" y2="12" stroke="#4a2c2a" strokeWidth="1.5"/>
    </g>;
    const Rabbit = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="5" rx="15" ry="18" fill="#E5E7EB"/>
        <circle cx="0" cy="-12" r="12" fill="#E5E7EB"/>
        <ellipse cx="-6" cy="-30" rx="5" ry="14" fill="#E5E7EB"/><ellipse cx="6" cy="-30" rx="5" ry="14" fill="#E5E7EB"/>
        <ellipse cx="-6" cy="-30" rx="3" ry="10" fill="#FDA4AF"/>
        <ellipse cx="6" cy="-30" rx="3" ry="10" fill="#FDA4AF"/>
        <circle cx="-5" cy="-14" r="3" fill="#EC4899"/><circle cx="5" cy="-14" r="3" fill="#EC4899"/>
        <circle cx="-5" cy="-14" r="1.5" fill="#1a1a1a"/><circle cx="5" cy="-14" r="1.5" fill="#1a1a1a"/>
        <ellipse cx="0" cy="-7" rx="3" ry="2" fill="#FDA4AF"/>
    </g>;
    const Turtle = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="#16a34a"/>
        <path d="M-10,-8 L0,-15 L10,-8" fill="#15803d"/><path d="M-8,0 L0,-10 L8,0" fill="#15803d"/>
        <circle cx="18" cy="2" r="6" fill="#86EFAC"/>
        <circle cx="20" cy="0" r="1.5" fill="#1a1a1a"/>
        <rect x="-15" y="10" width="6" height="8" rx="2" fill="#86EFAC"/>
        <rect x="9" y="10" width="6" height="8" rx="2" fill="#86EFAC"/>
    </g>;
    const Horse = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="0" rx="28" ry="18" fill="#92400E"/>
        <ellipse cx="25" cy="-15" rx="10" ry="14" fill="#92400E"/>
        <ellipse cx="30" cy="-18" rx="4" ry="8" fill="#78350F"/>
        <circle cx="30" cy="-20" r="2" fill="#1a1a1a"/>
        <path d="M20,-28 Q25,-40 22,-25" stroke="#1a1a1a" strokeWidth="2" fill="none"/>
        <rect x="-18" y="15" width="5" height="20" fill="#78350F"/><rect x="-8" y="15" width="5" height="20" fill="#78350F"/>
        <rect x="8" y="15" width="5" height="20" fill="#78350F"/><rect x="18" y="15" width="5" height="20" fill="#78350F"/>
        <path d="M-25,0 Q-35,10 -30,20" stroke="#1a1a1a" strokeWidth="2" fill="none"/>
    </g>;
    const Bee = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <ellipse cx="0" cy="0" rx="10" ry="7" fill="#FCD34D"/>
        <rect x="-3" y="-7" width="6" height="14" fill="#1a1a1a" opacity="0.4"/>
        <ellipse cx="-8" cy="-8" rx="8" ry="5" fill="white" opacity="0.6" transform="rotate(-20)"/>
        <ellipse cx="8" cy="-8" rx="8" ry="5" fill="white" opacity="0.6" transform="rotate(20)"/>
        <circle cx="10" cy="-1" r="2" fill="#1a1a1a"/>
        <line x1="-3" y1="-7" x2="-5" y2="-12" stroke="#1a1a1a" strokeWidth="1"/>
        <line x1="3" y1="-7" x2="5" y2="-12" stroke="#1a1a1a" strokeWidth="1"/>
    </g>;
    const Boy = ({x,y,s=1,shirt='#3B82F6',skin='#FBBF24'}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <rect x="-12" y="0" width="24" height="30" fill={shirt} rx="4"/>
        <circle cx="0" cy="-12" r="14" fill={skin}/>
        <circle cx="-5" cy="-14" r="2.5" fill="#1a1a1a"/><circle cx="5" cy="-14" r="2.5" fill="#1a1a1a"/>
        <path d="M-4,-7 Q0,-4 4,-7" stroke="#1a1a1a" strokeWidth="1.5" fill="none"/>
        <rect x="-15" y="-26" width="30" height="14" fill="#1a1a1a" rx="4"/>
        <rect x="-6" y="30" width="5" height="15" fill={skin}/><rect x="1" y="30" width="5" height="15" fill={skin}/>
    </g>;
    const Girl = ({x,y,s=1,dress='#EC4899',skin='#FBBF24'}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <path d="M-12,0 L-18,35 L18,35 L12,0" fill={dress}/>
        <circle cx="0" cy="-12" r="14" fill={skin}/>
        <circle cx="-5" cy="-14" r="2.5" fill="#1a1a1a"/><circle cx="5" cy="-14" r="2.5" fill="#1a1a1a"/>
        <path d="M-4,-7 Q0,-3 4,-7" stroke="#1a1a1a" strokeWidth="1.5" fill="none"/>
        <path d="M-14,-20 Q-18,5 -16,10" stroke="#1a1a1a" strokeWidth="3" fill="none"/>
        <path d="M14,-20 Q18,5 16,10" stroke="#1a1a1a" strokeWidth="3" fill="none"/>
        <rect x="-14" y="-26" width="28" height="10" fill="#1a1a1a" rx="5"/>
    </g>;
    const OldWoman = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <path d="M-12,0 L-16,35 L16,35 L12,0" fill="#8B5CF6"/>
        <circle cx="0" cy="-12" r="14" fill="#FBBF24"/>
        <circle cx="-5" cy="-14" r="2" fill="#1a1a1a"/><circle cx="5" cy="-14" r="2" fill="#1a1a1a"/>
        <path d="M-4,-7 Q0,-4 4,-7" stroke="#1a1a1a" strokeWidth="1.5" fill="none"/>
        <path d="M-14,-22 Q-16,-5 -14,0" stroke="#9CA3AF" strokeWidth="3" fill="none"/>
        <path d="M14,-22 Q16,-5 14,0" stroke="#9CA3AF" strokeWidth="3" fill="none"/>
        <ellipse cx="0" cy="-25" rx="16" ry="6" fill="white" opacity="0.7"/>
    </g>;
    const Book = ({x,y,s=1,color='#3B82F6'}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <rect x="-12" y="-8" width="24" height="16" fill={color} rx="2"/>
        <line x1="0" y1="-8" x2="0" y2="8" stroke="white" strokeWidth="1"/>
        <rect x="-10" y="-5" width="8" height="2" fill="white" opacity="0.5" rx="1"/>
        <rect x="-10" y="0" width="6" height="2" fill="white" opacity="0.5" rx="1"/>
    </g>;
    const Mosque = ({x,y,s=1}) => <g transform={`translate(${x},${y}) scale(${s})`}>
        <rect x="-30" y="-40" width="60" height="40" fill="#FEF3C7" stroke="#D97706" strokeWidth="1.5"/>
        <path d="M-30,-40 Q0,-70 30,-40" fill="#10B981"/>
        <circle cx="0" cy="-55" r="4" fill="#FCD34D"/>
        <rect x="30" y="-65" width="8" height="65" fill="#FEF3C7" stroke="#D97706" strokeWidth="1"/>
        <path d="M30,-65 Q34,-75 38,-65" fill="#10B981"/>
        <rect x="-8" y="-25" width="16" height="25" fill="#92400E" rx="8 8 0 0"/>
    </g>;

    // ====== STORY ILLUSTRATIONS ======
    const illustrations = {
        bear_honey: () => <Sky color1="#87CEEB" color2="#C8E6C9"><Sun/><Cloud x={80} y={40}/><Ground color="#4ade80"/><Tree x={60} y={220}/><Tree x={330} y={220} s={0.8}/><Bear x={200} y={185} s={1.8}/><rect x="160" y="200" width="30" height="20" rx="5" fill="#FCD34D" opacity="0.8"/><Tree x={200} y={220} s={1.2}/></Sky>,
        cat_milk: () => <Sky color1="#FDE68A" color2="#FEF3C7"><Sun x={60} y={45}/><Cloud x={200} y={35}/><Ground color="#86EFAC"/><House x={300} y={220}/><Boy x={150} y={185} s={1.5}/><Cat x={220} y={200} s={1.5}/><ellipse cx="190" cy="218" rx="10" ry="5" fill="white"/></Sky>,
        sami_ball: () => <Sky color1="#93C5FD" color2="#DBEAFE"><Sun/><Cloud x={120} y={30}/><Ground color="#86EFAC"/><Tree x={40} y={220}/><Tree x={360} y={220}/><Boy x={160} y={185} s={1.5}/><circle cx="230" cy="210" r="15" fill="#EF4444"/><circle cx="230" cy="205" r="3" fill="white" opacity="0.5"/><Boy x={300} y={185} s={1.3} shirt="#10B981"/></Sky>,
        bird_nest: () => <Sky color1="#BAE6FD" color2="#E0F2FE"><Sun x={350} y={40}/><Cloud x={100} y={25} s={0.8}/><Ground color="#4ade80"/><Tree x={200} y={220} s={1.5}/><Bird x={200} y={130} s={2}/><Boy x={120} y={185} s={1.3}/><ellipse cx="215" cy="148" rx="12" ry="5" fill="#92400E"/></Sky>,
        sami_neighbor: () => <Sky color1="#FDE68A" color2="#FEF9C4"><Sun x={340} y={40}/><Cloud x={80} y={30}/><Ground color="#86EFAC"/><House x={80} y={220}/><House x={320} y={220}/><Boy x={170} y={185} s={1.5}/><Boy x={240} y={185} s={1.4} shirt="#EF4444"/><rect x="195" y="205" width="20" height="8" rx="3" fill="#D4A843"/></Sky>,
        rooster_village: () => <Sky color1="#1e3a5f" color2="#F59E0B"><Moon x={60} y={40}/><Stars/><Ground color="#365314"/><House x={80} y={220}/><House x={220} y={220}/><House x={340} y={220}/><Rooster x={150} y={175} s={1.5}/></Sky>,
        boy_tree: () => <Sky color1="#87CEEB" color2="#DCFCE7"><Sun/><Cloud x={150} y={30}/><Ground color="#4ade80"/><Boy x={180} y={185} s={1.5}/><Tree x={250} y={220} s={1.3}/><Flower x={100} y={215} color="#ec4899"/><Flower x={130} y={218} color="#f59e0b"/><Flower x={320} y={212} color="#8b5cf6"/><rect x="170" y="208" width="15" height="10" rx="2" fill="#93C5FD"/></Sky>,
        rabbit_turtle: () => <Sky color1="#FDE68A" color2="#ECFCCB"><Sun x={340} y={40}/><Cloud x={100} y={30}/><Ground color="#86EFAC"/><Rabbit x={100} y={190} s={1.5}/><Turtle x={280} y={208} s={1.5}/><path d="M50,225 Q200,215 380,225" stroke="#D97706" strokeWidth="3" strokeDasharray="8,4" fill="none"/><text x="200" y="245" textAnchor="middle" fill="#D97706" fontSize="14" fontWeight="bold">خَطُّ النِّهَايَةِ</text></Sky>,
        ant_sister: () => <Sky color1="#DCFCE7" color2="#F0FDF4"><Sun x={50} y={40}/><Cloud x={300} y={25}/><Ground color="#4ade80"/><Ant x={180} y={215} s={2}/><Ant x={210} y={215} s={2}/><ellipse cx="195" cy="210" rx="6" ry="4" fill="#FCD34D"/><Flower x={100} y={215}/><Flower x={320} y={218} color="#8b5cf6"/></Sky>,
        maryam_garden: () => <Sky color1="#FBCFE8" color2="#FCE7F3"><Sun x={340} y={40}/><Cloud x={100} y={25}/><Ground color="#86EFAC"/><Girl x={200} y={185} s={1.5}/><Flower x={100} y={215} color="#ec4899"/><Flower x={130} y={210} color="#f59e0b"/><Flower x={160} y={218} color="#8b5cf6"/><Flower x={250} y={212} color="#ef4444"/><Flower x={280} y={216} color="#3b82f6"/><Flower x={310} y={210} color="#ec4899"/><rect x="170" y="208" width="12" height="10" rx="2" fill="#93C5FD"/></Sky>,

        try {

            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type==='correct'){osc.frequency.value=880;gain.gain.value=0.15;osc.start();osc.stop(audioCtx.currentTime+0.15);}
            else if(type==='error'){osc.frequency.value=200;osc.type='sawtooth';gain.gain.value=0.1;osc.start();osc.stop(audioCtx.currentTime+0.2);}

                    {filterLevel > 0 && (
                        <div className="flex justify-center mb-6 px-4">
                            <div className="bg-white rounded-3xl border-2 border-slate-200 shadow-sm px-6 py-4 max-w-2xl w-full text-right space-y-2">
                                <div className="flex items-center gap-2 justify-between flex-wrap">
                                    <span className="font-black text-lg" style={{ color: levelLabels[filterLevel].color === '#dcb897' ? '#b8926a' : levelLabels[filterLevel].color }}>📋 دليل المعلم — {levelLabels[filterLevel].name}</span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                                    <div className="bg-badeec-sky rounded-2xl p-3">
                                        <div className="font-black text-badeec-teal mb-1">🔢 عدد الكلمات</div>
                                        <div className="font-bold text-slate-600 leading-relaxed">{levelLabels[filterLevel].words}</div>
                                    </div>
                                    <div className="bg-badeec-sky rounded-2xl p-3">
                                        <div className="font-black text-badeec-teal mb-1">🔤 شكل اللغة</div>
                                        <div className="font-bold text-slate-600 leading-relaxed">{levelLabels[filterLevel].lang}</div>
                                    </div>
                                    <div className="bg-badeec-sky rounded-2xl p-3">
                                        <div className="font-black text-badeec-teal mb-1">💎 القيم التربوية</div>
                                        <div className="font-bold text-slate-600 leading-relaxed">{levelLabels[filterLevel].values}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Stories Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-6 md:px-8 pb-12 max-w-7xl mx-auto">
                        {filtered.map(story => {
                            const Illust = illustrations[story.illustration];
                            return (
                                <button key={story.id} onClick={() => openStory(story)}
                                    className="bg-white rounded-[2rem] overflow-hidden border-4 border-slate-200 hover:border-badeec-teal hover:-translate-y-1 hover:shadow-xl transition-all group text-right shadow-sm">
                                    <div className="relative overflow-hidden">
                                        {Illust ? <Illust/> : <div className="h-36 flex items-center justify-center text-7xl" style={{ backgroundColor: story.color + '22' }}>{story.emoji}</div>}
                                        <div className="absolute top-3 right-3 px-3 py-1.5 rounded-full text-xs font-black text-white shadow-sm" style={{ backgroundColor: levelLabels[story.level].color }}>
                                            المستوى {story.level}
                                        </div>
                                        <div className="absolute bottom-3 left-3 text-3xl">{story.emoji}</div>
                                    </div>
                                    <div className="p-5">
                                        <h3 className="font-naskh text-xl font-bold text-badeec-navy mb-1 overflow-visible leading-relaxed">{story.title}</h3>
                                        <p className="text-sm text-slate-500 font-bold">{story.value}</p>
                                        <div className="flex h-2 w-full rounded-full overflow-hidden mt-3 bg-slate-100" style={{ direction: 'ltr' }}>
                                            <div style={{ width: story.basicPct + '%' }} className="bg-badeec-teal rounded-full"></div>
                                            <div style={{ width: story.advPct + '%', backgroundColor: story.color }} className="rounded-full"></div>
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ====== SCAFFOLD WORDS VIEW ======
        if (view === 'scaffold' && currentStory) {
            const story = currentStory;
            const Illust = illustrations[story.illustration];
            const words = story.scaffoldWords || [];
            const currentWord = words[scaffoldIdx];
            const progress = words.length > 0 ? ((scaffoldIdx + 1) / words.length) * 100 : 0;

            return (
                <div className="min-h-screen flex flex-col bg-badeec-sky">
                    <div className="flex items-center justify-between p-4 bg-white border-b-4 border-slate-200 shadow-sm">
                        <button onClick={() => setView('menu')} className="flex items-center gap-2 px-5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-badeec-navy font-black text-sm transition-all">
                            → العودة
                        </button>
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">{story.emoji}</span>
                            <span className="font-naskh text-xl text-badeec-navy font-bold overflow-visible leading-relaxed">{story.title}</span>
                        </div>
                        <div className="px-4 py-1.5 rounded-full text-xs font-black text-white bg-amber-500">
                            تهيئة الكلمات
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-6 gap-6 max-w-2xl mx-auto w-full">
                        <div className="text-center mb-2">
                            <h2 className="text-3xl font-black text-badeec-navy font-baloo mb-1">🔤 كلمات القصة</h2>
                            <p className="text-slate-500 font-bold">تعرّف على الكلمات قبل قراءة القصة</p>
                        </div>

                        {/* Progress bar */}
                        <div className="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
                            <div className="h-full bg-badeec-teal rounded-full transition-all duration-500" style={{ width: progress + '%' }}></div>
                        </div>
                        <p className="text-sm text-slate-500 font-bold">{scaffoldIdx + 1} / {words.length}</p>

                        {/* Word Card */}
                        {currentWord && (
                            <div onClick={() => { setScaffoldFlip(!scaffoldFlip); playSound('pop'); }}
                                className="w-full bg-white rounded-[2rem] border-4 border-slate-200 p-8 cursor-pointer hover:border-badeec-teal transition-all transform hover:scale-[1.02] min-h-[200px] flex flex-col items-center justify-center gap-6 shadow-sm">
                                {!scaffoldFlip ? (
                                    <>
                                        <div className="font-naskh text-5xl md:text-6xl text-badeec-navy font-bold overflow-visible leading-relaxed">{currentWord.word}</div>
                                        <p className="text-slate-400 text-sm font-bold">اضغط لرؤية المقاطع</p>
                                    </>
                                ) : (
                                    <>
                                        <div className="flex gap-3 flex-wrap justify-center">
                                            {currentWord.syllables.map((syl, si) => (
                                                <span key={si} className="font-naskh text-4xl md:text-5xl px-5 py-2 rounded-2xl text-badeec-navy font-bold overflow-visible leading-relaxed bg-badeec-teal/10 border-2 border-badeec-teal">
                                                    {syl}
                                                </span>
                                            ))}
                                        </div>
                                        <div className="flex gap-1 items-center text-2xl text-slate-500">
                                            {currentWord.syllables.map((syl, si) => (
                                                <React.Fragment key={si}>
                                                    <span className="font-naskh overflow-visible">{syl}</span>
                                                    {si < currentWord.syllables.length - 1 && <span className="text-slate-400 mx-1">+</span>}
                                                </React.Fragment>
                                            ))}
                                            <span className="text-slate-400 mx-2">=</span>
                                            <span className="font-naskh font-bold text-badeec-teal overflow-visible">{currentWord.word}</span>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* Word dots */}
                        <div className="flex gap-2 flex-wrap justify-center">
                            {words.map((w, i) => (
                                <div key={i} className="w-3 h-3 rounded-full transition-all" style={{
                                    backgroundColor: i < scaffoldIdx ? '#0e8a9c' : i === scaffoldIdx ? '#f15a68' : '#cbd5e1',
                                    transform: i === scaffoldIdx ? 'scale(1.3)' : 'scale(1)'
                                }}></div>
                            ))}
                        </div>

                        {/* Controls */}
                        <div className="w-full flex gap-4">
                            {scaffoldIdx < words.length - 1 ? (
                                <button onClick={() => { setScaffoldIdx(scaffoldIdx + 1); setScaffoldFlip(false); playSound('pop'); }}
                                    className="flex-1 py-4 rounded-2xl text-xl font-black text-white bg-badeec-teal transition-all hover:bg-badeec-deep active:scale-95 shadow-md">
                                    الكلمة التالية ← ({scaffoldIdx + 2}/{words.length})
                                </button>
                            ) : (
                                <button onClick={() => { setView('reading'); playSound('correct'); }}
                                    className="flex-1 py-4 rounded-2xl text-xl font-black text-white bg-badeec-coral transition-all hover:bg-rose-500 active:scale-95 shadow-md animate-pulse">
                                    ابدأ القراءة 📖
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ====== READING VIEW ======
        if (view === 'reading' && currentStory) {
            const story = currentStory;
            const Illust = illustrations[story.illustration];
            const allQDone = qIdx >= story.questions.length;

            return (
                <div className="min-h-screen flex flex-col bg-badeec-sky">
                    {/* Top bar */}
                    <div className="flex items-center justify-between p-4 bg-white border-b-4 border-slate-200 shadow-sm">
                        <button onClick={() => setView('menu')} className="flex items-center gap-2 px-5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-badeec-navy font-black text-sm transition-all">
                            → العودة
                        </button>
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">{story.emoji}</span>
                            <span className="font-naskh text-xl text-badeec-navy font-bold overflow-visible leading-relaxed">{story.title}</span>
                        </div>
                        <div className="px-4 py-1.5 rounded-full text-xs font-black text-white" style={{ backgroundColor: story.color }}>
                            {story.value}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-6 gap-6 max-w-3xl mx-auto w-full">
                        {/* Illustration */}
                        <div className="w-full rounded-[2rem] overflow-hidden shadow-lg border-4 border-slate-200 bg-white">
                            {story.hasImages ? (
                                <img
                                    src={'story_images/s' + String(story.id).padStart(2,'0') + '_' + String(sentIdx + 1).padStart(2,'0') + '.png'}
                                    alt={story.title + ' - ' + (sentIdx+1)}
                                    className="w-full h-auto"
                                    style={{display:'block'}}
                                />
                            ) : Illust ? <Illust/> : null}
                        </div>

                        {/* Story text */}
                        <div className="bg-white rounded-[2rem] p-6 w-full border-4 border-slate-200 shadow-sm">
                            <div className="space-y-4">
                                {story.sentences.map((sent, si) => (
                                    <div key={si} className="flex flex-wrap gap-3 items-center font-naskh text-2xl md:text-3xl leading-relaxed overflow-visible">
                                        <span className="w-7 h-7 rounded-full text-white text-xs font-black flex items-center justify-center flex-shrink-0 bg-badeec-teal">
                                            {si + 1}
                                        </span>
                                        {sent.map((word, wi) => {
                                            const isRevealed = si < sentIdx || (si === sentIdx && wi <= wordIdx);
                                            const isCurrent = si === sentIdx && wi === wordIdx && !done;
                                            return (
                                                <span key={wi}
                                                    className={`px-2 py-1 rounded-xl transition-all duration-300 overflow-visible ${isCurrent ? 'ring-2 ring-badeec-coral scale-110 bg-badeec-teal/10 shadow-md' : ''}`}
                                                    style={{
                                                        filter: isRevealed ? 'none' : 'blur(8px)',
                                                        opacity: isRevealed ? 1 : 0.15,
                                                        color: isCurrent ? '#0e8a9c' : isRevealed ? '#2b3044' : '#94a3b8'
                                                    }}>
                                                    {word}
                                                </span>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="w-full">
                            {!done ? (
                                <button onClick={advanceWord}
                                    className="w-full py-4 rounded-2xl text-xl font-black text-white bg-badeec-teal transition-all hover:bg-badeec-deep active:scale-95 shadow-md animate-pulse">
                                    الكلمة التالية ←
                                </button>
                            ) : !qPhase ? (
                                <button onClick={() => { setQPhase(true); playSound('correct'); }}
                                    className="w-full py-4 rounded-2xl text-xl font-black text-white bg-badeec-coral transition-all hover:bg-rose-500 active:scale-95 shadow-md">
                                    أسئلة الفهم ❓
                                </button>
                            ) : !allQDone ? (
                                <div className="bg-white rounded-[2rem] p-6 border-4 border-slate-200 shadow-sm">
                                    <p className="font-naskh text-2xl text-center text-badeec-navy mb-4 font-bold overflow-visible leading-relaxed">{story.questions[qIdx].q}</p>
                                    <div className="flex flex-col gap-3">
                                        {story.questions[qIdx].options.map((opt, oi) => {
                                            const isCorrect = oi === story.questions[qIdx].a;
                                            const isSel = qSel === oi;
                                            let cls = 'bg-slate-50 hover:bg-slate-100 text-badeec-navy border-slate-200';
                                            if (isSel && isCorrect) cls = 'bg-emerald-50 ring-2 ring-emerald-500 text-emerald-700 border-emerald-300';
                                            if (isSel && !isCorrect) cls = 'bg-red-50 ring-2 ring-red-400 text-red-700 border-red-300';
                                            return (
                                                <button key={oi} disabled={qSel !== null}
                                                    onClick={() => {
                                                        setQSel(oi);
                                                        playSound(isCorrect ? 'correct' : 'error');
                                                        setTimeout(() => { setQResults([...qResults, isCorrect]); setQIdx(qIdx+1); setQSel(null); }, 1000);
                                                    }}
                                                    className={`font-naskh text-xl p-4 rounded-2xl border-2 transition-all overflow-visible leading-relaxed font-bold ${cls}`}>
                                                    {opt}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white rounded-[2rem] border-4 border-slate-200 shadow-sm p-8 text-center space-y-4">
                                    <div className="text-6xl">🌟</div>
                                    <p className="text-2xl font-black text-badeec-navy">أحسنت! أنهيت القصة</p>
                                    <p className="text-lg font-bold text-badeec-teal">✅ {qResults.filter(Boolean).length} / {story.questions.length} إجابات صحيحة</p>
                                    <div className="flex gap-4 justify-center mt-4">
                                        <button onClick={() => setView('menu')}
                                            className="px-8 py-3 rounded-2xl bg-slate-100 text-badeec-navy text-lg font-black hover:bg-slate-200 transition-all border-2 border-slate-200">
                                            القائمة
                                        </button>
                                        {story.id < 20 && (
                                            <button onClick={() => openStory(storiesData[story.id])}
                                                className="px-8 py-3 rounded-2xl text-white text-lg font-black bg-badeec-teal hover:bg-badeec-deep transition-all shadow-md">
                                                القصة التالية ←
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
