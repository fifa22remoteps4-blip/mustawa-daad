                                                <h3 className="font-baloo text-3xl font-black text-badeec-navy">كيف ننطق حركة ({activeData.badge}) ؟</h3>
                                                <div className="bg-white rounded-2xl p-6 border-2 border-teal-100 shadow-inner"><p className="font-cairo text-lg font-bold text-slate-700 leading-relaxed">{activeData.warmup.story}</p></div>
                                                <div className="bg-amber-100 rounded-2xl p-6 border-2 border-dashed border-amber-300"><p className="font-baloo text-xl font-black text-amber-950 leading-relaxed">{activeData.warmup.action}</p></div>
                                                <button onClick={() => setReadingStation(activeData.algorithm ? 'algorithm' : (activeData.hasAlphabetBoard ? 'letters_board' : 'spelling'))} className="bg-badeec-teal text-white px-10 py-4 rounded-2xl font-black text-lg shadow-lg flex items-center gap-3 mx-auto">هيا للدرس <Icon name="ArrowLeft" size={20} /></button>
                                            </div>
                                        </div>
                                    )}

                                    {/* لوحة الحروف */}
                                    {readingStation === 'letters_board' && (
                                        <div className="flex-1 flex flex-col justify-center animate-pop-in space-y-6">
                                            <div className="text-center max-w-lg mx-auto"><h4 className="text-2xl font-baloo font-black text-badeec-navy">لوحة أصوات الحروف المفتوحة 🅰️</h4></div>
                                            <div className="grid grid-cols-4 sm:grid-cols-7 gap-3 max-w-4xl mx-auto p-6 bg-slate-50 rounded-[2.5rem] border border-slate-200">
                                                {ARABIC_LETTERS_FATHA.map((item, idx) => <button key={idx} onClick={() => { playSoundEffect('pop'); speakText(item); }} className="h-16 rounded-2xl bg-white border-b-4 border-slate-300 shadow-sm hover:border-b-0 hover:translate-y-1 hover:bg-badeec-teal hover:text-white reading-naskh font-black text-3xl text-slate-700 transition-all flex items-center justify-center">{item}</button>)}
                                            </div>
                                            <div className="text-center"><button onClick={() => setReadingStation(activeData.algorithm ? 'algorithm' : 'spelling')} className="bg-badeec-teal text-white px-8 py-3.5 rounded-2xl font-black shadow-md mx-auto">{activeData.algorithm ? 'انتقل للخوارزمية ←' : 'انتقل لدمج الكلمات ←'}</button></div>
                                        </div>
                                    )}

                                    {/* الخوارزمية التمهيدية (المحطة 1 فقط حالياً) */}
                                    {readingStation === 'algorithm' && activeData.algorithm && (
                                        <div className="flex-1 flex flex-col animate-pop-in space-y-6 max-w-5xl mx-auto w-full">
                                            <div className="text-center space-y-2">
                                                <div className="inline-flex items-center gap-2 bg-amber-100 text-amber-900 px-4 py-1.5 rounded-full font-black text-xs shadow-sm border border-amber-200">⚙ خطوات القراءة الواعية</div>
                                                <h4 className="text-2xl md:text-3xl font-baloo font-black text-badeec-navy">{activeData.algorithm.title}</h4>
                                                <p className="text-sm md:text-base text-slate-600 font-bold max-w-2xl mx-auto leading-relaxed">{activeData.algorithm.intro}</p>
                                            </div>

                                            {/* بطاقات الخطوات الأربع */}
                                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                                {activeData.algorithm.steps.map((step) => (
                                                    <div key={step.num} className="bg-white rounded-3xl border-2 border-slate-200 shadow-md p-5 flex flex-col items-center text-center gap-3 hover:border-badeec-teal transition-all relative overflow-hidden">
                                                        <span className="absolute top-2 right-2 text-[10px] font-black text-slate-300">STEP</span>
                                                        <div className="w-12 h-12 rounded-full bg-badeec-teal text-white font-baloo font-black text-2xl flex items-center justify-center shadow-md">{step.num}</div>
                                                        <h5 className="font-baloo text-lg font-black text-badeec-navy leading-tight">{step.label}</h5>
                                                        <p className="text-xs text-slate-500 font-bold">{step.hint}</p>
                                                        <button onClick={() => { playSoundEffect('pop'); if (step.demo !== '⏸') speakText(step.demo); }} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl py-4 reading-naskh text-5xl font-black text-badeec-navy hover:bg-badeec-teal hover:text-white hover:border-badeec-teal transition-all">{step.demo}</button>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* مثال الدمج النهائي */}
                                            <div className="bg-gradient-to-br from-teal-50 to-emerald-50 rounded-[2rem] border-4 border-white shadow-xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-center gap-6">
                                                <div className="text-center">
                                                    <span className="text-[11px] font-black text-slate-500 block mb-2">المثال الكامل</span>
                                                    <div className="flex items-center gap-3 justify-center reading-naskh">
                                                        <button onClick={() => speakText(activeData.algorithm.example.letter)} className="text-5xl font-black bg-white rounded-2xl px-4 py-2 shadow-sm border border-slate-200 hover:border-badeec-teal">{activeData.algorithm.example.letter}</button>
                                                        <span className="text-2xl text-slate-400 font-black">+</span>
                                                        <button onClick={() => speakText('فتحة')} className="text-5xl font-black bg-white rounded-2xl px-4 py-2 shadow-sm border border-slate-200 hover:border-badeec-teal">{activeData.algorithm.example.harakah}</button>
                                                        <span className="text-2xl text-slate-400 font-black">=</span>
                                                        <button onClick={() => { playSoundEffect('pop'); speakText(activeData.algorithm.example.merged); }} className="text-5xl font-black bg-badeec-teal text-white rounded-2xl px-5 py-2 shadow-md">{activeData.algorithm.example.merged}</button>
                                                    </div>
                                                </div>
                                            </div>

                                            <p className="text-center text-sm font-bold text-slate-600 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 max-w-2xl mx-auto">💡 {activeData.algorithm.closingNote}</p>

                                            <div className="text-center pt-2"><button onClick={() => setReadingStation('binary_syllables')} className="bg-badeec-teal text-white px-10 py-4 rounded-2xl font-black text-lg shadow-lg inline-flex items-center gap-2">طبّق على المقاطع الثنائية <Icon name="ArrowLeft" size={20} /></button></div>
                                        </div>
                                    )}

                                    {/* المقاطع الثنائية */}
                                    {readingStation === 'binary_syllables' && activeData.binarySyllables && (
                                        <div className="flex-1 flex flex-col animate-pop-in space-y-6 max-w-5xl mx-auto w-full">
                                            <div className="text-center space-y-2">
                                                <div className="inline-flex items-center gap-2 bg-rose-100 text-rose-900 px-4 py-1.5 rounded-full font-black text-xs shadow-sm border border-rose-200">◐ تطبيق الخوارزمية</div>
                                                <h4 className="text-2xl md:text-3xl font-baloo font-black text-badeec-navy">{activeData.binarySyllables.title}</h4>
                                                <p className="text-sm md:text-base text-slate-600 font-bold max-w-2xl mx-auto leading-relaxed">{activeData.binarySyllables.intro}</p>
                                            </div>

                                            {/* شبكة المقاطع الثنائية */}
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 p-4 md:p-6 bg-slate-50 rounded-[2rem] border border-slate-200">
                                                {activeData.binarySyllables.pairs.map((pair, idx) => (
                                                    <div key={idx} className="bg-white rounded-2xl border-2 border-slate-200 shadow-sm p-3 flex items-center justify-center gap-2 hover:border-badeec-coral transition-all relative">
                                                        <span className="absolute top-1.5 right-2 text-[10px] font-black text-slate-300">{idx + 1}</span>
                                                        <button onClick={() => { playSoundEffect('pop'); speakText(pair.left); }} className="reading-naskh text-3xl md:text-4xl font-black text-badeec-navy hover:text-badeec-coral transition-colors px-1">{pair.left}</button>
                                                        <span className="text-slate-300 font-black text-lg">•</span>
                                                        <button onClick={() => { playSoundEffect('pop'); speakText(pair.right); }} className="reading-naskh text-3xl md:text-4xl font-black text-badeec-navy hover:text-badeec-coral transition-colors px-1">{pair.right}</button>
                                                        <button onClick={() => { playSoundEffect('star'); speakText(pair.left + pair.right); }} className="absolute bottom-1 left-1 w-6 h-6 rounded-full bg-badeec-teal text-white text-[10px] font-black flex items-center justify-center shadow-sm" title="اقرأ معاً">▶</button>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* تعليمات للمعلم */}
                                            <div className="bg-white border-2 border-dashed border-amber-300 rounded-2xl p-4 max-w-3xl mx-auto text-center">
                                                <span className="text-[11px] font-black text-amber-700 block mb-1">إرشاد للمعلم</span>
                                                <p className="text-sm font-bold text-slate-700 leading-relaxed">اطلب من الطالب نطق كل مقطع وحده أولاً، ثم اضغط الزر الأخضر (▶) لينطقهما متتاليَين بنَفَس واحد. هذه هي خطوة "الدمج" في الخوارزمية.</p>
                                            </div>

                                            <div className="text-center pt-2"><button onClick={() => setReadingStation('spelling')} className="bg-badeec-teal text-white px-10 py-4 rounded-2xl font-black text-lg shadow-lg inline-flex items-center gap-2">انتقل لكلمات الفتحة <Icon name="ArrowLeft" size={20} /></button></div>
                                        </div>
                                    )}

                                    {/* التهجئة (التدرج التراكمي) */}
                                    {readingStation === 'spelling' && activeWord && (
                                        <div className="flex-1 flex flex-col justify-between animate-pop-in space-y-6">
                                            <div className="text-center space-y-1"><h4 className="text-2xl font-baloo font-black text-badeec-navy">اقرأ الكلمة لتربح الرسم التوضيحي 🎨</h4><span className="bg-badeec-teal text-white text-xs font-black px-3 py-1 rounded-full inline-block mt-2">الكلمة {activeWordIdx + 1} من {activeWords.length}</span></div>
                                            <div className="flex flex-col md:flex-row gap-8 items-center flex-1 w-full max-w-4xl mx-auto">
                                                <div className="flex-1 w-full"><SpellingMachine wordObj={activeWord} onComplete={() => setWordRevealed(true)} /></div>
                                                <div className="w-full md:w-80 h-72 shrink-0 flex items-center justify-center relative">
                                                    {!wordRevealed ? (
                                                        <div className="w-full h-full border-4 border-dashed border-slate-300 bg-slate-50 rounded-[2.5rem] flex flex-col items-center justify-center p-6 text-center shadow-inner"><span className="text-6xl opacity-40 mb-2 animate-pulse-soft">❓</span><span className="text-xs text-slate-400 font-black">ادمج الكلمة للمكافأة!</span></div>
                                                    ) : (
                                                        <div className="w-full h-full animate-pop-in flex flex-col justify-center text-center p-2"><div className="w-56 h-56 mx-auto"><SmartImage src={currentChapter === 0 ? getWordImg(activeData.id, activeWordIdx) : null} action={activeWord.word} /></div><div className="mt-4 bg-slate-50 rounded-2xl p-3 border-2 border-slate-100 shadow-sm"><h5 className="font-baloo text-2xl font-black text-badeec-navy">{activeWord.word}</h5><p className="text-xs text-slate-500 font-bold">{activeWord.desc}</p></div></div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center border-t border-slate-100 pt-6 w-full max-w-4xl mx-auto">
                                                <button onClick={() => { setActiveWordIdx(p => Math.max(0, p - 1)); setWordRevealed(false); }} disabled={activeWordIdx === 0} className="text-slate-400 font-black text-sm disabled:opacity-30 flex items-center gap-1"><Icon name="ArrowRight" size={16} /> السابق</button>
                                                {activeWordIdx < activeWords.length - 1 ? (
                                                    <button onClick={() => { setActiveWordIdx(p => p + 1); setWordRevealed(false); }} className="bg-badeec-navy text-white px-8 py-3 rounded-2xl text-sm font-black shadow-md">الكلمة التالية</button>
                                                ) : (
                                                    <button onClick={() => setReadingStation('story')} className="bg-badeec-teal text-white px-8 py-3 rounded-2xl text-sm font-black shadow-md flex items-center gap-1.5">اليوميات البصرية <Icon name="ArrowLeft" size={16} /></button>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {/* اليوميات البصرية */}
                                    {readingStation === 'story' && (
                                        <div className="flex-1 flex flex-col justify-center animate-pop-in space-y-8">
                                            <div className="text-center space-y-2"><h4 className="text-3xl font-baloo font-black text-badeec-navy">يوميات البطل (متتاليات بصرية) 📖</h4></div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto w-full">
                                                {activeStory.map((panel, pIdx) => (
                                                    <div key={pIdx} onClick={() => { playSoundEffect('pop'); speakText(panel.text); }} className="bg-slate-50 border-4 border-slate-200 hover:border-badeec-teal rounded-[2.5rem] p-5 flex flex-col items-center text-center space-y-4 cursor-pointer shadow-md transition-all">
                                                        <span className="w-10 h-10 rounded-full bg-white text-badeec-teal font-black flex items-center justify-center shadow-sm border border-slate-200">{pIdx + 1}</span>
                                                        <div className="w-full aspect-video flex items-center justify-center"><SmartImage src={currentChapter === 0 ? getStoryImg(activeData.id, pIdx) : null} action={panel.text} className="rounded-2xl" /></div>
                                                        <div className="text-3xl font-black text-badeec-navy story-naskh leading-tight py-2">{panel.text.split(' ').map((word, wIdx) => <span key={wIdx} className={word === 'وَ' ? 'text-slate-400 mx-1' : ''}>{word} </span>)}</div>
                                                        <p className="text-xs text-slate-500 font-bold bg-white px-3 py-2 rounded-xl border border-slate-100 w-full">{panel.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="text-center mt-6"><button onClick={() => setReadingStation('game')} className="bg-badeec-coral text-white px-10 py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2 mx-auto">مصنع الألعاب <Icon name="Gamepad2" size={20}/></button></div>
                                        </div>
                                    )}

                                    {/* مصنع الألعاب */}
                                    {readingStation === 'game' && (
                                        <div className="flex-1 flex flex-col justify-center animate-pop-in">
                                            <GameFactory gameType={activeData.gameType} words={activeWords} onComplete={() => { playSoundEffect('magic'); setReadingStation('rabbit_race'); }} />
                                            <div className="mt-8 flex justify-between items-center w-full max-w-2xl mx-auto">
                                                <button onClick={() => setReadingStation('story')} className="bg-slate-200 text-slate-600 px-6 py-2.5 rounded-xl font-bold text-xs">اليوميات</button>
                                                <button onClick={() => setReadingStation('rabbit_race')} className="bg-amber-500 text-slate-900 px-8 py-3 rounded-2xl font-black shadow-md">تحدي الطلاقة ⏱️</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* سباق الأرنب */}
                                    {readingStation === 'rabbit_race' && (
                                        <RabbitRace 
                                            stories={activeStory} 
                                            onComplete={() => {
                                                playSoundEffect('magic');
                                                setCelebration({
                                                    title: `مسار القراءة التأسيسي لـ ${activeData.title}`,
                                                    badge: activeData.badge
                                                });
                                            }} 
                                        />
                                    )}
                                </div>
                            </div>
                        )}


                    </main>
                    <footer className="bg-slate-900 text-slate-400 py-6 px-4 text-center text-xs border-t border-slate-800 z-20 relative">
                        <div className="max-w-4xl mx-auto space-y-2"><p className="font-bold text-slate-300 flex items-center justify-center gap-1.5"><Icon name="GraduationCap" size={16} className="text-badeec-coral" /><span>أكاديمية ضاد اللغوية © 2026 - المنهج الرديف المتكامل</span></p></div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
