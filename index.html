                        <div className="bg-white rounded-[2rem] p-6 shadow-sm flex flex-col items-center justify-center min-h-[300px]">
                            <svg className="w-40 h-56" viewBox="0 0 100 150">
                                <circle cx="50" cy="30" r="12" fill="#FDBA74" />
                                <path d="M50 42 C40 42 35 110 35 110 H65 C65 110 60 42 50 42 Z" fill="#F1F5F9" stroke="#CBD5E1" strokeWidth="2" />
                                {clothes > 0 && <path d="M50 42 C40 42 35 110 35 110 H65 C65 110 60 42 50 42 Z" fill="#D946EF" className="animate-pop-in" opacity="0.9" />}
                                {clothes > 1 && <path d="M42 18 L50 8 L58 18 L50 25 Z" fill="#FBBF24" className="animate-pop-in" />}
                                {clothes > 2 && <g className="animate-pop-in"><circle cx="45" cy="120" r="6" fill="#1E293B" /><circle cx="55" cy="120" r="6" fill="#1E293B" /></g>}
                            </svg>
                            {clothes > 2 && <button onClick={() => { playSoundEffect('success'); onComplete(); }} className="mt-4 bg-fuchsia-500 text-white px-6 py-2 rounded-xl font-bold shadow-md">أناقة رائعة! 🌟</button>}
                        </div>
                    </div>
                );
            }

            // 4. لعبة صائد النيازك المحدثة بالكامل بآلية مستمرة مستقرة
            if (gameType === 'meteor') {
                const targetWord = words[0].word;
                const [score, setScore] = useState(0);
                
                // تصميم مصفوفة نيازك ذكية مجهزة بمفتاح إعادة تعيين (resetKey) لمنع تجميد الأنيميشن
                const generateMeteor = (id) => ({
                    id,
                    word: Math.random() > 0.45 ? targetWord : words[Math.floor(Math.random() * words.length)].word,
                    left: 10 + Math.random() * 75,
                    resetKey: 0
                });

                const [meteors, setMeteors] = useState(() => [1, 2, 3].map(id => generateMeteor(id)));

                const handleMeteorClick = (clicked) => {
                    if (clicked.word === targetWord) {
                        playSoundEffect('pop');
                        const nextScore = score + 10;
                        setScore(nextScore);
                        
                        // إعادة التعيين اللحظية للنيزك المدمر بشكل رائع
                        resetSingleMeteor(clicked.id);
                    } else {
                        playSoundEffect('error');
                    }
                };

                const resetSingleMeteor = (id) => {
                    setMeteors(prev => prev.map(m => {
                        if (m.id === id) {
                            return {
                                ...generateMeteor(id),
                                resetKey: m.resetKey + 1 // لتفعيل إعادة الأنيميشن فوراً من الأعلى
                            };
                        }
                        return m;
                    }));
                };

                if (score >= 20) {
                    return (
                        <div className="flex flex-col items-center justify-center bg-slate-950 p-8 rounded-[2.5rem] border-4 border-slate-700 shadow-inner min-h-[400px] text-center space-y-6 animate-pop-in">
                            <span className="text-6xl animate-bounce">🚀🏆</span>
                            <h4 className="font-baloo text-3xl font-black text-amber-400">بطل الفضاء القارئ!</h4>
                            <p className="text-slate-300 font-bold text-sm max-w-sm">لقد نجحت في قراءة الكلمات الملونة وتدمير النيازك وحماية كوكب ضاد!</p>
                            <button onClick={() => { playSoundEffect('success'); onComplete(); }} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-8 py-3.5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
                                واصل رحلتك العظيمة 🌟
                            </button>
                        </div>
                    );
                }

                return (
                    <div className="flex flex-col bg-slate-900 p-6 rounded-[2.5rem] border-4 border-slate-700 shadow-inner min-h-[400px] overflow-hidden relative">
                        <div className="flex justify-between items-center bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-600 z-10">
                            <span className="text-amber-400 font-baloo font-black text-xl">اقرأ ودمّر نيازك كلمة: {targetWord}</span>
                            <span className="text-white font-black bg-slate-700 px-4 py-1.5 rounded-full">النقاط: {score} / 20</span>
                        </div>
                        <div className="flex-1 w-full relative mt-4">
                            {meteors.map(m => (
                                <button 
                                    key={`${m.id}-${m.resetKey}`} 
                                    onClick={() => handleMeteorClick(m)} 
                                    onAnimationEnd={() => resetSingleMeteor(m.id)} // عندما يسقط النيزك دون نقره يتم تجديده
                                    style={{ left: `${m.left}%`, animationDuration: `${3.5 + Math.random() * 1.5}s` }} 
                                    className="absolute -top-12 bg-gradient-to-b from-orange-500 to-rose-600 text-white p-3.5 px-5 rounded-full font-baloo font-black shadow-[0_0_15px_rgba(244,63,94,0.5)] animate-meteor-fall hover:scale-110 active:scale-95 cursor-crosshair text-lg"
                                >
                                    {m.word}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }
            return null;
        };

        // --- تحدي سباق الأرنب للطلاقة المطور المانع للتعليق ---
        const RabbitRace = ({ stories, onComplete }) => {
            const [time, setTime] = useState(60); 
            const [active, setActive] = useState(false);
            const [progress, setProgress] = useState(0); 
            const [finished, setFinished] = useState(false);
            const timerRef = useRef(null);

            useEffect(() => {
                if (active && !finished) {
                    const stepTime = (time * 1000) / 100;
                    timerRef.current = setInterval(() => {
                        setProgress(p => { 
                            if (p >= 100) { 
                                clearInterval(timerRef.current); 
                                setActive(false); 
                                return 100; 
                            } 
                            return p + 1; 
                        });
                    }, stepTime);
                }
                return () => clearInterval(timerRef.current);
            }, [active, time, finished]);

            const handleResetRace = () => {
                playSoundEffect('click');
                setProgress(0);
                setFinished(false);
                setActive(false);
            };

            return (
                <div className="flex-1 flex flex-col justify-center animate-pop-in space-y-6">
                    <div className="text-center space-y-2">
                        <h4 className="text-3xl font-baloo font-black text-badeec-navy flex justify-center items-center gap-2">
                            <Icon name="Timer" className="text-amber-500"/> تحدي الطلاقة ⏱️
                        </h4>
                        <p className="text-sm text-slate-500 font-bold max-w-md mx-auto">اقرأ النص كاملاً بطلاقة قبل أن يصل الأرنب للجزرة!</p>
                    </div>

                    <div className="bg-slate-50 border-4 border-slate-200 rounded-[2.5rem] p-6 shadow-inner space-y-4">
                        <div className="h-16 bg-white rounded-2xl relative border border-slate-300 overflow-hidden flex items-center">
                            <div className="absolute inset-0 bg-sky-50/20 bg-dashed border-b border-dashed border-sky-100"></div>
                            <div style={{ right: `${progress}%`, transform: 'translateX(50%)' }} className="absolute h-12 w-12 flex items-center justify-center text-4xl transition-all duration-300 z-10">🐇</div>
                            <div className="absolute left-4 text-3xl z-0">🥕</div>
                        </div>
                        <div className="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                            <div className="flex gap-2">
                                {[30, 60, 120].map(t => <button key={t} onClick={() => { playSoundEffect('click'); setTime(t); setActive(false); setProgress(0); setFinished(false); }} className={`px-3 py-1.5 rounded-lg font-bold text-xs ${time === t ? 'bg-badeec-teal text-white shadow-sm' : 'bg-slate-100 text-slate-500'}`}>{t} ثانية</button>)}
                            </div>
                            <button onClick={() => { playSoundEffect('click'); setActive(!active); }} className="bg-badeec-navy text-white px-5 py-2 rounded-xl text-xs font-black shadow-md">{active ? 'إيقاف مؤقت ⏸️' : 'ابدأ السباق القرائي! 🏁'}</button>
                        </div>
                    </div>

                    <div className="bg-white border-2 border-slate-200 rounded-[2rem] p-6 max-w-3xl mx-auto w-full text-center space-y-4">
                        <div className="font-baloo text-3xl md:text-4xl font-black text-badeec-navy leading-relaxed py-4 px-2">
                            {stories.map((s, i) => <span key={i} className="inline-block mx-2">{s.text}</span>)}
                        </div>
                        
                        {finished ? (
                            <div className="bg-green-50 border-2 border-green-200 rounded-2xl p-4 animate-pop-in text-center">
                                <p className="font-baloo text-2xl font-black text-green-700">مبارك الفوز والطلاقة القرائية! 🎉</p>
                            </div>
                        ) : progress >= 100 ? (
                            <div className="bg-rose-50 border-2 border-rose-200 rounded-2xl p-4 animate-pop-in text-center space-y-3">
                                <p className="font-baloo text-xl font-black text-rose-700">للأسف، وصل الأرنب أولاً! 🐇💨</p>
                                <button onClick={handleResetRace} className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-2 rounded-xl font-bold shadow-md">
                                    حاول مرة أخرى 🔄
                                </button>
                            </div>
                        ) : (
                            <button 
                                onClick={() => { if(active) { playSoundEffect('success'); setActive(false); setFinished(true); } }} 
                                disabled={!active} 
                                className="w-full max-w-md bg-green-500 hover:bg-green-600 disabled:opacity-40 text-white py-4 rounded-2xl font-black text-lg shadow-md transition-all mx-auto block"
                            >
                                ✨ لقد قرأت وسبقت الأرنب! 🏆
                            </button>
                        )}
                    </div>
                    {finished && (
                        <div className="text-center pt-2">
                            <button onClick={onComplete} className="bg-badeec-teal text-white px-8 py-3 rounded-2xl font-black text-sm shadow-md animate-bounce">
                                احصل على وسام الفصاحة 🏅
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- التطبيق الرئيسي ---
        /* ============================================================
           الوحدة صفر — ما قبل الفتحة (للطالب الذي لا يعرف الحروف)
           القرائن صحيحة: كلٌّ كلمةٌ تبدأ بالحرف نفسه (س ← سِنّ)
           ============================================================ */
        const DAAD_LETTER_CUES = [
          { L:'ا', word:'إِصْبَع', e:'👆', type:'shape', echo:'الألِف واقفةٌ مستقيمةٌ مثل الإصبع' },
          { L:'ب', word:'بَيْضَة', e:'🥚', type:'shape', echo:'الباء تحتها نقطةٌ مثل البَيْضة' },
          { L:'ت', word:'نُقْطَتَان', e:'👀', type:'ask', echo:'كم نقطةً فوق التاء؟ نقطتان' },
          { L:'ث', word:'ثَلَاث', e:'✋', type:'ask', echo:'فوق الثاء ثَلاثُ نقاط' },
          { L:'ج', word:'جَمَل', e:'🐪', type:'shape', echo:'بطنُ الجيم منحنيةٌ مثل عُنق الجَمَل' },
          { L:'ح', word:'حُوت', e:'🐳', type:'shape', echo:'الحاء فمها مفتوحٌ مثل الحُوت' },
          { L:'خ', word:'خَيْمَة', e:'⛺', type:'ask', echo:'الخاء مثل الحاء وفوقها نقطةٌ مثل رأس الخَيْمة' },
          { L:'د', word:'دَلْو', e:'🪣', type:'shape', echo:'الدال منحنيةٌ مثل الدَّلو' },
          { L:'ذ', word:'ذُبَابَة', e:'🪰', type:'ask', echo:'الذال مثل الدال وفوقها نقطةٌ مثل الذُّبابة' },
          { L:'ر', word:'رُكْبَة', e:'🦵', type:'shape', echo:'الراء منحنيةٌ مثل الرُّكبة' },
          { L:'ز', word:'زَهْرَة', e:'🌼', type:'ask', echo:'الزاي مثل الراء وفوقها نقطةٌ مثل الزَّهرة' },
          { L:'س', word:'سِنّ', e:'🦷', type:'shape', echo:'أسنانُ السين مثل السِّنّ' },
          { L:'ش', word:'شَجَرَة', e:'🌳', type:'shape', echo:'الشين لها أغصانٌ مثل الشَّجرة' },
          { L:'ص', word:'صَحْن', e:'🍽️', type:'shape', echo:'بطنُ الصاد مدوّرةٌ مثل الصَّحن' },
          { L:'ض', word:'صَحْن وَنُقْطَة', e:'🍽️', type:'ask', echo:'الضاد مثل الصاد وفوقها نقطةٌ واحدة' },
          { L:'ط', word:'طَبْل', e:'🥁', type:'shape', echo:'الطاء واقفةٌ مثل عصا الطَّبل' },
          { L:'ظ', word:'طَبْل وَنُقْطَة', e:'🥁', type:'ask', echo:'الظاء مثل الطاء وفوقها نقطةٌ واحدة' },
          { L:'ع', word:'عَيْن', e:'👁️', type:'shape', echo:'فتحةُ العين مثل العَيْن' },
          { L:'غ', word:'عَيْن وَنُقْطَة', e:'👁️', type:'ask', echo:'الغين مثل العين وفوقها نقطةٌ واحدة' },
          { L:'ف', word:'فِيل', e:'🐘', type:'shape', echo:'رأسُ الفاء مدوّرٌ وله ذيلٌ مثل خرطوم الفِيل' },
          { L:'ق', word:'فِيل وَنُقْطَتَان', e:'🍲', type:'ask', echo:'القاف رأسها مدوّرٌ وفوقها نقطتان' },
          { L:'ك', word:'كُرْسِيّ', e:'🪑', type:'shape', echo:'الكاف منحنيةٌ مثل الكُرسي' },
          { L:'ل', word:'لَيْمُون', e:'🍋', type:'shape', echo:'اللام غصنٌ طويلٌ في آخره لَيْمونة' },
          { L:'م', word:'مِفْتَاح', e:'🗝️', type:'shape', echo:'رأسُ الميم مدوّرٌ وله ذيلٌ مثل المِفْتاح' },
          { L:'ن', word:'نُقْطَة وَاحِدَة', e:'⚫', type:'ask', echo:'في وسط النون نقطةٌ واحدةٌ فوقها' },
          { L:'ه', word:'هِرَّة', e:'🐱', type:'shape', echo:'الهاء مستديرةٌ مثل الهِرّة الملتفّة' },
          { L:'و', word:'وَرْدَة', e:'🌹', type:'shape', echo:'الواو رأسها وساقها مثل الوَرْدة' },
          { L:'ي', word:'يَد', e:'✋', type:'shape', echo:'الياء ممتدّةٌ مثل اليَد' }
        ];

        // مجموعة كلماتٍ تستوعب كل الحروف الـ28 (مسار: من الكلمة إلى الحرف)
        const DAAD_ZERO_WORDS = [
          { word:'أَكَلَ', e:'🍎', letters:['أ','ك','ل'] },
          { word:'بَحَثَ', e:'🔍', letters:['ب','ح','ث'] },
          { word:'جَلَسَ', e:'🪑', letters:['ج','ل','س'] },
          { word:'حَمَدَ', e:'🤲', letters:['ح','م','د'] },
          { word:'خَلَعَ', e:'👟', letters:['خ','ل','ع'] },
          { word:'دَفَعَ', e:'💪', letters:['د','ف','ع'] },
          { word:'ذَهَبَ', e:'🚶', letters:['ذ','ه','ب'] },
          { word:'رَسَمَ', e:'🎨', letters:['ر','س','م'] },
          { word:'زَرَعَ', e:'🌱', letters:['ز','ر','ع'] },
          { word:'شَكَرَ', e:'🙏', letters:['ش','ك','ر'] },
          { word:'صَنَعَ', e:'🔨', letters:['ص','ن','ع'] },
          { word:'ضَرَبَ', e:'⚽', letters:['ض','ر','ب'] },
          { word:'طَبَخَ', e:'🍲', letters:['ط','ب','خ'] },
          { word:'ظَهَرَ', e:'☀️', letters:['ظ','ه','ر'] },
          { word:'عَرَفَ', e:'💡', letters:['ع','ر','ف'] },
          { word:'غَسَلَ', e:'🧼', letters:['غ','س','ل'] },
          { word:'فَتَحَ', e:'🚪', letters:['ف','ت','ح'] },
          { word:'قَطَعَ', e:'✂️', letters:['ق','ط','ع'] },
          { word:'كَتَبَ', e:'✏️', letters:['ك','ت','ب'] },
          { word:'نَظَرَ', e:'👀', letters:['ن','ظ','ر'] },
          { word:'وَضَعَ', e:'📦', letters:['و','ض','ع'] }
        ];

        /* القرائن المعتمدة في مدن ضاد هي المصدر الواحد لكلمة القرينة ووصفها */
        if (window.CLUES) { CLUES.inject(); DAAD_LETTER_CUES.forEach(c => { const inf = CLUES.info(c.L === 'ا' ? 'أ' : c.L); if (inf) { if (c.L === 'ا') c.L = 'أ'; c.word = inf[2]; c.echo = inf[1]; c.type = inf[0] === 'مدمجة' ? 'shape' : 'sound'; c.e = ''; } }); }
        const cueByLetter = (l) => DAAD_LETTER_CUES.find(c => c.L === l) || { L:l, word:'', e:'🔤', echo:'' };

        const UnitZero = ({ onBack }) => {
          const [mode, setMode] = useState(null);        // 'w2l' | 'phonics'
          const [wordSel, setWordSel] = useState(null);   // فهرس الكلمة المفتوحة
          const [analyzed, setAnalyzed] = useState(false);
          const [pIdx, setPIdx] = useState(0);            // مؤشّر الصوتيات
          const [picked, setPicked] = useState(null);     // الحرف المختار داخل التحليل

          // ---------- شاشة اختيار المسار ----------
          if (!mode) return (
            <div className="animate-pop-in space-y-6 flex-1">
              <div className="text-center max-w-2xl mx-auto space-y-2">
                <div className="bg-badeec-teal/10 text-badeec-teal px-4 py-1.5 rounded-full inline-flex items-center gap-1.5 text-xs font-bold"><Icon name="GraduationCap" size={14}/> الوحدة صفر — ما قبل الحروف</div>
                <h2 className="text-3xl md:text-4xl font-baloo font-black text-badeec-navy">من أين نبدأ؟</h2>
                <p className="text-slate-500 font-bold text-sm">للطالب الذي لا يعرف الحروف بعد — نختار طريقاً يناسبه.</p>
              </div>
              <div className="grid md:grid-cols-2 gap-5 max-w-3xl mx-auto">
                <button onClick={()=>{setMode('w2l');setWordSel(null);setAnalyzed(false);}} className="text-right bg-white rounded-[2rem] border-4 border-slate-200 hover:border-badeec-teal p-6 shadow-sm hover:shadow-lg transition group">
                  <div className="w-16 h-16 rounded-2xl bg-badeec-teal/10 flex items-center justify-center mb-4 group-hover:scale-110 transition"><Icon name="Layers" size={32} className="text-badeec-teal"/></div>
                  <h3 className="font-baloo font-black text-2xl text-badeec-navy mb-1">من الكلمة إلى الحرف</h3>
                  <p className="text-slate-500 font-bold text-sm leading-relaxed">نرى الكلمة كاملةً بصورتها، ثم نُحلّلها إلى حروفها، ونتعرّف على كل حرفٍ بكلمةٍ تبدأ به.</p>
                </button>
                <button onClick={()=>{setMode('phonics');setPIdx(0);}} className="text-right bg-white rounded-[2rem] border-4 border-slate-200 hover:border-badeec-coral p-6 shadow-sm hover:shadow-lg transition group">
                  <div className="w-16 h-16 rounded-2xl bg-badeec-coral/10 flex items-center justify-center mb-4 group-hover:scale-110 transition"><Icon name="Volume2" size={32} className="text-badeec-coral"/></div>
                  <h3 className="font-baloo font-black text-2xl text-badeec-navy mb-1">الصوت بلا اسم</h3>
                  <p className="text-slate-500 font-bold text-sm leading-relaxed">نتعلّم صوت الحرف فقط (ـبـ، ـسـ، ـمـ) دون اسمه، مع كلمةٍ تبدأ به تثبّته في الذاكرة.</p>
                </button>
              </div>
              <div className="text-center"><button onClick={onBack} className="text-slate-400 hover:text-badeec-navy font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> العودة للرئيسية</button></div>
            </div>
          );

          // ---------- المسار أ: من الكلمة إلى الحرف ----------
          if (mode === 'w2l') {
            // عرض تحليل كلمةٍ مفتوحة
            if (wordSel !== null) {
              const wObj = DAAD_ZERO_WORDS[wordSel];
              const cue = picked ? cueByLetter(picked) : null;
              return (
                <div className="animate-pop-in space-y-5 flex-1">
                  <div className="flex items-center gap-3">
                    <button onClick={()=>{setWordSel(null);setAnalyzed(false);setPicked(null);}} className="w-11 h-11 bg-white rounded-2xl shadow-sm flex items-center justify-center text-badeec-navy hover:bg-slate-50"><Icon name="ArrowRight" size={22}/></button>
                    <h2 className="font-baloo font-black text-2xl text-badeec-navy">نُحلّل الكلمة</h2>
                  </div>
                  <div className="bg-white rounded-[2rem] border-4 border-slate-100 p-6 text-center shadow-sm">
                    <div className="text-7xl mb-3">{wObj.e}</div>
                    <div className="font-baloo font-black text-6xl text-badeec-navy mb-1" dir="rtl">{wObj.word}</div>
                    {!analyzed ? (
                      <button onClick={()=>{setAnalyzed(true);playSoundEffect('correct');speakText(wObj.word);}} className="mt-4 bg-badeec-teal hover:bg-badeec-deep text-white px-8 py-3 rounded-2xl font-bold inline-flex items-center gap-2 shadow-md transition active:scale-95">
                        <Icon name="Zap" size={20}/> حلّل إلى حروف
                      </button>
                    ) : (
                      <>
                        <div className="flex justify-center flex-wrap gap-2 mt-5 animate-pop-in" dir="rtl">
                          {wObj.letters.map((l,i)=>(
                            <button key={i} onClick={()=>{setPicked(l);speakText(l+'َ');playSoundEffect('click');}}
                              className={"font-baloo font-black text-4xl rounded-2xl flex items-center justify-center transition active:scale-95 "+(picked===l?'text-white shadow-md -translate-y-1':'bg-badeec-sky text-badeec-teal hover:-translate-y-1')}
                              style={{width:'66px',height:'76px',background:picked===l?'#0e8a9c':undefined}}>{l}</button>
                          ))}
                        </div>
                        <p className="text-slate-400 font-bold text-xs mt-3">انقر أيَّ حرفٍ لتسمع صوته وتعرف قرينته</p>
                      </>
                    )}
                  </div>
                  {/* بطاقة قرينة الحرف المختار */}
                  {cue && cue.word && (
                    <div className="bg-gradient-to-br from-amber-50 to-orange-100 rounded-[2rem] border-4 border-white p-6 text-center shadow-sm animate-pop-in">
                      <div className="flex items-center justify-center gap-4 mb-2">
                        <LetterCueSVG letter={cue.L} size={110}/>
                      </div>
                      <div className="font-baloo font-black text-3xl text-badeec-navy" dir="rtl">{cue.word}</div>
                      <p className="text-slate-500 font-bold text-sm mt-1">{cue.type==='shape' ? <>شكلُه يصير: <span className="text-badeec-coral">{cue.word}</span></> : <>صوتُه يشبه: <span className="text-badeec-coral">{cue.word}</span></>}</p>
                      {cue.echo && <p className="text-badeec-teal font-bold text-xs mt-2 bg-white/70 rounded-xl py-2 px-3 inline-block">💡 {cue.echo}</p>}
                    </div>
                  )}
                </div>
              );
            }
            // شبكة الكلمات
            return (
              <div className="animate-pop-in space-y-5 flex-1">
                <div className="flex items-center gap-3">
                  <button onClick={()=>setMode(null)} className="w-11 h-11 bg-white rounded-2xl shadow-sm flex items-center justify-center text-badeec-navy hover:bg-slate-50"><Icon name="ArrowRight" size={22}/></button>
                  <div><h2 className="font-baloo font-black text-2xl text-badeec-navy leading-tight">من الكلمة إلى الحرف</h2><p className="text-slate-400 font-bold text-xs">اختر كلمةً لنحلّلها — المجموعة تغطّي كل الحروف</p></div>
                </div>
                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
                  {DAAD_ZERO_WORDS.map((w,i)=>(
                    <button key={i} onClick={()=>{setWordSel(i);setAnalyzed(false);setPicked(null);speakText(w.word);}} className="bg-white rounded-2xl border-2 border-slate-200 hover:border-badeec-teal p-3 flex flex-col items-center shadow-sm hover:-translate-y-1 transition active:scale-95">
                      <span className="text-4xl mb-1">{w.e}</span>
                      <span className="font-baloo font-black text-xl text-badeec-navy" dir="rtl">{w.word}</span>
                    </button>
                  ))}
                </div>
              </div>
            );
          }

          // ---------- المسار ب: الصوت بلا اسم ----------
          const cue = DAAD_LETTER_CUES[pIdx];
          return (
            <div className="animate-pop-in space-y-5 flex-1">
              <div className="flex items-center gap-3">
                <button onClick={()=>setMode(null)} className="w-11 h-11 bg-white rounded-2xl shadow-sm flex items-center justify-center text-badeec-navy hover:bg-slate-50"><Icon name="ArrowRight" size={22}/></button>
                <div><h2 className="font-baloo font-black text-2xl text-badeec-navy leading-tight">الصوت بلا اسم</h2><p className="text-slate-400 font-bold text-xs">الحرف {pIdx+1} من {DAAD_LETTER_CUES.length}</p></div>
              </div>
              <div className="bg-white rounded-[2rem] border-4 border-slate-100 p-6 md:p-10 text-center shadow-sm">
                <div className="mb-2"><LetterCueSVG letter={cue.L} size={130}/></div>
                <div className="font-baloo font-black text-3xl text-badeec-navy mb-1" dir="rtl">{cue.word}</div>
                <p className="text-slate-500 font-bold text-sm mb-1">نقول صوته «{cue.L}َ» ولا نقول اسمه</p>
                {cue.echo && <p className="text-badeec-teal font-bold text-xs mb-4 bg-badeec-sky rounded-xl py-2 px-3 inline-block">💡 {cue.echo}</p>}
                <div className="flex justify-center gap-3 mt-2 mb-6">
                  <button onClick={()=>{speakText(cue.L+'َ');playSoundEffect('click');}} className="bg-badeec-coral/10 text-badeec-coral border-2 border-badeec-coral/30 px-6 py-3 rounded-2xl font-bold inline-flex items-center gap-2 active:scale-95 transition"><Icon name="Volume2" size={20}/> اسمع الصوت</button>
                </div>
                <div className="flex justify-between items-center">
                  <button onClick={()=> pIdx>0 && setPIdx(pIdx-1)} disabled={pIdx===0} className="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-badeec-navy disabled:opacity-30 active:scale-95"><Icon name="ChevronRight" size={24}/></button>
                  <div className="flex flex-wrap gap-1.5 justify-center max-w-xs">{DAAD_LETTER_CUES.map((_,i)=><div key={i} className="w-2 h-2 rounded-full" style={{background:i===pIdx?'#f15a68':(i<pIdx?'#dcb897':'#e2e8f0')}}/>)}</div>
                  {pIdx < DAAD_LETTER_CUES.length-1
                    ? <button onClick={()=>{setPIdx(pIdx+1);playSoundEffect('click');}} className="w-12 h-12 rounded-2xl bg-badeec-coral text-white flex items-center justify-center active:scale-95"><Icon name="ChevronLeft" size={24}/></button>
                    : <button onClick={onBack} className="px-5 h-12 rounded-2xl bg-badeec-teal text-white font-bold flex items-center gap-2 active:scale-95">أتممنا <Icon name="Check" size={20}/></button>}
                </div>
              </div>
            </div>
          );
        };

        /* ============================================================
           ساحةُ ألعاب القراءة (أركيد) + نظام الصعوبة
           الافتراضي «سهل» — الهدف الإمتاعُ لا الإحباط
           ============================================================ */
        /* ============================================================
           ساحةُ ألعاب القراءة (أركيد) + نظام الصعوبة + كلمات المعلّم
           اختيارُ الصعوبة أولاً ← ثم اللعبة. الإيقاعُ بطيءٌ، والافتراضي «سهل».
           ============================================================ */
        const DIFF_PRESETS = {
          easy:   { key:'easy',   label:'سهل', color:'#10b981', fall:0.05,  spawnMs:3200, time:120, note:'إيقاعٌ بطيءٌ ومريح جداً' },
          medium: { key:'medium', label:'وسط', color:'#f59e0b', fall:0.085, spawnMs:2500, time:100, note:'إيقاعٌ متوسطٌ هادئ' },
          hard:   { key:'hard',   label:'صعب', color:'#f15a68', fall:0.14,  spawnMs:1900, time:80,  note:'إيقاعٌ أسرعُ قليلاً للمتمكّن' }
        };
        const ARCADE_WORDS = ['أَكَلَ','ذَهَبَ','كَتَبَ','رَسَمَ','جَلَسَ','شَرِبَ','لَعِبَ','سَمِعَ','فَرِحَ','رَكِبَ','زُرِعَ','طُبِخَ','يَكْتُبُ','يَلْعَبُ','مَسْجِد','بَاب','نُور','فِيل','قَالَ','سَعِيد','صَلَّى','سَبَّحَ','شُكْراً','كِتَاباً','بَاكِراً'];
        const pickN = (arr, n, not) => arr.filter(x=>x!==not).sort(()=>Math.random()-.5).slice(0,n);

        // 1) صائد الكلمات — انقر الكلمة المطلوبة وهي تنزل ببطء
        const WordCatcher = ({ diff, words, onBack }) => {
          const D = DIFF_PRESETS[diff];
          const bank = (words && words.length>=3) ? words : ARCADE_WORDS;
          const [state, setState] = useState('idle');
          const [score, setScore] = useState(0);
          const [time, setTime] = useState(D.time);
          const [target, setTarget] = useState('');
          const [items, setItems] = useState([]);
          const itemsRef = useRef([]); const rafRef = useRef(null);
          const lastSpawn = useRef(0); const tRef = useRef(D.time); const lastTick = useRef(0);
          const newTarget = () => { const t=bank[Math.floor(Math.random()*bank.length)]; setTarget(t); speakText(t); return t; };
          const start = () => { setScore(0); tRef.current=D.time; setTime(D.time); itemsRef.current=[]; setItems([]); lastSpawn.current=0; lastTick.current=Date.now(); setState('play'); newTarget(); };
          const loop = useCallback(()=>{
            const now=Date.now();
            if(now-lastTick.current>=1000){ tRef.current-=1; setTime(tRef.current); lastTick.current=now; if(tRef.current<=0){ setState('over'); playSoundEffect('reward'); return; } }
            if(now-lastSpawn.current > D.spawnMs){
              const distract=pickN(bank,2,target);
              [target,...distract].sort(()=>Math.random()-.5).forEach((w,k)=> itemsRef.current.push({ id:Math.random().toString(36).slice(2), w, x:12+Math.random()*68, y:-8-k*7, pop:false }));
              lastSpawn.current=now;
            }
            itemsRef.current = itemsRef.current.map(it=> it.pop?it:{...it,y:it.y+D.fall}).filter(it=> it.y<114);
            setItems([...itemsRef.current]);
            rafRef.current=requestAnimationFrame(loop);
          }, [D, target, bank]);
          useEffect(()=>{ if(state==='play'){ rafRef.current=requestAnimationFrame(loop); } return ()=>cancelAnimationFrame(rafRef.current); }, [state, loop]);
          const tap = (it) => {
            if(it.w===target){ itemsRef.current=itemsRef.current.map(x=>x.id===it.id?{...x,pop:true}:x); setItems([...itemsRef.current]); setScore(s=>s+1); playSoundEffect('correct'); setTimeout(()=>{ itemsRef.current=itemsRef.current.filter(x=>x.id!==it.id); setItems([...itemsRef.current]); },250); newTarget(); }
            else playSoundEffect('soft');
          };
          return (
            <div className="flex-1 flex flex-col animate-pop-in space-y-4 max-w-2xl mx-auto w-full">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="text-slate-400 hover:text-amber-400 font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> الألعاب</button>
                <span className="text-xs px-4 py-1.5 rounded-full font-black text-white" style={{background:D.color}}>صائد الكلمات · {D.label}</span>
                <div className="flex items-center gap-3"><span className="flex items-center gap-1 text-amber-400 font-black"><Icon name="Star" size={16}/>{score}</span><span className="flex items-center gap-1 text-slate-300 font-bold"><Icon name="Timer" size={16}/>{time}</span></div>
              </div>
              {state!=='idle' && <div className="text-center"><span className="text-xs text-slate-400 font-bold">انقر الكلمة:</span><div className="font-baloo font-black text-4xl text-amber-300 mt-0.5" dir="rtl">{target}</div></div>}
              <div className="relative w-full h-[360px] rounded-3xl overflow-hidden border-4 border-slate-700" style={{background:'linear-gradient(to bottom,#0c4a6e,#075985)'}}>
                {state==='idle' && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center gap-4 p-4"><div className="text-6xl">🫧</div><p className="text-slate-300 font-bold text-center text-sm">تنزل الكلماتُ بهدوء — انقر المطلوبة. لا عقوبةَ على الخطأ.</p><button onClick={start} className="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black inline-flex items-center gap-2 active:scale-95 transition"><Icon name="Play" size={20}/> ابدأ</button></div>
                )}
                {state==='over' && (<div className="absolute inset-0 bg-black/40 flex flex-col items-center justify-center gap-3 animate-pop-in z-20"><div className="text-5xl">🏆</div><p className="text-white font-baloo font-black text-2xl">جمعتَ {score} كلمة!</p><button onClick={start} className="bg-emerald-500 hover:bg-emerald-600 text-white px-7 py-3 rounded-2xl font-black inline-flex items-center gap-2 active:scale-95 transition"><Icon name="Play" size={18}/> العب مجدداً</button></div>)}
                {items.map(it=>(<button key={it.id} onClick={()=>tap(it)} className={"absolute font-baloo font-black text-2xl md:text-3xl rounded-2xl px-4 py-2 shadow-lg border-b-4 transition-transform "+(it.pop?'bg-amber-400 text-white border-amber-500 scale-150 opacity-0':'bg-white text-badeec-navy border-slate-300 hover:scale-105')} style={{left:`${it.x}%`,top:`${it.y}%`}} dir="rtl">{it.w}</button>))}
              </div>
            </div>
          );
        };

        // 2) بالونات الكلمات — فرقِّع بالون الكلمة المطلوبة وهو يصعد ببطء
        const BalloonPop = ({ diff, words, onBack }) => {
          const D = DIFF_PRESETS[diff];
          const bank = (words && words.length>=3) ? words : ARCADE_WORDS;
          const [state, setState] = useState('idle');
          const [score, setScore] = useState(0);
          const [time, setTime] = useState(D.time);
          const [target, setTarget] = useState('');
          const [balloons, setBalloons] = useState([]);
          const ref = useRef([]); const rafRef = useRef(null);
          const lastSpawn = useRef(0); const tRef = useRef(D.time); const lastTick = useRef(0);
          const colors=['#f15a68','#0e8a9c','#f59e0b','#8b5cf6','#10b981'];
          const newTarget = () => { const t=bank[Math.floor(Math.random()*bank.length)]; setTarget(t); speakText(t); return t; };
          const start = () => { setScore(0); tRef.current=D.time; setTime(D.time); ref.current=[]; setBalloons([]); lastSpawn.current=0; lastTick.current=Date.now(); setState('play'); newTarget(); };
          const loop = useCallback(()=>{
            const now=Date.now();
            if(now-lastTick.current>=1000){ tRef.current-=1; setTime(tRef.current); lastTick.current=now; if(tRef.current<=0){ setState('over'); playSoundEffect('reward'); return; } }
            if(now-lastSpawn.current > D.spawnMs){ const distract=pickN(bank,2,target); [target,...distract].sort(()=>Math.random()-.5).forEach((w,k)=> ref.current.push({ id:Math.random().toString(36).slice(2), w, x:10+Math.random()*72, y:110+k*7, c:colors[Math.floor(Math.random()*colors.length)], pop:false })); lastSpawn.current=now; }
            ref.current = ref.current.map(b=> b.pop?b:{...b,y:b.y-D.fall}).filter(b=> b.y>-14);
            setBalloons([...ref.current]);
            rafRef.current=requestAnimationFrame(loop);
          }, [D, target, bank]);
          useEffect(()=>{ if(state==='play'){ rafRef.current=requestAnimationFrame(loop); } return ()=>cancelAnimationFrame(rafRef.current); }, [state, loop]);
          const pop = (b) => { if(b.w===target){ ref.current=ref.current.map(x=>x.id===b.id?{...x,pop:true}:x); setBalloons([...ref.current]); setScore(s=>s+1); playSoundEffect('correct'); setTimeout(()=>{ ref.current=ref.current.filter(x=>x.id!==b.id); setBalloons([...ref.current]); },250); newTarget(); } else playSoundEffect('soft'); };
          return (
            <div className="flex-1 flex flex-col animate-pop-in space-y-4 max-w-2xl mx-auto w-full">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="text-slate-400 hover:text-amber-400 font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> الألعاب</button>
                <span className="text-xs px-4 py-1.5 rounded-full font-black text-white" style={{background:D.color}}>بالونات الكلمات · {D.label}</span>
                <div className="flex items-center gap-3"><span className="flex items-center gap-1 text-amber-400 font-black"><Icon name="Star" size={16}/>{score}</span><span className="flex items-center gap-1 text-slate-300 font-bold"><Icon name="Timer" size={16}/>{time}</span></div>
              </div>
              {state!=='idle' && <div className="text-center"><span className="text-xs text-slate-400 font-bold">فرقِّع كلمة:</span><div className="font-baloo font-black text-4xl text-amber-300 mt-0.5" dir="rtl">{target}</div></div>}
              <div className="relative w-full h-[360px] rounded-3xl overflow-hidden border-4 border-slate-700" style={{background:'linear-gradient(to bottom,#1e293b,#334155)'}}>
                {state==='idle' && (<div className="absolute inset-0 flex flex-col items-center justify-center gap-4 p-4"><div className="text-6xl">🎈</div><p className="text-slate-300 font-bold text-center text-sm">تصعد البالوناتُ بهدوء — فرقِّع المطلوبة. الخطأ بلا عقوبة.</p><button onClick={start} className="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black inline-flex items-center gap-2 active:scale-95 transition"><Icon name="Play" size={20}/> ابدأ</button></div>)}
                {state==='over' && (<div className="absolute inset-0 bg-black/40 flex flex-col items-center justify-center gap-3 animate-pop-in z-20"><div className="text-5xl">🏆</div><p className="text-white font-baloo font-black text-2xl">فرقعتَ {score} بالوناً!</p><button onClick={start} className="bg-emerald-500 hover:bg-emerald-600 text-white px-7 py-3 rounded-2xl font-black inline-flex items-center gap-2 active:scale-95 transition"><Icon name="Play" size={18}/> العب مجدداً</button></div>)}
                {balloons.map(b=>(<button key={b.id} onClick={()=>pop(b)} className={"absolute transition-transform "+(b.pop?'scale-150 opacity-0':'hover:scale-105')} style={{left:`${b.x}%`,top:`${b.y}%`}}><div className="rounded-full px-4 py-5 shadow-lg flex items-center justify-center font-baloo font-black text-xl text-white border-b-4 border-black/20" style={{background:b.c,minWidth:'74px'}} dir="rtl">{b.w}</div><div className="w-0.5 h-5 bg-white/40 mx-auto"></div></button>))}
              </div>
            </div>
          );
        };

        // محرّر كلمات المعلّم (إعدادٌ — لوحة المفاتيح للمعلّم فقط)
        const TeacherWords = ({ custom, setCustom }) => {
          const [val, setVal] = useState('');
          const add = () => { const w=val.trim(); if(w && !custom.includes(w) && !ARCADE_WORDS.includes(w)){ setCustom([...custom, w]); playSoundEffect('correct'); } setVal(''); };
          return (
            <div className="bg-white rounded-[2rem] border-4 border-slate-200 p-5">
              <h3 className="font-baloo font-black text-lg text-badeec-navy mb-1 flex items-center gap-2"><Icon name="ListChecks" size={20} className="text-badeec-teal"/> كلمات المعلّم (اختياري)</h3>
              <p className="text-slate-400 font-bold text-xs mb-3">أضف كلماتك الخاصّة بالحركات — تُضاف إلى كلمات الألعاب.</p>
              <div className="flex gap-2 mb-3">
                <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') add(); }} dir="rtl" placeholder="اكتب كلمةً بالحركات…"
                  className="flex-1 bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-2.5 font-baloo font-bold text-lg text-badeec-navy focus:border-badeec-teal outline-none"/>
                <button onClick={add} className="bg-badeec-teal hover:bg-badeec-deep text-white px-5 rounded-2xl font-black active:scale-95 transition inline-flex items-center gap-1"><Icon name="Check" size={18}/> أضف</button>
              </div>
              {custom.length>0 && (
                <div className="flex flex-wrap gap-2">
                  {custom.map((w,i)=>(
                    <span key={i} className="bg-badeec-teal/10 text-badeec-navy font-baloo font-bold rounded-full pr-3 pl-1.5 py-1 text-sm inline-flex items-center gap-1" dir="rtl">{w}
                      <button onClick={()=>{ setCustom(custom.filter(x=>x!==w)); playSoundEffect('soft'); }} className="w-5 h-5 rounded-full bg-slate-200 hover:bg-rose-200 text-slate-600 flex items-center justify-center text-xs">×</button>
                    </span>
                  ))}
                </div>
              )}
              <p className="text-slate-400 text-[11px] font-bold mt-3">إجمالي كلمات الألعاب: {ARCADE_WORDS.length + custom.length} كلمة</p>
            </div>
          );
        };

        // 3) كشّاف الظلام — ابحث عن الكلمة في الظلام
        const FlashlightGame = ({ diff, words, onBack }) => {
          const D = DIFF_PRESETS[diff];
          const bank = (words && words.length>=3) ? words : ARCADE_WORDS;
          const spotR = diff==='easy'?90:(diff==='medium'?70:50);
          const [score, setScore] = useState(0);
          const [target, setTarget] = useState('');
          const [placed, setPlaced] = useState([]);
          const [mx, setMx] = useState(50); const [my, setMy] = useState(50);
          const [found, setFound] = useState(false);
          const cRef = useRef(null);
          const setup = useCallback(()=>{
            const t=bank[Math.floor(Math.random()*bank.length)];
            setTarget(t); speakText(t); setFound(false);
            const pts=[]; const used=new Set();
            const distract=pickN(bank,diff==='easy'?3:(diff==='medium'?5:7),t);
            [t,...distract].forEach(w=>{
              let x,y,tries=0;
              do{ x=10+Math.random()*75; y=10+Math.random()*70; tries++; } while(tries<30 && [...used].some(p=>Math.abs(p[0]-x)<14&&Math.abs(p[1]-y)<14));
              used.add([x,y]); pts.push({w,x,y});
            });
            setPlaced(pts);
          },[bank,diff]);
          useEffect(()=>{ setup(); },[setup]);
          const handleMove = (e) => {
            const r=cRef.current.getBoundingClientRect();
            const t=e.touches?e.touches[0]:e;
            setMx(((t.clientX-r.left)/r.width)*100);
            setMy(((t.clientY-r.top)/r.height)*100);
          };
          const tap = (w) => {
            if(w===target){ setScore(s=>s+1); playSoundEffect('correct'); setFound(true); setTimeout(setup,1200); }
            else playSoundEffect('soft');
          };
          return (
            <div className="flex-1 flex flex-col animate-pop-in space-y-4 max-w-2xl mx-auto w-full">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="text-slate-400 hover:text-amber-400 font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> الألعاب</button>
                <span className="text-xs px-4 py-1.5 rounded-full font-black text-white" style={{background:DIFF_PRESETS[diff].color}}>كشّاف الظلام · {DIFF_PRESETS[diff].label}</span>
                <span className="flex items-center gap-1 text-amber-400 font-black"><Icon name="Star" size={16}/>{score}</span>
              </div>
              <div className="text-center"><span className="text-xs text-slate-400 font-bold">ابحث عن:</span><div className="font-baloo font-black text-3xl text-amber-300" dir="rtl">{target}</div></div>
              <div ref={cRef} onMouseMove={handleMove} onTouchMove={handleMove} className="relative w-full h-[360px] rounded-3xl overflow-hidden border-4 border-slate-700 cursor-none touch-none" style={{background:'#0a0a0a'}}>
                {/* بقعة الضوء */}
                <div className="absolute inset-0 pointer-events-none z-10" style={{background:`radial-gradient(circle ${spotR}px at ${mx}% ${my}%, transparent 0%, rgba(0,0,0,0.97) 100%)`}}></div>
                {placed.map((p,i)=>(
                  <button key={i} onClick={()=>tap(p.w)} className={"absolute font-baloo font-black text-2xl text-white z-0 px-3 py-1 rounded-xl transition "+(found&&p.w===target?'bg-emerald-500 scale-110':'')} style={{left:`${p.x}%`,top:`${p.y}%`}} dir="rtl">{p.w}</button>
                ))}
                {found && <div className="absolute inset-0 flex items-center justify-center z-20 animate-pop-in"><span className="text-emerald-400 font-baloo font-black text-3xl bg-black/60 px-6 py-3 rounded-2xl">وجدتَها! 🌟</span></div>}
              </div>
              <p className="text-slate-500 text-[10px] font-bold text-center">حرّك إصبعك لتكشف الظلام وانقر الكلمة المطلوبة</p>
            </div>
          );
        };

        // 4) تتابع الذاكرة — اسمع الكلمات ثم أعِد ترتيبها
        const SimonGame = ({ diff, words, onBack }) => {
          const bank = (words && words.length>=3) ? words : ARCADE_WORDS;
          const seqLen = diff==='easy'?3:(diff==='medium'?4:5);
          const [phase, setPhase] = useState('idle'); // idle | showing | input | win | fail
          const [seq, setSeq] = useState([]);
          const [input, setInput] = useState([]);
          const [showIdx, setShowIdx] = useState(-1);
          const [score, setScore] = useState(0);
          const [options, setOptions] = useState([]);
          const startRound = useCallback(()=>{
            const s=pickN(bank, seqLen).map((w,i)=>({w,id:i}));
            setSeq(s); setInput([]); setPhase('showing'); setShowIdx(0);
            const extra=pickN(bank, 2, '');
            setOptions([...s.map(x=>x.w), ...extra].sort(()=>Math.random()-.5));
          },[bank,seqLen]);
          useEffect(()=>{ if(phase==='showing'&&showIdx>=0&&showIdx<seq.length){ speakText(seq[showIdx].w); const t=setTimeout(()=>{ if(showIdx<seq.length-1) setShowIdx(showIdx+1); else{ setShowIdx(-1); setPhase('input'); } }, diff==='easy'?1800:1300); return ()=>clearTimeout(t); } },[phase,showIdx,seq,diff]);
          const tapWord = (w) => {
            if(phase!=='input') return;
            const expected=seq[input.length].w;
            if(w===expected){ const ni=[...input,w]; setInput(ni); playSoundEffect('click'); if(ni.length===seq.length){ setScore(s=>s+1); playSoundEffect('correct'); setPhase('win'); } }
            else { playSoundEffect('soft'); setPhase('fail'); }
          };
          return (
            <div className="flex-1 flex flex-col animate-pop-in space-y-4 max-w-2xl mx-auto w-full">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="text-slate-400 hover:text-amber-400 font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> الألعاب</button>
                <span className="text-xs px-4 py-1.5 rounded-full font-black text-white" style={{background:DIFF_PRESETS[diff].color}}>تتابع الذاكرة · {DIFF_PRESETS[diff].label}</span>
                <span className="flex items-center gap-1 text-amber-400 font-black"><Icon name="Star" size={16}/>{score}</span>
              </div>
              <div className="bg-[#1e2335] rounded-3xl p-6 border-2 border-slate-700 text-center min-h-[200px] flex flex-col items-center justify-center">
                {phase==='idle' && <><div className="text-5xl mb-3">🧠</div><p className="text-slate-300 font-bold mb-4">اسمع {seqLen} كلماتٍ بالترتيب، ثم أعِد ترتيبها.</p><button onClick={startRound} className="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-2xl font-black inline-flex items-center gap-2 active:scale-95"><Icon name="Play" size={20}/> ابدأ</button></>}
                {phase==='showing' && <><div className="text-[11px] text-amber-300 font-black mb-2">استمع بتركيز...</div><div className="font-baloo font-black text-5xl text-white animate-pop-in" dir="rtl">{showIdx>=0&&showIdx<seq.length?seq[showIdx].w:'...'}</div><div className="flex gap-2 mt-4">{seq.map((_,i)=><div key={i} className="w-3 h-3 rounded-full" style={{background:i<=showIdx?'#fbbf24':'#334155'}}/>)}</div></>}
                {phase==='input' && <><div className="text-[11px] text-emerald-300 font-black mb-1">دورك! انقر الكلمات بنفس الترتيب</div><div className="flex gap-2 mb-4">{seq.map((_,i)=><div key={i} className="w-14 h-14 rounded-xl border-2 border-dashed border-slate-600 flex items-center justify-center font-baloo font-black text-lg text-white">{input[i]||'?'}</div>)}</div><div className="flex flex-wrap gap-2 justify-center">{options.map((w,i)=><button key={i} onClick={()=>tapWord(w)} disabled={input.includes(w)} className={"px-5 py-3 rounded-2xl font-baloo font-black text-xl transition active:scale-95 "+(input.includes(w)?'bg-slate-700 text-slate-500':'bg-white text-badeec-navy shadow-md hover:-translate-y-1')} dir="rtl">{w}</button>)}</div></>}
                {phase==='win' && <><div className="text-5xl mb-2 animate-pop-in">🌟</div><p className="text-emerald-300 font-baloo font-black text-xl mb-4">ذاكرةٌ ممتازة!</p><button onClick={startRound} className="bg-emerald-500 text-white px-7 py-3 rounded-2xl font-black active:scale-95">جولةٌ جديدة</button></>}
                {phase==='fail' && <><div className="text-5xl mb-2">🤔</div><p className="text-amber-300 font-bold mb-4">لا بأس! حاول مرّةً أخرى</p><button onClick={startRound} className="bg-amber-500 text-slate-900 px-7 py-3 rounded-2xl font-black active:scale-95">أعِد المحاولة</button></>}
              </div>
            </div>
          );
        };

        // 5) البطل القافز — اقفز لالتقاط الكلمة الصحيحة
        const JumpHero = ({ diff, words, onBack }) => {
          const D = DIFF_PRESETS[diff];
          const bank = (words && words.length>=3) ? words : ARCADE_WORDS;
          const [score, setScore] = useState(0);
          const [target, setTarget] = useState('');
          const [pads, setPads] = useState([]);
          const [heroPos, setHeroPos] = useState(null);
          const [jumping, setJumping] = useState(false);
          const gen = useCallback(()=>{
            const t=bank[Math.floor(Math.random()*bank.length)];
            setTarget(t); speakText(t);
            const d=pickN(bank,diff==='easy'?1:(diff==='medium'?2:3),t);
            const all=[t,...d].sort(()=>Math.random()-.5);
            setPads(all); setHeroPos(null); setJumping(false);
          },[bank,diff]);
          useEffect(()=>{ gen(); },[gen]);
          const jump = (w,idx) => {
            if(jumping) return;
            setJumping(true); setHeroPos(idx);
            if(w===target){ playSoundEffect('correct'); setScore(s=>s+1); setTimeout(gen,1200); }
            else { playSoundEffect('soft'); setTimeout(()=>{ setJumping(false); setHeroPos(null); },800); }
          };
          return (
            <div className="flex-1 flex flex-col animate-pop-in space-y-4 max-w-2xl mx-auto w-full">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="text-slate-400 hover:text-amber-400 font-bold text-sm inline-flex items-center gap-1"><Icon name="ArrowRight" size={16}/> الألعاب</button>
                <span className="text-xs px-4 py-1.5 rounded-full font-black text-white" style={{background:D.color}}>البطل القافز · {D.label}</span>
                <span className="flex items-center gap-1 text-amber-400 font-black"><Icon name="Star" size={16}/>{score}</span>
              </div>
              <div className="text-center"><span className="text-xs text-slate-400 font-bold">اقفز إلى:</span><div className="font-baloo font-black text-3xl text-amber-300" dir="rtl">{target}</div></div>
              <div className="relative w-full h-[320px] rounded-3xl overflow-hidden border-4 border-slate-700" style={{background:'linear-gradient(to bottom,#7dd3fc,#bae6fd 60%,#22c55e 60%,#16a34a)'}}>
                {/* المنصّات */}
                <div className="absolute bottom-16 w-full flex justify-around px-4">
                  {pads.map((w,i)=>(
                    <button key={i} onClick={()=>jump(w,i)}
                      className={"rounded-2xl px-4 py-5 font-baloo font-black text-xl shadow-lg border-b-4 transition active:scale-95 "+(heroPos===i&&w===target?'bg-emerald-400 text-white border-emerald-600':'bg-white text-badeec-navy border-slate-300 hover:-translate-y-1')} dir="rtl">{w}</button>
                  ))}
                </div>
                {/* البطل */}
                <div className="absolute transition-all duration-300 text-5xl" style={{bottom: heroPos!==null?'140px':'60px', left: heroPos!==null?`${15+heroPos*(70/(pads.length-1||1))}%`:'10%'}}>🧒</div>
                {/* أرض */}
                <div className="absolute bottom-0 w-full h-14 bg-[#15803d] border-t-4 border-[#166534]"></div>
              </div>
            </div>
          );
        };


        const ArcadeHub = ({ onBack }) => {
          const [diff, setDiff] = useState('easy');
          const [stage, setStage] = useState('setup'); // setup → games → (game)
          const [game, setGame] = useState(null);
          const [custom, setCustom] = useState([]);
          const allWords = [...ARCADE_WORDS, ...custom];

          if (game==='catch') return <WordCatcher diff={diff} words={allWords} onBack={()=>setGame(null)}/>;
          if (game==='balloon') return <BalloonPop diff={diff} words={allWords} onBack={()=>setGame(null)}/>;
          if (game==='flash') return <FlashlightGame diff={diff} words={allWords} onBack={()=>setGame(null)}/>;
          if (game==='simon') return <SimonGame diff={diff} words={allWords} onBack={()=>setGame(null)}/>;
          if (game==='jump') return <JumpHero diff={diff} words={allWords} onBack={()=>setGame(null)}/>;

          // الخطوة 1: إعداد الصعوبة والكلمات قبل اختيار اللعبة
          if (stage==='setup') return (
            <div className="max-w-3xl mx-auto px-4 py-8 animate-pop-in space-y-5">
              <div className="flex items-center gap-3">
                <button onClick={onBack} className="w-11 h-11 bg-white rounded-2xl shadow-sm flex items-center justify-center text-badeec-navy hover:bg-slate-50"><Icon name="ArrowRight" size={22}/></button>
                <div><h2 className="font-baloo font-black text-2xl text-badeec-teal leading-tight">إعدادُ ألعاب القراءة</h2><p className="text-slate-400 font-bold text-xs">اختر الصعوبةَ والكلمات أولاً، ثم اللعبة</p></div>
              </div>

              {/* بطاقات الصعوبة */}
              <div className="bg-badeec-navy rounded-[2rem] p-6">
                <div className="text-center mb-4"><span className="text-white/70 text-xs font-black">١. اختر مستوى الصعوبة</span></div>
                <div className="grid grid-cols-3 gap-3">
                  {Object.values(DIFF_PRESETS).map(d=>(
                    <button key={d.key} onClick={()=>{setDiff(d.key);playSoundEffect('click');}}
                      className={"rounded-2xl p-4 flex flex-col items-center gap-1 border-4 transition active:scale-95 "+(diff===d.key?'text-white shadow-lg scale-105':'bg-white/5 text-slate-300 border-slate-600 hover:border-slate-400')}
                      style={diff===d.key?{background:d.color,borderColor:'#fff'}:{}}>
                      <span className="font-baloo font-black text-xl">{d.label}</span>
                      <span className={"text-[10px] font-bold leading-tight text-center "+(diff===d.key?'text-white/90':'text-slate-400')}>{d.note}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* كلمات المعلّم */}
              <div><div className="text-center mb-2"><span className="text-slate-500 text-xs font-black">٢. كلمات المعلّم (اختياري)</span></div><TeacherWords custom={custom} setCustom={setCustom}/></div>

              <button onClick={()=>{setStage('games');playSoundEffect('correct');}} className="w-full bg-badeec-teal hover:bg-badeec-deep text-white py-4 rounded-2xl font-baloo font-black text-lg inline-flex items-center justify-center gap-2 shadow-md active:scale-95 transition">
                متابعة لاختيار اللعبة <Icon name="ChevronLeft" size={22}/>
              </button>
            </div>
          );

          // الخطوة 2: اختيار اللعبة
          return (
            <div className="max-w-3xl mx-auto px-4 py-8 animate-pop-in space-y-5">
              <div className="flex items-center gap-3">
                <button onClick={onBack} className="w-11 h-11 bg-white rounded-2xl shadow-sm flex items-center justify-center text-badeec-navy hover:bg-slate-50"><Icon name="ArrowRight" size={22}/></button>
                <div className="flex-1"><h2 className="font-baloo font-black text-2xl text-badeec-teal leading-tight">اختر اللعبة</h2></div>
              </div>
              {/* ملخّص الإعداد + تغيير */}
              <div className="flex items-center justify-center gap-2 flex-wrap">
                <button onClick={()=>setStage('setup')} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full font-black text-sm text-white active:scale-95 transition" style={{background:DIFF_PRESETS[diff].color}}>
                  الصعوبة: {DIFF_PRESETS[diff].label} <Icon name="ArrowRight" size={14}/>
                </button>
                <span className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full font-bold text-sm bg-slate-100 text-slate-600">الكلمات: {allWords.length}</span>
              </div>

              <div className="grid md:grid-cols-2 gap-4">
                <button onClick={()=>{setGame('catch');playSoundEffect('click');}} className="bg-white rounded-[2rem] border-4 border-slate-200 hover:border-badeec-teal p-6 text-right transition active:scale-95 shadow-sm group">
                  <div className="text-5xl mb-2 group-hover:scale-110 transition">🫧</div>
                  <h3 className="font-baloo font-black text-xl text-badeec-navy mb-1">صائد الكلمات</h3>
                  <p className="text-slate-500 font-bold text-sm leading-snug">تنزل الكلماتُ بهدوء، والطالبُ ينقر الكلمةَ المطلوبة. لا عقوبةَ على الخطأ.</p>
                </button>
                <button onClick={()=>{setGame('balloon');playSoundEffect('click');}} className="bg-white rounded-[2rem] border-4 border-slate-200 hover:border-badeec-coral p-6 text-right transition active:scale-95 shadow-sm group">
                  <div className="text-5xl mb-2 group-hover:scale-110 transition">🎈</div>
                  <h3 className="font-baloo font-black text-xl text-badeec-navy mb-1">بالونات الكلمات</h3>
                  <p className="text-slate-500 font-bold text-sm leading-snug">تصعد البالوناتُ بهدوء، والطالبُ يفرقِّع بالونَ الكلمة الصحيحة.</p>
                </button>
              </div>
              <p className="text-slate-400 text-xs font-bold text-center">يمكنك تغييرُ الصعوبة أو الكلمات من زرّ «الصعوبة» في الأعلى.</p>
            </div>
          );
        };


        /* ============================================================
           رسومُ الحروف — الحرفُ نفسه يُرسم ليشبه قرينته
           الطفل يرى الحرف والصورة شيئاً واحداً
           ============================================================ */
        const LetterCueSVG = ({ letter, size=120 }) => {
          const L = letter === 'ا' ? 'أ' : letter;
          const html = React.useMemo(() => (window.CLUES && CLUES.info(L)) ? CLUES.card(L) : '', [L]);
          if (html) return <div style={{ width: Math.round(size * 2.5), maxWidth: '100%', margin: '0 auto', borderRadius: 20, overflow: 'hidden', boxShadow: '0 6px 18px rgba(120,80,40,.15)' }} dangerouslySetInnerHTML={{ __html: html }} />;
          const w=size, h=size;
          const c='#0e8a9c', r='#f15a68', sand='#dcb897', navy='#2b3044';
          // رسومات مبسّطة: الحرف يأخذ هيئة قرينته
          const illus = {
            'ب': ( // باء = قارب تحته بيضة
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M20 55 Q60 40 100 55" stroke={c} strokeWidth="6" fill="none" strokeLinecap="round"/><circle cx="60" cy="72" r="8" fill={sand} stroke={navy} strokeWidth="2"/><text x="60" y="52" textAnchor="middle" fill={c} fontFamily="'Cairo'" fontWeight="900" fontSize="28">بـ</text></svg>
            ),
            'ت': ( // تاء = صحن فوقه تمرتان
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M20 60 Q60 45 100 60" stroke={c} strokeWidth="6" fill="none" strokeLinecap="round"/><ellipse cx="45" cy="38" rx="7" ry="9" fill="#92400e" stroke="#78350f" strokeWidth="1.5"/><ellipse cx="72" cy="38" rx="7" ry="9" fill="#92400e" stroke="#78350f" strokeWidth="1.5"/><text x="60" y="54" textAnchor="middle" fill={c} fontFamily="'Cairo'" fontWeight="900" fontSize="14">تمرتان</text></svg>
            ),
            'ث': ( // ثاء = ثلاث كرات فوقها
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M20 65 Q60 50 100 65" stroke={c} strokeWidth="6" fill="none" strokeLinecap="round"/><circle cx="38" cy="38" r="7" fill={r}/><circle cx="60" cy="32" r="7" fill={r}/><circle cx="82" cy="38" r="7" fill={r}/><text x="60" y="82" textAnchor="middle" fill={navy} fontFamily="'Cairo'" fontWeight="800" fontSize="12">ثـلاث</text></svg>
            ),
            'ج': ( // جيم = جمل (السنام)
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M35 40 Q45 20 60 35 Q70 60 60 80" stroke={sand} strokeWidth="8" fill="none" strokeLinecap="round"/><circle cx="60" cy="88" r="5" fill={navy}/><circle cx="38" cy="34" r="4" fill={navy}/><line x1="38" y1="34" x2="34" y2="20" stroke={navy} strokeWidth="3" strokeLinecap="round"/></svg>
            ),
            'ح': ( // حاء = حوت (فم مفتوح)
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M30 35 Q40 20 65 30 Q90 40 85 65 Q80 85 55 90 Q30 85 25 65 Z" fill="#bae6fd" stroke={c} strokeWidth="4"/><path d="M30 50 Q45 55 65 48" stroke={navy} strokeWidth="3" fill="none"/><circle cx="50" cy="40" r="3" fill={navy}/><path d="M80 55 Q95 50 90 65" stroke={c} strokeWidth="3" fill="none"/></svg>
            ),
            'س': ( // سين = أسنان
              <svg viewBox="0 0 120 120" width={w} height={h}><rect x="22" y="35" width="16" height="40" rx="4" fill="white" stroke={navy} strokeWidth="2.5"/><rect x="42" y="30" width="16" height="45" rx="4" fill="white" stroke={navy} strokeWidth="2.5"/><rect x="62" y="35" width="16" height="40" rx="4" fill="white" stroke={navy} strokeWidth="2.5"/><rect x="82" y="38" width="16" height="37" rx="4" fill="white" stroke={navy} strokeWidth="2.5"/><path d="M18 78 H102" stroke={r} strokeWidth="4" strokeLinecap="round"/><text x="60" y="100" textAnchor="middle" fill={navy} fontFamily="'Cairo'" fontWeight="900" fontSize="14">سِـنّ</text></svg>
            ),
            'ش': ( // شين = شجرة
              <svg viewBox="0 0 120 120" width={w} height={h}><rect x="55" y="60" width="10" height="40" rx="3" fill="#92400e"/><circle cx="40" cy="45" r="18" fill="#22c55e" opacity=".8"/><circle cx="60" cy="35" r="20" fill="#16a34a"/><circle cx="80" cy="45" r="18" fill="#22c55e" opacity=".8"/><circle cx="40" cy="22" r="4" fill={navy}/><circle cx="60" cy="16" r="4" fill={navy}/><circle cx="80" cy="22" r="4" fill={navy}/></svg>
            ),
            'ص': ( // صاد = صحن
              <svg viewBox="0 0 120 120" width={w} height={h}><ellipse cx="60" cy="60" rx="42" ry="20" fill="white" stroke={navy} strokeWidth="4"/><ellipse cx="60" cy="60" rx="25" ry="10" fill="none" stroke={sand} strokeWidth="2"/><text x="60" y="100" textAnchor="middle" fill={navy} fontFamily="'Cairo'" fontWeight="900" fontSize="14">صَـحن</text></svg>
            ),
            'ط': ( // طاء = طبل بعصا
              <svg viewBox="0 0 120 120" width={w} height={h}><ellipse cx="55" cy="75" rx="32" ry="18" fill={sand} stroke={navy} strokeWidth="3"/><rect x="23" y="62" width="64" height="26" rx="2" fill={r} opacity=".3"/><ellipse cx="55" cy="62" rx="32" ry="12" fill={r} stroke={navy} strokeWidth="3"/><line x1="75" y1="20" x2="75" y2="68" stroke={navy} strokeWidth="5" strokeLinecap="round"/><circle cx="75" cy="18" r="5" fill={navy}/></svg>
            ),
            'ع': ( // عين = عين بشرية
              <svg viewBox="0 0 120 120" width={w} height={h}><path d="M20 55 Q60 25 100 55 Q60 85 20 55Z" fill="white" stroke={navy} strokeWidth="4"/><circle cx="60" cy="55" r="16" fill="#78350f"/><circle cx="60" cy="55" r="8" fill={navy}/><circle cx="64" cy="52" r="3" fill="white"/></svg>
            ),
            'ف': ( // فاء = فيل (رأس+خرطوم)
              <svg viewBox="0 0 120 120" width={w} height={h}><circle cx="55" cy="48" r="26" fill="#94a3b8" stroke={navy} strokeWidth="3"/><path d="M29 48 Q15 55 18 75 Q20 85 28 80" stroke="#94a3b8" strokeWidth="8" fill="none" strokeLinecap="round"/><circle cx="46" cy="42" r="4" fill={navy}/><circle cx="55" cy="24" r="5" fill={navy}/><path d="M65 65 Q75 80 90 85" stroke="#94a3b8" strokeWidth="6" fill="none" strokeLinecap="round"/><text x="60" y="108" textAnchor="middle" fill={navy} fontFamily="'Cairo'" fontWeight="900" fontSize="14">فِيل</text></svg>
            ),
            'ك': ( // كاف = كرسي
              <svg viewBox="0 0 120 120" width={w} height={h}><rect x="30" y="25" width="8" height="70" rx="3" fill={navy}/><rect x="82" y="55" width="8" height="40" rx="3" fill={navy}/><path d="M30 55 H90" stroke={navy} strokeWidth="8" strokeLinecap="round"/><path d="M30 25 Q55 20 80 30" stroke={navy} strokeWidth="5" fill="none" strokeLinecap="round"/></svg>
            ),
            'م': ( // ميم = مفتاح
              <svg viewBox="0 0 120 120" width={w} height={h}><circle cx="45" cy="45" r="20" fill="none" stroke={sand} strokeWidth="6"/><line x1="65" y1="45" x2="100" y2="45" stroke={sand} strokeWidth="6" strokeLinecap="round"/><line x1="90" y1="45" x2="90" y2="60" stroke={sand} strokeWidth="5" strokeLinecap="round"/><line x1="80" y1="45" x2="80" y2="55" stroke={sand} strokeWidth="5" strokeLinecap="round"/><text x="60" y="100" textAnchor="middle" fill={navy} fontFamily="'Cairo'" fontWeight="900" fontSize="14">مِفتاح</text></svg>
