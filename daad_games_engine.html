const WORD_BANK = {

  shadda: { syllables: ["بَّ", "تَّ", "ثَّ", "جَّ"], easy: ["رَتَّبَ", "عَلَّمَ", "سَلَّمَ", "قِصَّةٌ"], hard: ["مُعَلِّمُ", "رُمَّانٌ", "الرَّأْيَ"], sentences: ["رَتَّبَ سَالِمٌ سَرِيرَهُ فِي الصَّبَاحِ", "يُعَلِّمُ الْمُعَلِّمُ النَّاسَ الْخَيْرَ"] }

// حزمة درس تُمرَّر من «مدن ضاد» عبر الرابط: ?pack=...&diff=...&game=...
const QP = new URLSearchParams(window.location.search);
try {
  const pk = QP.get('pack');
  if (pk) {
    const P = JSON.parse(pk);
    const fill = (a, b) => (a && a.length ? a : b) || [];
    WORD_BANK.lesson = { name: P.name || 'حروف الدرس', syllables: fill(P.syllables, P.easy), easy: fill(P.easy, P.syllables), hard: fill(P.hard, P.easy), sentences: P.sentences || [] };
  }
} catch (e) {}

const stripDiacritics = (str) => str.replace(/[\u064B-\u065F\u0670\u0651]/g, '');

const playSoundEffect = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)(); const now = ctx.currentTime;
        if (type === 'win') { [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.1); gain.gain.setValueAtTime(0.1, now + idx * 0.1); gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25); osc.connect(gain); gain.connect(ctx.destination); osc.start(now + idx * 0.1); osc.stop(now + idx * 0.1 + 0.3); }); } 
        else if (type === 'fail') { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.2); } 
        else if (type === 'shoot') { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(now + 0.1); } 
        else if (type === 'jump') { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.15); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(now + 0.15); }
        else if (type === 'build') { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.1); }
        else if (type === 'click' || type === 'pop') { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(type === 'pop' ? 600 : 450, now); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.1); }
    } catch (e) {}
};

const ConfettiComponent = () => {

const DEFAULT_CONFIG = { skill: 'fatha', difficulty: 'easy', speed: 0.2, targetScore: 3 };
if (WORD_BANK.lesson) { DEFAULT_CONFIG.skill = 'lesson'; DEFAULT_CONFIG.difficulty = QP.get('diff') || 'syllables'; }

const ConveyorGame = ({ config, onWin, onBack }) => {
    const [gameState, setGameState] = useState('idle'); const [score, setScore] = useState(0); const [targetWord, setTargetWord] = useState(''); const [items, setItems] = useState([]);
    const wordsList = WORD_BANK[config.skill][config.difficulty === 'sentences' ? 'hard' : config.difficulty];
    const reqRef = useRef(); const itemsRef = useRef([]); const scoreRef = useRef(0); const lastSpawn = useRef(0);
    const targetRef = useRef(''); const wordsRef = useRef(wordsList);
    useEffect(() => { wordsRef.current = wordsList; }, [wordsList]);
    const startGame = () => { setGameState('playing'); setScore(0); scoreRef.current = 0; itemsRef.current = []; setItems([]); const t = wordsList[Math.floor(Math.random() * wordsList.length)]; setTargetWord(t); targetRef.current = t; };
    const update = useCallback(() => {
        if (gameState !== 'playing') return; const now = Date.now(); const moveSpeed = config.speed + 0.2; const spawnDelay = 2500 - (config.speed * 2000);
        if (now - lastSpawn.current > Math.max(800, spawnDelay)) {
            const isTarget = Math.random() > 0.4; let text = targetRef.current;
            if (!isTarget) { const distractors = wordsRef.current.filter(w=>w!==targetRef.current); text = distractors.length>0 ? distractors[Math.floor(Math.random() * distractors.length)] : wordsRef.current[0]; }
            itemsRef.current.push({ id: Math.random(), text, isTarget, right: -20 }); lastSpawn.current = now;
        }
        itemsRef.current = itemsRef.current.map(item => { item.right += moveSpeed; return item; }).filter(item => item.right < 120);
        setItems([...itemsRef.current]); reqRef.current = requestAnimationFrame(update);
    }, [gameState, config.speed]);
    useEffect(() => { if (gameState === 'playing') reqRef.current = requestAnimationFrame(update); return () => cancelAnimationFrame(reqRef.current); }, [gameState, update]);
    const handleStamp = () => {
        if (gameState !== 'playing') return; const inScanner = itemsRef.current.find(item => item.right > 40 && item.right < 60);
        if (inScanner) {
            if (inScanner.isTarget) { playSoundEffect('win'); itemsRef.current = itemsRef.current.filter(i => i.id !== inScanner.id); scoreRef.current += 1; setScore(scoreRef.current); const t = wordsRef.current[Math.floor(Math.random() * wordsRef.current.length)]; setTargetWord(t); targetRef.current = t; if (scoreRef.current >= config.targetScore) { setGameState('won'); onWin(config.targetScore); } } 
            else { playSoundEffect('fail'); scoreRef.current = Math.max(0, scoreRef.current - 1); setScore(scoreRef.current); itemsRef.current = itemsRef.current.filter(i => i.id !== inScanner.id); }
        } else { playSoundEffect('fail'); }
    };
    return (
        <div className="h-full flex flex-col bg-slate-100 rounded-[2rem] border-4 border-slate-300 overflow-hidden relative shadow-inner"><div className="p-3 bg-slate-800 text-white flex justify-between z-20 font-changa shadow-md"><button onClick={onBack} className="p-1 hover:bg-slate-700 rounded-xl"><ChevronRight size={24}/></button><div className="font-bold text-center"><span className="text-xs text-slate-400 block">افحص الكلمة:</span><span className="text-2xl text-emerald-400 font-naskh font-black">{targetWord}</span></div><div className="font-bold text-emerald-400 bg-slate-900 px-4 py-2 rounded-full">{score} / {config.targetScore}</div></div><div className="flex-1 relative flex flex-col justify-center">{gameState === 'idle' && (<div className="absolute inset-0 flex flex-col items-center justify-center bg-white/80 backdrop-blur-sm z-30 font-changa"><ScanLine className="w-20 h-20 text-slate-700 mb-4" /><h3 className="text-3xl font-black text-slate-800 mb-2">حزام المصنع</h3><button onClick={startGame} className="mt-4 bg-emerald-500 text-white px-8 py-3 rounded-full font-bold text-xl hover:bg-emerald-600 shadow-lg">تشغيل الحزام</button></div>)}{gameState === 'won' && (<div className="absolute inset-0 flex flex-col items-center justify-center bg-white/90 backdrop-blur-md z-30 font-changa"><Trophy className="w-24 h-24 text-yellow-500 mb-4 animate-pop" /><h3 className="text-4xl font-black text-slate-800 mb-6">فحص ممتاز!</h3><button onClick={startGame} className="bg-emerald-500 text-white px-8 py-3 rounded-full font-bold text-xl shadow-lg">العب مجدداً</button></div>)}<div className="w-full h-32 bg-slate-700 relative overflow-hidden flex items-center shadow-inner border-y-8 border-slate-800"><div className="absolute inset-0 opacity-20" style={{backgroundImage: 'repeating-linear-gradient(90deg, transparent, transparent 40px, #000 40px, #000 80px)'}}></div><div className="absolute top-0 bottom-0 border-x-4 border-dashed border-emerald-400 bg-emerald-400/20 z-10" style={{ right: '40%', width: '20%' }}></div>{items.map(item => (<div key={item.id} className="absolute bg-amber-100 border-4 border-amber-300 px-6 py-3 rounded-xl font-naskh font-black text-3xl shadow-lg whitespace-nowrap z-0 text-amber-900" style={{ right: `${item.right}%`, transform: 'translateX(50%)' }}>{item.text}</div>))}</div>{gameState === 'playing' && (<div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20"><button onClick={handleStamp} className="w-32 h-32 bg-red-500 rounded-full border-8 border-red-700 shadow-[0_10px_0_#991b1b] active:shadow-none active:translate-y-2 flex items-center justify-center text-white font-black text-xl transition-all">افحص!</button></div>)}</div></div>
    );
};

const CardSortGame = ({ config, onWin, onBack }) => {
    const [gameState, setGameState] = useState('idle'); const [score, setScore] = useState(0); const [targetWord, setTargetWord] = useState(''); const [currentCard, setCurrentCard] = useState(null); const [animationClass, setAnimationClass] = useState('');

    const generateCard = (target) => { const isTarget = Math.random() > 0.5; let text = target; if (!isTarget) { const distractors = wordsList.filter(w=>w!==target); text = distractors.length>0 ? distractors[Math.floor(Math.random() * distractors.length)] : wordsList[0]; } setCurrentCard({ text, isTarget }); setAnimationClass('animate-in zoom-in duration-300'); setTimeout(() => setAnimationClass(''), 300); };
    const startGame = () => { setGameState('playing'); setScore(0); const newTarget = wordsList[Math.floor(Math.random() * wordsList.length)]; setTargetWord(newTarget); generateCard(newTarget); };
    const handleChoice = (choseYes) => { if (gameState !== 'playing' || !currentCard) return; const isCorrectChoice = (choseYes && currentCard.isTarget) || (!choseYes && !currentCard.isTarget); if (isCorrectChoice) { playSoundEffect('shoot'); const newScore = score + 1; setScore(newScore); if (newScore >= config.targetScore) { playSoundEffect('win'); setGameState('won'); onWin(config.targetScore); } else { generateCard(targetWord); } } else { playSoundEffect('fail'); setAnimationClass('animate-shake text-rose-500'); setScore(Math.max(0, score - 1)); setTimeout(() => setAnimationClass(''), 400); } };

        <div className="h-full flex flex-col bg-purple-50 rounded-[2rem] border-4 border-purple-300 overflow-hidden relative shadow-inner"><div className="p-3 bg-purple-900 text-white flex justify-between z-10 font-changa shadow-md"><button onClick={onBack} className="p-1 hover:bg-purple-800 rounded-xl"><ChevronRight size={24}/></button><div className="font-bold text-center"><span className="text-xs text-purple-300 block">نبحث عن:</span><span className="text-2xl text-yellow-300 font-naskh font-black">{targetWord}</span></div><div className="font-bold text-yellow-300 bg-purple-950 px-4 py-2 rounded-full">{score} / {config.targetScore}</div></div><div className="flex-1 relative flex flex-col justify-center items-center p-6">{gameState === 'idle' && (<div className="absolute inset-0 flex flex-col items-center justify-center bg-white/80 backdrop-blur-sm z-30 font-changa"><Layers className="w-20 h-20 text-purple-600 mb-4" /><h3 className="text-3xl font-black text-purple-900 mb-2">الفرز السريع</h3><button onClick={startGame} className="mt-6 bg-purple-600 text-white px-8 py-3 rounded-full font-bold text-xl hover:bg-purple-700 shadow-lg">ابدأ الفرز</button></div>)}{gameState === 'won' && (<div className="absolute inset-0 flex flex-col items-center justify-center bg-white/90 backdrop-blur-md z-30 font-changa"><Trophy className="w-24 h-24 text-yellow-500 mb-4 animate-pop" /><h3 className="text-4xl font-black text-purple-900 mb-6">سرعة بديهة رائعة!</h3><button onClick={startGame} className="bg-purple-600 text-white px-8 py-3 rounded-full font-bold text-xl shadow-lg">العب مجدداً</button></div>)}{gameState === 'playing' && currentCard && (<div className="flex flex-col items-center w-full max-w-sm"><div className={`w-full aspect-[4/3] bg-white rounded-3xl border-4 border-purple-200 shadow-xl flex items-center justify-center mb-8 ${animationClass}`}><span className="font-naskh font-black text-5xl md:text-6xl text-slate-800 text-center px-4 leading-tight">{currentCard.text}</span></div><div className="flex justify-center gap-6 w-full"><button onClick={() => handleChoice(false)} className="flex-1 py-5 bg-rose-500 text-white rounded-2xl font-black shadow-[0_6px_0_#991b1b] active:translate-y-1 active:shadow-none flex justify-center items-center hover:bg-rose-600 transition-all"><X strokeWidth={4} size={32} /></button><button onClick={() => handleChoice(true)} className="flex-1 py-5 bg-emerald-500 text-white rounded-2xl font-black shadow-[0_6px_0_#065f46] active:translate-y-1 active:shadow-none flex justify-center items-center hover:bg-emerald-600 transition-all"><Check strokeWidth={4} size={32} /></button></div></div>)}</div></div>
    );

const WhackAMoleGame = ({ config, onWin, onBack }) => {
    const [gameState, setGameState] = useState('idle'); const [score, setScore] = useState(0); const [targetWord, setTargetWord] = useState(''); const [holes, setHoles] = useState(Array(6).fill(null));
    const wordsList = WORD_BANK[config.skill][config.difficulty === 'sentences' ? 'hard' : config.difficulty]; const scoreRef = useRef(0); const activeTimeouts = useRef([]);
    const targetRef = useRef(''); const wordsRef = useRef(wordsList);
    useEffect(() => { wordsRef.current = wordsList; }, [wordsList]);
    const startGame = () => { setGameState('playing'); setScore(0); scoreRef.current = 0; const t = wordsList[Math.floor(Math.random() * wordsList.length)]; setTargetWord(t); targetRef.current = t; spawnMole(); };
    const clearAllTimeouts = () => { activeTimeouts.current.forEach(clearTimeout); activeTimeouts.current = []; };
    const spawnMole = () => {

            if (targetWord) { optionsRef.current.push({ id: Math.random(), text, isCorrect, x: Math.random() * 80 + 10, y: 110, speed: -(config.speed + 0.1 + Math.random() * 0.1) }); lastSpawn.current = now; }

const LegoBlock = ({ x, y, w, h, color, studs = 0 }) => {
    const studWidth = w / studs;
    return (
        <g className="animate-drop-in origin-bottom">
            <rect x={x+2} y={y+2} width={w} height={h} fill="rgba(0,0,0,0.15)" rx="2"/>
            <rect x={x} y={y} width={w} height={h} fill={color} stroke="rgba(0,0,0,0.2)" strokeWidth="1.5" rx="2"/>
            <rect x={x+1} y={y+1} width={w-2} height={4} fill="rgba(255,255,255,0.3)" rx="1"/>
            {Array.from({length: studs}).map((_, i) => {
                const sx = x + (studWidth * i) + (studWidth/2) - 4; const sy = y - 5;
                return (
                    <g key={i}>
                        <rect x={sx} y={sy} width="8" height="6" fill={color} stroke="rgba(0,0,0,0.2)" strokeWidth="1" rx="1"/>
                        <rect x={sx+1} y={sy+1} width="6" height="2" fill="rgba(255,255,255,0.4)" rx="0.5"/>
                    </g>
                );
            })}
        </g>
    );

const LegoRewardSystem = ({ stars, setStars, stage, setStage, selectedShape, setSelectedShape }) => {
    const handleUpgrade = () => {
        if (stars >= 5 && stage < 7) { playSoundEffect('build'); setStars(s => s - 5); setStage(stage + 1); } 
        else { playSoundEffect('fail'); }
    };

    if (!selectedShape) {
        return (
            <div className="flex-1 flex flex-col items-center justify-center font-changa text-center h-full">
                <Hammer className="w-12 h-12 text-blue-500 mb-4" />
                <h3 className="text-2xl font-black text-slate-800 mb-2">ورشة ليجو الأبطال</h3>
                <p className="text-slate-500 mb-4">اختري شكلاً لتبدأي ببنائه!</p>
                <div className="grid grid-cols-2 gap-4 w-full">
                    {Object.values(LEGO_SHAPES).map(shape => (
                        <button key={shape.id} onClick={() => { playSoundEffect('click'); setSelectedShape(shape.id); }} className="bg-slate-50 border-2 border-slate-200 p-4 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-colors font-bold text-slate-700 flex flex-col items-center">
                            <span className="text-3xl mb-2">{shape.id === 'robot'?'🤖':shape.id === 'rocket'?'🚀':shape.id === 'castle'?'🏰':'🏎️'}</span>
                            {shape.name}
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    const shapeDef = LEGO_SHAPES[selectedShape];
    const partsToRender = shapeDef.parts.filter(p => p.step <= stage);
    const isComplete = stage === 7;

    return (
        <div className="h-full flex flex-col items-center relative font-changa">
            <div className="flex justify-between w-full mb-2">
                <span className="font-bold text-blue-600">{shapeDef.name}</span>
                <button onClick={()=>{setSelectedShape(null); setStage(0);}} className="text-xs text-rose-500 hover:underline">تغيير الشكل</button>
            </div>
            
            <div className="relative w-full h-48 bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center border-4 border-slate-200 bg-lego-pattern">
                {/* Blueprint */}
                <svg viewBox="0 0 200 200" className="w-[200px] h-[200px] absolute opacity-10 grayscale">
                    {shapeDef.parts.map((p, idx) => { if (p.c === LegoBlock) return <LegoBlock key={`b-${idx}`} {...p.props} color="#94a3b8" />; const Tag = p.c; return <Tag key={`b-${idx}`} {...p.props} fill="#94a3b8" stroke="none" />; })}
                </svg>
                {/* Real blocks */}
                <svg viewBox="0 0 200 200" className="w-[200px] h-[200px] absolute z-10 drop-shadow-xl">
                    {partsToRender.map((p, idx) => { if (p.c === LegoBlock) return <LegoBlock key={idx} {...p.props} />; const Tag = p.c; return <Tag key={idx} {...p.props} className={`${p.props.className || ''} animate-drop-in origin-center`} />; })}
                </svg>
                {stage === 0 && <span className="absolute bottom-4 text-slate-400 font-bold text-xs">ورشة فارغة.. اشتري القطع!</span>}
            </div>

            <button onClick={handleUpgrade} disabled={isComplete || stars < 5} className={`mt-auto w-full py-3 rounded-xl font-black text-lg transition-all ${isComplete ? 'bg-slate-100 text-slate-400' : stars >= 5 ? `bg-blue-500 text-white shadow-md hover:bg-blue-600` : 'bg-slate-100 text-slate-400 opacity-70'}`}>
                {isComplete ? 'اكتمل البناء! 🎉' : 'قطعة ليجو (5 نجوم ⭐)'}
            </button>
        </div>
    );
};

const RewardStore = ({ stars, setStars, type, stages, setStages, legoShape, setLegoShape }) => {
    const stage = stages[type] || 0;
    const handleUpgrade = () => { if (stars >= 5 && stage < 5) { playSoundEffect('win'); setStars(s => s - 5); setStages(prev => ({ ...prev, [type]: stage + 1 })); } else { playSoundEffect('fail'); } };

    if (type === 'lego') {
        return (
            <div className="flex flex-col h-full bg-white rounded-[2rem] p-6 shadow-xl border-4 border-slate-100">
                <LegoRewardSystem stars={stars} setStars={setStars} stage={stages.lego || 0} setStage={(s) => setStages(prev => ({...prev, lego: s}))} selectedShape={legoShape} setSelectedShape={setLegoShape} />
            </div>
        );
    }

    const themes = { garden: { title: "حديقتي السعيدة", color: "emerald", icon: Home, desc: "ازرع الأشجار وابنِ المنزل" }, mira: { title: "خزانة ميرا", color: "pink", icon: Smile, desc: "افتحي فساتين محتشمة وأنيقة" }, baby: { title: "حضانة ثابت", color: "sky", icon: Baby, desc: "اعتنِ بالرضيع الصغير" } };
    const t = themes[type];

    const renderVisual = () => {
        if (type === 'garden') return (
            <div className="relative w-full h-40 bg-sky-100 rounded-xl overflow-hidden flex items-end justify-center border-b-8 border-emerald-500">
                {stage >= 1 && <div className="absolute bottom-0 w-24 h-20 bg-yellow-100 border-2 border-yellow-400 rounded-t-lg"></div>}
                {stage >= 2 && <div className="absolute bottom-20 w-32 h-0 border-l-[16px] border-r-[16px] border-b-[30px] border-l-transparent border-r-transparent border-b-red-500"></div>}
                {stage >= 3 && <div className="absolute bottom-0 left-4 w-6 h-20 bg-amber-800"><div className="absolute -top-10 -left-6 w-16 h-16 bg-emerald-500 rounded-full"></div></div>}
                {stage >= 4 && <div className="absolute top-4 right-4 w-8 h-8 bg-yellow-400 rounded-full animate-pulse"></div>}
                {stage >= 5 && <div className="absolute bottom-0 right-8 text-2xl animate-bounce">🦋</div>}
                {stage === 0 && <span className="text-slate-400 font-bold mb-4 font-changa">أرض فارغة.. ابدأ البناء!</span>}
            </div>
        );
        if (type === 'mira') return (
            <div className="relative w-full h-40 bg-pink-50 rounded-xl overflow-hidden flex items-center justify-center border-2 border-pink-200">
                <div className="flex flex-col items-center">
                    <div className="w-12 h-12 bg-[#ffedd5] rounded-full flex items-center justify-center"><div className="w-10 h-10 bg-[#78350f] rounded-full -mt-4"></div></div>
                    <div className={`w-16 transition-all duration-500 rounded-t-lg ${stage===0 ? 'h-16 bg-slate-200' : stage===1 ? 'h-20 bg-pink-400' : stage===2 ? 'h-24 bg-purple-500' : stage>=3 ? 'h-24 bg-rose-500 border-x-4 border-yellow-300' : ''}`}></div>
                </div>
            </div>
        );
        if (type === 'baby') return (
            <div className="relative w-full h-40 bg-blue-50 rounded-xl overflow-hidden flex items-center justify-center border-2 border-blue-200">
                <div className="relative flex flex-col items-center">
                    <div className={`w-14 h-14 bg-[#ffedd5] rounded-full flex items-center justify-center ${stage>=4 ? 'bg-sky-400':''}`}>
                        {stage < 2 && <div className="w-4 h-2 border-b-2 border-rose-400 rounded-full mt-4"></div>}
                        {stage >= 2 && <div className="w-6 h-6 bg-yellow-400 rounded-full mt-4 border-2 border-white"></div>}
                    </div>
                    <div className={`w-16 h-16 rounded-[40%] mt-1 ${stage >= 1 ? 'bg-emerald-400' : 'bg-white'}`}></div>
                </div>
            </div>
        );
    };

    return (
        <div className="flex flex-col h-full bg-white rounded-[2rem] p-6 shadow-xl border-4 border-slate-100 font-changa">
            <div className={`flex items-center gap-2 text-${t.color}-600 mb-4`}><t.icon size={28} /> <h3 className="text-2xl font-black">{t.title}</h3></div>
            <p className="text-slate-500 text-sm font-bold mb-4">{t.desc} (المرحلة {stage}/5)</p>
            {renderVisual()}
            <div className="mt-auto pt-6">
                <button onClick={handleUpgrade} disabled={stage >= 5 || stars < 5} className={`w-full py-4 rounded-xl font-black text-lg flex items-center justify-center gap-2 transition-all ${stage >= 5 ? 'bg-slate-100 text-slate-400' : stars >= 5 ? `bg-${t.color}-500 text-white shadow-md hover:bg-${t.color}-600 hover:-translate-y-1` : 'bg-slate-100 text-slate-400 opacity-70'}`}>
                    {stage >= 5 ? 'اكتمل التطوير! 🎉' : 'تطوير (5 نجوم ⭐)'}
                </button>
            </div>
        </div>
    );
};

                                <div onClick={()=>setActiveGame('spaceship')} className="bg-indigo-50 p-4 rounded-3xl border-2 border-indigo-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Rocket className="w-8 h-8 text-indigo-500 mx-auto mb-2"/><h3 className="font-bold text-indigo-800">مكوك الفضاء</h3></div>
                                <div onClick={()=>setActiveGame('cannon')} className="bg-rose-50 p-4 rounded-3xl border-2 border-rose-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Crosshair className="w-8 h-8 text-rose-500 mx-auto mb-2"/><h3 className="font-bold text-rose-800">مدفع الليزر</h3></div>
                                <div onClick={()=>setActiveGame('jump')} className="bg-teal-50 p-4 rounded-3xl border-2 border-teal-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><MoveUp className="w-8 h-8 text-teal-500 mx-auto mb-2"/><h3 className="font-bold text-teal-800">البطل القافز</h3></div>
                                <div onClick={()=>setActiveGame('simon')} className="bg-violet-50 p-4 rounded-3xl border-2 border-violet-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Repeat className="w-8 h-8 text-violet-500 mx-auto mb-2"/><h3 className="font-bold text-violet-800">تتابع الألوان</h3></div>
                                <div onClick={()=>setActiveGame('flashlight')} className="bg-slate-800 p-4 rounded-3xl border-2 border-slate-600 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Lightbulb className="w-8 h-8 text-yellow-400 mx-auto mb-2"/><h3 className="font-bold text-yellow-400">كشاف الظلام</h3></div>
                                {(WORD_BANK[gameConfig.skill].sentences || []).length > 0 && (<div onClick={()=>setActiveGame('bridge')} className="bg-emerald-50 p-4 rounded-3xl border-2 border-emerald-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Footprints className="w-8 h-8 text-emerald-500 mx-auto mb-2"/><h3 className="font-bold text-emerald-800">خطوات الشجعان</h3></div>)}
                                <div onClick={()=>setActiveGame('conveyor')} className="bg-slate-100 p-4 rounded-3xl border-2 border-slate-300 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><ScanLine className="w-8 h-8 text-slate-600 mx-auto mb-2"/><h3 className="font-bold text-slate-800">حزام المصنع</h3></div>
                                <div onClick={()=>setActiveGame('cardsort')} className="bg-purple-50 p-4 rounded-3xl border-2 border-purple-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><Layers className="w-8 h-8 text-purple-500 mx-auto mb-2"/><h3 className="font-bold text-purple-800">الفرز السريع</h3></div>
                                <div onClick={()=>setActiveGame('whack')} className="bg-amber-50 p-4 rounded-3xl border-2 border-amber-200 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><MousePointerClick className="w-8 h-8 text-amber-500 mx-auto mb-2"/><h3 className="font-bold text-amber-800">صيد الكلمات</h3></div>
                                <div onClick={()=>setActiveGame('claw')} className="bg-yellow-50 p-4 rounded-3xl border-2 border-yellow-300 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><ArrowDownToLine className="w-8 h-8 text-yellow-600 mx-auto mb-2"/><h3 className="font-bold text-yellow-800">رافعة الأبطال</h3></div>
                                <div onClick={()=>setActiveGame('doors')} className="bg-emerald-900 p-4 rounded-3xl border-2 border-emerald-700 text-center cursor-pointer hover:scale-105 transition-transform shadow-sm"><DoorOpen className="w-8 h-8 text-emerald-400 mx-auto mb-2"/><h3 className="font-bold text-emerald-400">بوابات العبور</h3></div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] p-4 md:p-6 shadow-xl border-4 border-indigo-100 flex-1 flex flex-col animate-in zoom-in-95 duration-300">
                            <div className="flex justify-between items-center mb-6 bg-slate-50 p-2 rounded-2xl border border-slate-200">
                                <button onClick={() => setActiveGame(null)} className="flex items-center gap-1 font-bold text-slate-500 hover:text-slate-800 px-3 py-1 bg-white rounded-xl shadow-sm"><ChevronRight size={18}/> المحرك</button>
                                <div className="flex gap-2 text-xs font-bold">
                                    <span className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md">مهارة: {(WORD_BANK[gameConfig.skill] || {}).name || gameConfig.skill}</span>
                                    <span className="bg-rose-100 text-rose-700 px-2 py-1 rounded-md">مستوى: {gameConfig.difficulty}</span>
                                </div>
                            </div>

                            <div className="flex-1 w-full h-full">
                                {activeGame === 'spaceship' && <SpaceshipSteeringGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'cannon' && <LaserCannonGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'jump' && <JumpingHeroGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'simon' && <SequenceMemoryGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'flashlight' && <FlashlightGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'bridge' && <SentenceBridgeGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'conveyor' && <ConveyorGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'cardsort' && <CardSortGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'whack' && <WhackAMoleGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'claw' && <ClawMachineGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                                {activeGame === 'doors' && <MazeDoorsGame config={gameConfig} onWin={handleWin} onBack={() => setActiveGame(null)} />}
                            </div>
                        </div>
                    )}
                </div>

                {/* Reward Store Area (4 cols) */}
                <div className="lg:col-span-4 h-full">
                    <RewardStore stars={stars} setStars={setStars} type={rewardType} stages={rewardStages} setStages={setRewardStages} legoShape={legoShape} setLegoShape={setLegoShape} />
                </div>

            </main>
        </div>
    );
};

createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
