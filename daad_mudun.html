          <button className="mc-btn sm" onClick={() => setTeacher(true)}>لوحة المعلّم</button>
        </div>
      </div>
      {toastMsg && <div className="toast" style={{ position: 'fixed' }}>{toastMsg}</div>}
      {teacher && <TeacherPanel state={state} setState={setState} cityId={cityId} onClose={() => setTeacher(false)} openGame={g => { setScreen('city'); openGame(g); }} />}
      {placing && <PlacementTest state={state} setState={setState} onClose={() => setPlacing(false)} enterCity={id => { setPlacing(false); enterCity(id); }} />}
    </div>
  );

  const M = modal && STN.find(s => s.id === modal.id);
  const cityName = D.CITIES.find(c => c.id === cityId).name;
  return (
    <Reward.Provider value={RV}>
    <div className="city-view">
      <div className="hud">
        <button className="mc-btn sm" onClick={() => setScreen('world')}>→ الخريطة</button>
        <div className="cname">{cityName}</div>
        <div className="pips">{STN.map((s, i) => (
          <span key={s.id} className={'pip ' + (status[s.id] === 'done' ? 'done' : status[s.id] === 'now' ? 'now' : '')} title={s.step} onClick={() => arrive(s.id)}><b>{status[s.id] === 'done' ? '✓' : i + 1}</b>{s.pip}</span>
        ))}</div>
        <span className="stars-hud" title="كلّ إجابة تبني طابقًا في بيت الطالب">⭐ {stars} · 🏠 الطابق {floor}</span>
        <button className="mc-btn sm" onClick={() => setState(s => ({ ...s, mute: !s.mute }))} aria-label="الصوت">{state.mute ? '🔇' : '🔊'}</button>
        <button className="mc-btn sm" onClick={() => setTeacher(true)}>المعلّم</button>
      </div>
      <div className="stage">
        <CityWorld key={cityId + order} L={L} hero={state.hero} status={status} paused={!!modal || teacher} onArrive={arrive} toast={toast} />
        <div className="hint">اضغط على أي مبنى ليمشي إليه البطل — كل المحطات مفتوحة</div>
        {toastMsg && <div className="toast">{toastMsg}</div>}
      </div>
      {M && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>{M.label}{cityId === 'huruf' && /^[ga]\d/.test(M.id) ? ': ' + M.pip : <span style={{ fontSize: 15, opacity: .8 }}> — {M.step}</span>}</h3><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b">
            {cityId === 'huruf' && M.id === 'talk' && <><TalkStation units={CD.hurufTalk} hero={state.hero} /><div className="center"><button className="mc-btn sm" onClick={() => markDone('talk')}>✓ أنهِ المحطة</button></div></>}
            {cityId === 'huruf' && M.id !== 'talk' && <HalfTabs units={CD.hurufTalk} index={sIdx(M.id)} hero={state.hero}>
            {cityId === 'huruf' && M.id === 'train' && <TrainStation onDone={() => markDone('train')} />}
            {cityId === 'huruf' && /^[ga]\d/.test(M.id) && <LetterGroupStation key={M.id} gi={+M.id.slice(1) - 1} groups={D.hurufGroups(order)} onDone={() => markDone(M.id)} openXO={pool => setModal({ id: 'game', game: 'xoL', pool })} onResult={(l, v) => setState(s => ({ ...s, report: { ...(s.report || {}), [l]: v } }))} hero={state.hero} />}
            </HalfTabs>}
            {cfg.generic && M.id === 'talk' && <GenStation C={C2} id="talk" hero={state.hero} />}
            {cfg.generic && M.id !== 'talk' && <HalfTabs key={M.id} units={C2.talk} index={sIdx(M.id)} hero={state.hero}><GenStation C={C2} id={M.id} hero={state.hero} /></HalfTabs>}
            {cfg.library && <Library hero={state.hero} />}
            {(cfg.generic || cfg.library) && <div className="center" style={{ marginTop: 16 }}><button className="mc-btn sm" onClick={() => markDone(M.id)}>✓ للمعلّم: أنهِ المحطة</button></div>}
          </div>
        </div></div>
      )}
      {modal && modal.id === 'game' && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>{modal.game === 'xoL' ? 'إكس-أو الحروف' : (GAMES.find(g => g.id === modal.game) || {}).name}</h3><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b">
            {modal.game === 'xoL' ? <XOGame mode="letter" pool={modal.pool} /> : <GamesStation done startGame={modal.game} onDone={() => {}} />}
          </div>
        </div></div>
      )}
      {modal && modal.id === 'finish' && (
        <div className="overlay"><div className="mc panel" style={{ width: 'min(560px,100%)' }}>
          <div className="panel-h"><h3>بوابة المدينة</h3></div>
          <div className="panel-b" style={{ textAlign: 'center' }}>
            {cfg.generic && <CityTest C={C2} onDone={r => setState(s => ({ ...s, cityTest: { ...(s.cityTest || {}), [cityId]: { ok: r.filter(x => x[1] === 'ok').length, help: r.filter(x => x[1] === 'help').length, no: r.filter(x => x[1] === 'no').map(x => x[0]) } } }))} />}
            {idx === -1 ? (<>
              <div className="stars" style={{ marginBottom: 10 }}><i /><i /><i /></div>
              <h2 style={{ margin: '0 0 6px', fontSize: 30 }}>{cfg.finishTitle}</h2>
              <p className="lead">{cfg.finishSub}</p>
              <div className="big-word" style={{ fontSize: 64 }}>{cfg.finishWord}</div>
            </>) : (<>
              <h2 style={{ margin: '0 0 6px', fontSize: 26 }}>بقيت محطات في هذه المدينة</h2>
              <p className="lead">{STN.filter(s => !prog[s.id]).map(s => s.label + (cityId === 'huruf' ? ' (' + s.pip + ')' : '')).join('، ')}</p>
            </>)}
            <div className="center">
              <button className="mc-btn go" onClick={() => { if (idx === -1) setState(s => ({ ...s, done: { ...(s.done || {}), [cityId]: 1 } })); setModal(null); setScreen('world'); }}>إلى خريطة المدن ←</button>
              <button className="mc-btn sm" onClick={() => setModal(null)}>البقاء في المدينة</button>
            </div>
          </div>
        </div></div>
      )}
      {teacher && <TeacherPanel state={state} setState={setState} cityId={cityId} onClose={() => setTeacher(false)} openGame={g => openGame(g)} />}
      {cele && <Celebrate {...cele} onClose={() => setCele(null)} />}
    </div>
    </Reward.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
