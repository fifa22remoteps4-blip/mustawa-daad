        <rect x="170" y="20" width="100" height="62" rx="8" fill={allDone ? '#ffd166' : '#f1e3c6'} />
        <path d="M170 26 V8 h16 v10 h14 V8 h16 v10 h14 V8 h16 v10 h14 V8 h6 v18" fill={allDone ? '#ffd166' : '#f1e3c6'} />
        <rect x="208" y="50" width="24" height="32" rx="12" fill="#a0623a" />
        <text x="220" y="104" fontSize="17" fontWeight="800" textAnchor="middle" fill="#3d2b1f" style={{ fontFamily: 'var(--ui)' }}>بوابة المدينة</text>

      {P && (() => { const x = 350, y = py, c = P.done ? '#57c271' : '#7c5cff'; return (
        <g onClick={() => P.onOpen()} style={{ cursor: 'pointer' }}>
          <path d={`M210 ${y + 22} L${x} ${y + 22}`} stroke="#f1dfb8" strokeWidth="12" strokeLinecap="round" />
          <g className={testFirst ? 'stn-now' : ''}>

            {P.done && <g><circle cx={x + 44} cy={y - 38} r="15" fill="#2f9e44" /><path d={`M${x + 37} ${y - 38} l5 6 l10 -12`} stroke="#fff" strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round" /></g>}

        </g>); })()}

        const fill = st === 'done' ? '#57c271' : st === 'now' ? '#ffb347' : locked ? '#d6d0c4' : '#8fb8de';

        const lw = Math.max(110, s.label.length * 11 + 24);

          <g className={st === 'now' ? 'stn-now' : ''}>

    else if (/لِلْيَمِينِ/.test(c)) { p.d = (p.d + 3) % 4; setMsg(''); beep('pop'); } else { p.d = (p.d + 1) % 4; setMsg(''); beep('pop'); }
    setPos(p); P.score('ok'); setCard(sample(F.cmds, 2));
    if (p.y * N + p.x === M.goal) beep('win');
  };
  useKeys({ num: run });
  const arrow = ['⬆', '⬅', '⬇', '➡'][pos.d];
  return (<div style={{ textAlign: 'center' }}>
    <PlayBar P={P} />
    <p className="lead">{F.title}: أوصِل البطل إلى النجمة. اقرأ البطاقة وقل رقمها {P.who && <b>— دور {P.who}</b>}</p>
    <div className="maze">{Array.from({ length: N * N }, (_, c) => { const x = c % N, y = Math.floor(c / N); return (
      <div key={c} className={'mz' + (M.walls.has(c) ? ' wall' : '')} style={M.walls.has(c) ? bg('bricks') : bg('grass')}>
        {c === M.goal && '⭐'}{pos.x === x && pos.y === y && <span className="mzh">{arrow}</span>}</div>); })}</div>
    {msg && <p className="lead">{msg}</p>}

  </div>);
}

/* جيش الحروف: ركضٌ بمنظور ثلاثي الأبعاد — البطل يتوقّف عند كلّ بوّابة، والجواب الصحيح يكبّر الجيش */
function RunnerGame({ groups }) {
  const P = usePlay();
  const BOSS = 9;
  const mk = () => shuffle(groups).slice(0, 6).map(g => { const opts = shuffle(g).slice(0, 3); return { opts, t: Math.floor(Math.random() * opts.length) }; });
  const [R, setR] = useState(mk), [i, setI] = useState(0), [army, setArmy] = useState(1), [ph, setPh] = useState('run'), [pick, setPick] = useState(null), [delta, setDelta] = useState(0);
  const r = R[i];
  useEffect(() => {
    if (ph === 'run') { const t = setTimeout(() => setPh(i < R.length ? 'choose' : 'fight'), 1300); return () => clearTimeout(t); }
    if (ph === 'fight') { const t = setTimeout(() => { setPh('end'); beep(army >= BOSS ? 'win' : 'bad'); }, 2400); return () => clearTimeout(t); }
  }, [ph, i]);
  const choose = k => {
    if (ph !== 'choose' || !r || !r.opts[k]) return;
    const ok = k === r.t, d = ok ? 3 : -2;
    P.score(ok ? 'ok' : 'no'); setPick(k); setDelta(d); setPh('pass');
    setTimeout(() => { setArmy(a => Math.max(1, a + d)); setPick(null); setI(i + 1); setPh('run'); }, 1400);
  };
  useKeys({ num: choose });
  const restart = () => { setR(mk()); setI(0); setArmy(1); setPh('run'); setPick(null); };
  const win = army >= BOSS, moving = ph === 'run' || ph === 'pass';
  const crowd = (n, cls) => <div className={'rn-crowd ' + cls}>{Array.from({ length: Math.min(n, 24) }, (_, k) => <img key={k} src={SVGX.hero()} alt="" />)}<b>{n}</b></div>;
  return (<div style={{ textAlign: 'center' }}>
    <PlayBar P={P} />
    <p className="lead">جيش الحروف: اسمع، ثم قل رقم البوّابة الصحيحة ليكبر جيشك {P.who && <b>— دور {P.who}</b>} <span className="count">{Math.min(i + 1, R.length)} / {R.length}</span></p>
    {ph === 'choose' && r && <TeacherSecret key={i} text={r.opts[r.t]} hint="انطق هذا فقط — البطل ينتظر، ولا وقت" />}
    <div className="rn-scene">
      <div className="rn-sky"><i className="rn-sun" /><i className="rn-cloud c1" /><i className="rn-cloud c2" /><i className="rn-cloud c3" /><i className="rn-hill h1" /><i className="rn-hill h2" />
        <svg className="rn-castle" viewBox="0 0 120 80"><path d="M10 80 V34 h10 v-10 h8 v10 h10 V14 h8 v-8 h8 v8 h12 v-8 h8 v8 h8 v20 h10 v-10 h8 v10 h10 V80 Z" fill="#7b5ea7" stroke="#2b1d2a" strokeWidth="3" strokeLinejoin="round" /><path d="M50 80 V56 a10 10 0 0 1 20 0 V80 Z" fill="#2b1d2a" /><path d="M60 6 V-8 l14 5 l-14 5" fill="#e03131" stroke="#2b1d2a" strokeWidth="2" /><rect x="26" y="44" width="8" height="10" rx="4" fill="#ffd43b" /><rect x="86" y="44" width="8" height="10" rx="4" fill="#ffd43b" /></svg>
        <span className="rn-boss-far">جيش الخصم: {BOSS}</span></div>
      <div className={'rn-road' + (moving ? ' move' : '')} />
      {r && ph !== 'fight' && ph !== 'end' && <div className={'rn-gates ' + ph} key={i}>
        {r.opts.map((o, k) => <button key={k} className={'rn-gate' + (pick === k ? (delta > 0 ? ' good' : ' bad') : '')} onClick={() => choose(k)}>
          <Num n={k} /><span className="rn-opt">{o}</span>{pick === k && <span className="rn-delta">{delta > 0 ? '+٣' : '−٢'}</span>}</button>)}
      </div>}
      {(ph === 'fight' || ph === 'end') && crowd(BOSS, 'enemy' + (ph === 'end' && win ? ' lost' : ''))}
      {crowd(army, 'mine' + (moving ? ' run' : '') + (ph === 'end' && !win ? ' lost' : ''))}
      {ph === 'fight' && <div className="rn-vs">{army} ضدّ {BOSS}</div>}
    </div>
    {ph === 'end' && (win ? <Done msg={'انتصر جيشك! ' + army + ' ضدّ ' + BOSS + ' 🎉'} again={restart} />
      : <div><div className="win-banner" style={{ background: '#ffe3e3' }}>جيشك {army} والخصم {BOSS} — نحتاج جيشًا أكبر. نحاول مرّة أخرى!</div><button className="mc-btn go" onClick={restart}>حاول مرّة أخرى</button></div>)}

  </div>);
}

function Dashboard({ db, setDb, onStartJourney, onPlacement, onLogout }) {
  const [edit, setEdit] = useState(null), [sel, setSel] = useState(null), [tab, setTab] = useState('students'), [sure, setSure] = useState(null), [msg, setMsg] = useState(''), [resetSure, setResetSure] = useState(null);
  /* البدء من جديد: يمحو الاختبار والتقدّم والتقرير، ويُبقي الاسم والبطل */
  const resetStudent = s => { if (resetSure !== s.id) { setResetSure(s.id); return; } upd(s.id, x => ({ ...x, state: { hero: x.hero, city: 'huruf' } })); setResetSure(null); };
  const fileRef = useRef(null);
  const upd = (id, fn) => setDb(d => ({ ...d, students: d.students.map(s => s.id === id ? fn(s) : s) }));
  const S = db.students.find(s => s.id === sel);
  const exportData = () => { const b = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mudun-daad-students.json'; a.click(); };
  const importData = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.students) throw 0; setDb(x => ({ ...x, students: d.students })); setMsg('استُورد ' + d.students.length + ' طالبًا.'); } catch (er) { setMsg('الملف غير صالح.'); } }; r.readAsText(f); e.target.value = ''; };
  return (<div className="screen soft-screen"><div className="dash">
    <div className="dash-top"><h2>مُدُنُ ضاد — طلابي</h2></div>
    <div className="phases">{[['students', 'الطلاب'], ['guide', 'دليل الألعاب'], ['data', 'البيانات']].map(([k, t]) => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{t}</button>)}</div>
    {tab === 'students' && <>
      <div className="center" style={{ marginTop: 0 }}><button className="mc-btn go" onClick={() => setEdit('new')}>+ طالب جديد</button></div>
      {!db.students.length && <p className="lead">أضف أوّل طالب، ثم ادخل به المدينة. أوّل محطة فيها اختبار تحديد المستوى.</p>}
      <div className="stu-list">{db.students.map(s => {
        const st = s.state || {}, pr = progressOf(st), pl = st.placement;
        return (<div key={s.id} className={'mc stu' + (sel === s.id ? ' on' : '')} onClick={() => setSel(sel === s.id ? null : s.id)}>
          <div className="stu-h">{heroImg(s.hero, 40)}<div><b>{s.name || 'طالب'}</b><span>{pl ? whereOf(st) : 'لم يُختبر بعد — الاختبار أوّل محطة في الخريطة'}</span></div></div>
          <div className="stu-stats">
            <div><small>الحروف المعروفة</small><b>{pl ? pl.known + ' / 28' : '—'}</b></div>
            <div><small>التقدّم</small><b>{pr.pct}٪</b><i className="pbar"><i style={{ width: pr.pct + '%' }} /></i></div>
          </div>
          <div className="center" style={{ marginTop: 6 }} onClick={e => e.stopPropagation()}>
            <button className="mc-btn go sm" onClick={() => onStartJourney(s.id)}>ادخل المدينة ←</button>
            <button className="mc-btn sm teal" onClick={() => onPlacement(s.id)}>{pl ? 'أعِد اختبار المستوى' : 'اختبار تحديد المستوى'}</button>
            <button className="mc-btn sm" onClick={() => setEdit(s.id)}>تعديل</button>
            <button className="mc-btn sm red" onClick={() => resetStudent(s)}>{resetSure === s.id ? 'سيُمحى تقدّمه كلّه — اضغط ثانية' : 'ابدأ من جديد ↺'}</button>
            <button className="mc-btn sm red" onClick={() => { if (sure !== s.id) { setSure(s.id); return; } setDb(d => ({ ...d, students: d.students.filter(x => x.id !== s.id) })); setSure(null); }}>{sure === s.id ? 'متأكد؟ اضغط ثانية' : 'حذف'}</button>
          </div>
          {sel === s.id && <div className="stu-more" onClick={e => e.stopPropagation()}>
            <ReportView state={st} />
            {pl && <OrderPicker state={st} setState={fn => upd(s.id, x => ({ ...x, state: typeof fn === 'function' ? fn(x.state || {}) : fn }))} />}
          </div>}
        </div>);
      })}</div>
    </>}
    {tab === 'guide' && <div className="guide-list">{GUIDE.map(g => <GuideCard key={g.id} g={g} />)}</div>}
    {tab === 'data' && <div className="mc login-box wide" style={{ margin: '0 auto' }}>
      <p className="lead">بيانات الطلاب محفوظة على هذا الجهاز فقط (لا خادم ولا استهلاك من Netlify). لنقلها إلى جهازٍ آخر صدّرها ثم استوردها هناك.</p>
      <div className="center"><button className="mc-btn go" onClick={exportData}>تصدير ملف الطلاب</button><button className="mc-btn teal" onClick={() => fileRef.current.click()}>استيراد ملف</button><input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={importData} /></div>
      {msg && <p className="lead" style={{ color: '#2b8a3e' }}>{msg}</p>}
    </div>}
    {edit && <StudentEditor init={edit === 'new' ? null : db.students.find(s => s.id === edit)} onCancel={() => setEdit(null)} onSave={(name, hero) => {
      if (edit === 'new') setDb(d => ({ ...d, students: [...d.students, { id: uid(), name, hero, created: Date.now(), state: { hero, city: 'huruf' } }] }));
      else upd(edit, s => ({ ...s, name, hero, state: { ...(s.state || {}), hero } }));
      setEdit(null);
    }} />}
  </div></div>);
}

/* =========================================================
   التطبيق
   ========================================================= */
function App() {
  /* لا رمز للمعلّم: تفتح الصفحة على قائمة الطلاب، ولكلّ طالبٍ تقدّمه المحفوظ على هذا الجهاز */
  const [db, setDb] = useState(loadDB);
  const role = 'teacher';
  const resume = (() => { try { return JSON.parse(sessionStorage.getItem('mudun_resume')) || {}; } catch (e) { return {}; } })();
  const [sid, setSid] = useState(resume.sid || null);
  const [screen, setScreen] = useState(resume.screen === 'city' && db.students.some(s => s.id === resume.sid) ? 'city' : 'dash');
  const [testFrom, setTestFrom] = useState('dash');
  useEffect(() => { try { sessionStorage.setItem('mudun_resume', JSON.stringify({ sid, screen })); } catch (e) {} }, [sid, screen]);
  const startTest = (id, from) => { setSid(id); setTestFrom(from); setModal(null); setTeacher(false); setScreen('placement'); };
  const [modal, setModal] = useState(null), [teacher, setTeacher] = useState(false), [toastMsg, setToast] = useState(null), [cele, setCele] = useState(null);
  useEffect(() => { saveDB(db); }, [db]);
  window.__ROLE = role || 'student';
  const stu = db.students.find(s => s.id === sid);
  const state = (stu && stu.state) || { hero: 'boy', city: 'huruf' };
  const setState = fn => setDb(d => ({ ...d, students: d.students.map(s => s.id === sid ? { ...s, state: typeof fn === 'function' ? fn(s.state || {}) : fn, last: Date.now() } : s) }));
  useEffect(() => { Snd.on = !state.mute; window.__DAAD_GIRL__ = (stu && stu.hero) === 'girl'; }, [state.mute, stu && stu.hero]);
  const toast = useCallback(m => { setToast(m); clearTimeout(toast.t); toast.t = setTimeout(() => setToast(null), 2200); }, []);

  const applyPlacement = (id, r) => {
    setDb(d => ({ ...d, students: d.students.map(s => {
      if (s.id !== id) return s;
      const st = { ...(s.state || {}) }, p = r.plan;
      st.report = { ...r.rep }; st.order = p.order; st.city = p.city; st.placement = r.summary;
      if (p.order === 'custom') applyCustom(st.report);
      const prog = {};
      if (p.city === 'huruf') { prog.huruf = {}; p.doneIds.forEach(x => { prog.huruf[x] = 1; }); }
      else { prog.huruf = Object.fromEntries(D.hurufStations('shape').map(x => [x.id, 1])); prog.fatha = {}; p.doneIds.forEach(x => { prog.fatha[x] = 1; }); st.done = { huruf: 1 }; }
      st.prog = prog;
      return { ...s, state: st };
    }) }));
    setScreen('city'); beep('ok');
  };

  if (screen === 'dash' || !stu) return <Dashboard db={db} setDb={setDb}
    onStartJourney={id => { setSid(id); setModal(null); setScreen('city'); }} onPlacement={id => startTest(id, 'dash')} />;
  if (screen === 'placement') return <PlacementTest student={stu} onCancel={() => setScreen(testFrom)} onApply={r => applyPlacement(stu.id, r)} />;

  /* ---------- المدينة ---------- */
  const cityId = CITY[state.city] ? state.city : 'huruf';
  const cfgG = CITY[cityId], C2 = CD.cities.find(c => c.id === cityId);
  const award = n => setState(s => ({ ...s, stars: (s.stars || 0) + n }));
  const RV = { award, players: state.players || { mode: 'one' } };
  const stars = state.stars || 0;
  const order = ordOf(state);
  const STN = stationsOf(cityId, state);
  const cfg = CITY[cityId];
  const prog = (state.prog && state.prog[cityId]) || {};
  const idx = STN.findIndex(s => !prog[s.id]);
  const status = {}; STN.forEach((s, i) => { status[s.id] = prog[s.id] ? 'done' : (i === idx ? 'now' : 'open'); });
  const markDone = (id, keepOpen) => {
    setState(s => ({ ...s, prog: { ...(s.prog || {}), [cityId]: { ...((s.prog || {})[cityId] || {}), [id]: 1 } } }));
    const nx = STN.find((x, i) => i > STN.findIndex(y => y.id === id) && !prog[x.id]);
    setCele({ title: 'أَحْسَنْتَ!', sub: nx ? 'المحطة التالية: ' + nx.label : 'اذهب إلى بوابة المدينة' });
    if (!keepOpen) setModal(null);
  };
  const openGame = g => { setTeacher(false); setModal({ id: 'game', game: g }); };
  const M = modal && STN.find(s => s.id === modal.id);
  const isHouse = cityId === 'huruf' && /^[gac]\d/.test(M ? M.id : '');
  const C = D.CONTENT.fatha;
  const cityName = CITY_NAMES[cityId];
  const nextCity = ALLC[ALLC.indexOf(cityId) + 1] || null;
  const sIdx = id => STN.findIndex(s => s.id === id);
  return (
    <Reward.Provider value={RV}>
    <div className="city-view">
      <div className="hud">
        <button className="mc-btn sm" onClick={() => { setModal(null); setScreen('dash'); }}>→ الطلاب</button>
        <button className="mc-btn sm go" onClick={() => setModal({ id: 'cities' })}>🗺️ كلّ المدن ({ALLC.indexOf(cityId) + 1}/{ALLC.length})</button>
        <div className="cname">{cityName}<span className="who">{heroImg(stu.hero, 22)} {stu.name || 'طالب'}</span></div>
        <div className="hud-prog"><i style={{ width: Math.round(STN.filter(s => prog[s.id]).length / STN.length * 100) + '%' }} /></div>
        <span className="stars-hud">⭐ {stars}</span>
        <button className="mc-btn sm" onClick={() => setState(s => ({ ...s, mute: !s.mute }))} aria-label="الصوت">{state.mute ? '🔇' : '🔊'}</button>
        <button className="mc-btn sm teal" onClick={() => setTeacher(true)}>المعلّم</button>
      </div>
      <div className="stage">
        <CityMap key={cityId + order + sid} stations={STN} status={status} heroGirl={stu.hero === 'girl'} role={role} cityColor={CCOLOR[cityId]}
          placement={cityId === 'huruf' ? { done: !!state.placement, onOpen: () => { beep('pop'); startTest(stu.id, 'city'); } } : null}
          onOpen={id => { beep('pop'); setModal({ id }); }} />
        {toastMsg && <div className="toast">{toastMsg}</div>}
      </div>
      {M && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>{M.label}{isHouse ? ': ' + M.pip : <span style={{ fontSize: 15, opacity: .8 }}> — {M.step}</span>}</h3><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b">
            {cityId === 'huruf' && M.id === 'train' && <><GuideBtn id="train" /><TrainStation onDone={() => markDone('train')} /></>}
            {isHouse && <LetterGroupStation key={M.id} gi={+M.id.slice(1) - 1} groups={D.hurufGroups(order)} onDone={() => markDone(M.id)} openXO={pool => setModal({ id: 'game', game: 'xoL', pool })} onResult={(l, v) => setState(s => ({ ...s, report: { ...(s.report || {}), [l]: v } }))} hero={state.hero} />}
            {cityId === 'fatha' && M.id === 'letters' && <LettersStation C={C} onDone={() => markDone('letters')} />}
            {cityId === 'fatha' && M.id === 'syllables' && <SyllablesStation C={C} onDone={() => markDone('syllables')} />}
            {cityId === 'fatha' && M.id === 'games' && <GamesStation done={!!prog.games} onDone={() => markDone('games', true)} />}
            {cityId === 'fatha' && M.id === 'words' && <WordsStation C={C} hero={state.hero} onDone={() => markDone('words')} />}
            {cityId === 'fatha' && M.id === 'story' && <StoryStation C={C} hero={state.hero} onDone={() => markDone('story')} />}
            {cfgG.generic && M.id === 'talk' && <GenStation C={C2} id="talk" hero={state.hero} />}
            {cfgG.generic && M.id !== 'talk' && <HalfTabs key={M.id} units={C2.talk} index={sIdx(M.id)} hero={state.hero}><GenStation C={C2} id={M.id} hero={state.hero} /></HalfTabs>}
            {cfgG.library && <Library hero={state.hero} />}
            {(cfgG.generic || cfgG.library) && <div className="center" style={{ marginTop: 16 }}><button className="mc-btn sm" onClick={() => markDone(M.id)}>✓ للمعلّم: أنهِ المحطة</button></div>}
          </div>
        </div></div>
      )}
      {modal && modal.id === 'game' && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>{modal.game === 'xoL' ? 'إكس-أو الحروف' : (GAMES.find(g => g.id === modal.game) || {}).name}</h3><GuideBtn id={modal.game === 'mem' ? 'memF' : modal.game} /><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b">
            {modal.game === 'xoL' ? <XOGame mode="letter" pool={modal.pool} /> : <GamesStation done startGame={modal.game} onDone={() => {}} />}
          </div>
        </div></div>
      )}
      {modal && modal.id === 'cities' && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>خريطة مدن ضاد</h3><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b"><CitiesBoard state={state} cur={cityId} setState={setState} onPick={id => { setState(s => ({ ...s, city: id })); setModal(null); beep('ok'); }} onTalk={() => setModal({ id: 'talkall' })} /></div>
        </div></div>
      )}
      {modal && modal.id === 'talkall' && (
        <div className="overlay"><div className="mc panel">
          <div className="panel-h"><h3>ساحة الكلام</h3><button className="mc-btn sm" onClick={() => setModal(null)}>رجوع إلى المدينة</button></div>
          <div className="panel-b"><TalkStation units={CD.talkOrder} hero={state.hero} /></div>
        </div></div>
      )}
      {modal && modal.id === 'finish' && (
        <div className="overlay"><div className="mc panel" style={{ width: 'min(560px,100%)' }}>
          <div className="panel-h"><h3>بوابة المدينة</h3></div>
          <div className="panel-b" style={{ textAlign: 'center' }}>
            {cfgG.generic && <CityTest C={C2} onDone={r => setState(s => ({ ...s, cityTest: { ...(s.cityTest || {}), [cityId]: { ok: r.filter(x => x[1] === 'ok').length, help: r.filter(x => x[1] === 'help').length, no: r.filter(x => x[1] === 'no').map(x => x[0]) } } }))} />}
            {idx === -1 ? (<>
              <div className="stars" style={{ marginBottom: 10 }}><i /><i /><i /></div>
              <h2 style={{ margin: '0 0 6px', fontSize: 30 }}>{cfg.finishTitle}</h2>
              <p className="lead">{cfg.finishSub}</p>
              <div className="big-word" style={{ fontSize: 64 }}>{cfg.finishWord}</div>
            </>) : (<>
              <h2 style={{ margin: '0 0 6px', fontSize: 26 }}>بقيت محطات في هذه المدينة</h2>
              <p className="lead">{STN.filter(s => !prog[s.id]).map(s => s.label + (s.pip && s.pip !== s.label ? ' (' + s.pip + ')' : '')).join('، ')}</p>
            </>)}
            <div className="center">
              {idx === -1 && nextCity && <button className="mc-btn go" onClick={() => { setState(s => ({ ...s, done: { ...(s.done || {}), [cityId]: 1 }, city: nextCity })); setModal(null); }}>إلى {CITY_NAMES[nextCity]} ←</button>}
              <button className="mc-btn sm" onClick={() => setModal(null)}>البقاء في المدينة</button>
            </div>
          </div>
        </div></div>
      )}
      {teacher && <TeacherPanel state={state} setState={setState} onClose={() => setTeacher(false)} openGame={openGame} onPlacement={() => startTest(stu.id, 'city')} />}
      {cele && <Celebrate {...cele} onClose={() => setCele(null)} />}
    </div>
    </Reward.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
