<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مُدُن ضاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="mudun_px.js"></script>
<script src="mudun_art.js"></script>
<script src="mudun_art_pics.js"></script>
<script src="mudun_clues.js"></script>
<script src="mudun_clues_scenes.js"></script>
<script>window.__SVGX_LIVE = window.SVGX;</script>
<script src="mudun_svg.js"></script>
<script>window.SVGX2 = window.SVGX; window.SVGX = window.__SVGX_LIVE;</script>
<script src="mudun_data.js"></script>
<script src="mudun_cities.js"></script>
<style>
:root{
  --ink:#2a1d24; --gui:#c6c6c6; --gui-d:#555; --gui-l:#fff; --btn:#8b8b8b;
  --green:#3c8527; --green-l:#5aa83c; --teal:#16a3b6; --coral:#e8505b; --gold:#f6c945;
  --naskh:'Scheherazade New','Noto Naskh Arabic',serif;
  --nasakh:'Noto Naskh Arabic','Scheherazade New',serif;
  --ui:'Baloo Bhaijaan 2',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:#1d2a1b;overflow:hidden;-webkit-tap-highlight-color:transparent}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- واجهة على طراز ماينكرافت ---------- */
.mc{background:var(--gui);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--gui-l),inset -3px -3px 0 var(--gui-d)}
.mc-btn{background:var(--btn);color:#fff;font-weight:800;font-size:17px;text-shadow:2px 2px 0 #3f3f3f;border:3px solid #000;
  box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -3px 0 #555;padding:8px 18px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mc-btn:hover{background:#7d8cc4}
.mc-btn:active{box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 #c6c6c6}
.mc-btn.go{background:var(--green)}.mc-btn.go:hover{background:var(--green-l)}
.mc-btn.red{background:#b3343c}.mc-btn.red:hover{background:#cf454e}
.mc-btn.teal{background:#118a9a}.mc-btn.teal:hover{background:#19a9bb}
.mc-btn.sm{font-size:14px;min-height:38px;padding:4px 12px}
.mc-btn[disabled]{background:#6b6b6b;color:#b9b9b9;cursor:default}

/* ---------- الشاشة الأولى والخريطة ---------- */
.screen{position:fixed;inset:0;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px;background-size:64px 64px;image-rendering:pixelated}
.title-wrap{max-width:860px;margin:4vh auto 0;text-align:center;color:#fff}
.title-wrap h1{font-size:clamp(44px,9vw,86px);margin:0;line-height:1.05;text-shadow:5px 5px 0 #000,-2px -2px 0 #2f6b22}
.title-wrap .tag{font-size:clamp(17px,2.6vw,22px);font-weight:700;text-shadow:2px 2px 0 #000;margin-top:10px}
.heroes{display:flex;gap:18px;justify-content:center;margin:28px 0 22px;flex-wrap:wrap}
.hero{padding:14px 22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:18px}
.hero.on{outline:5px solid var(--gold);outline-offset:-2px}
.world{max-width:1100px;margin:0 auto}
.world h2{color:#fff;text-shadow:3px 3px 0 #000;font-size:30px;margin:6px 0 4px;text-align:center}
.world .sub{color:#e9f7d9;text-align:center;font-weight:700;text-shadow:2px 2px 0 #000;margin-bottom:18px}
.trail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.city{position:relative;padding:14px 12px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid #000}
.city .mark{position:absolute;top:10px;right:12px;font-family:var(--naskh);font-size:40px;line-height:1;text-shadow:2px 2px 0 #000}
.city .name{font-family:var(--naskh);font-size:25px;font-weight:700}
.city .st{font-size:14px;font-weight:800;padding:2px 10px;border:2px solid #000;background:#fff}
.city .note{font-size:13px;font-weight:700;color:#7c2d12}
.city.locked{filter:saturate(.25) brightness(.85)}
.top-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* ---------- المدينة ---------- */
.city-view{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#3b2a1a;border-bottom:4px solid #000;box-shadow:inset 0 -3px 0 #5d3d20;flex-wrap:wrap;z-index:2}
.hud .cname{color:#fff;font-family:var(--naskh);font-size:24px;font-weight:700;text-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pip{display:flex;align-items:center;gap:6px;background:#6b6b6b;color:#fff;border:2px solid #000;padding:2px 10px 2px 8px;font-size:13px;font-weight:800;cursor:pointer}
.pip b{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:#3f3f3f;color:#fff;border:2px solid #000;font-size:13px}
.pip.done{background:#3c8527}.pip.done b{background:#245a14}
.pip.now{background:var(--gold);color:#2a1d24;animation:pulse 1.2s infinite}.pip.now b{background:#b8860b}
@keyframes pulse{50%{transform:translateY(-2px)}}
.stage{position:relative;flex:1;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
.hint{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border:2px solid #000;white-space:nowrap;pointer-events:none}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 18px;font-weight:800;font-size:17px;z-index:3;animation:pop .25s;max-width:92vw;text-align:center}
@keyframes pop{from{transform:translate(-50%,-10px) scale(.9);opacity:0}}
.dpad{position:absolute;left:14px;bottom:56px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;z-index:2}
.dpad button{background:rgba(139,139,139,.85);border:3px solid #000;color:#fff;font-size:20px;box-shadow:inset 2px 2px 0 #c6c6c6,inset -2px -2px 0 #555}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}

/* ---------- النوافذ ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.panel{width:min(1000px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#5d3d20;border-bottom:3px solid #000;color:#fff;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:22px;text-shadow:2px 2px 0 #000;flex:1}
.panel-b{padding:18px;overflow:auto}
.lead{font-size:17px;font-weight:700;margin:0 0 12px;line-height:1.7;text-align:center}
.teacher-note{background:#fff7d6;border:2px dashed #b8860b;padding:8px 12px;font-size:15px;font-weight:700;margin:0 auto 14px;max-width:720px;text-align:center}
.center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.count{display:inline-block;background:#fff;border:2px solid #000;padding:2px 12px;font-weight:800}
.bar{height:14px;background:#3f3f3f;border:2px solid #000;margin:6px auto 14px;max-width:520px}
.bar i{display:block;height:100%;background:var(--green-l);transition:width .3s}
.phases{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-4px 0 14px}
.phases button{background:#e2e2e2;border:2px solid #000;font-weight:800;font-size:13px;padding:3px 10px}
.phases button.on{background:var(--gold)}
.phases button.ok{background:#bfe6a8}

/* كتل الحروف */
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;max-width:880px;margin:0 auto}
.blk{position:relative;aspect-ratio:1;border:3px solid #000;background-size:100% 100%;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;
  font-family:var(--naskh);font-size:44px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #222,-1px -1px 0 #000;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);padding:0}
.blk:hover{filter:brightness(1.12)}
.blk.on{outline:4px solid var(--gold);outline-offset:-4px}
.blk .fd{position:absolute;top:8%;left:50%;width:30%;height:8%;background:var(--gold);border:2px solid #000;transform:translateX(-50%) rotate(-28deg);animation:drop .45s ease-in forwards}
@keyframes drop{from{top:-40%;opacity:0}to{top:14%;opacity:1}}
.blk.big{font-size:60px}

.idea{display:grid;grid-template-columns:minmax(220px,1fr) 1.3fr;gap:18px;align-items:center;max-width:900px;margin:0 auto}
@media (max-width:720px){.idea{grid-template-columns:1fr}}
.stagebox{background:#2b2b33;border:3px solid #000;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stagebox .L{font-family:var(--naskh);font-size:clamp(120px,22vw,190px);color:#fff;line-height:1;text-shadow:5px 5px 0 #000}
.stagebox .hat{position:absolute;top:18%;left:50%;width:22%;height:6%;background:var(--gold);border:3px solid #000;transform:translateX(-50%) rotate(-25deg);animation:hat 1.6s ease-in-out infinite alternate}
@keyframes hat{from{top:4%}to{top:20%}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.step{padding:10px 6px;text-align:center}
.step .n{display:inline-block;width:26px;height:26px;background:var(--ink);color:#fff;font-weight:800;line-height:26px}
.step .d{font-family:var(--naskh);font-size:42px;line-height:1.3}
.step .t{font-weight:800;font-size:14px}

/* قرائن الحروف */
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto 14px}
@media (max-width:620px){.lcards{grid-template-columns:repeat(2,1fr)}}
.lcard{padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #000}
.lcard .L{font-family:var(--nasakh);font-size:66px;font-weight:700;line-height:1.35}
.lcard .k{font-family:var(--naskh);font-size:24px;font-weight:700}
.lcard.on{outline:5px solid var(--gold);outline-offset:-3px}
.lcard.seen::after{content:'✓';position:absolute}
.mnwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:860px;margin:0 auto}
@media (max-width:720px){.mnwrap{grid-template-columns:1fr}}
.mn{position:relative;height:280px;background:linear-gradient(#8fd3ff,#cbeeff 70%,#6aa84f 70%,#6aa84f 73%,#8a6240 73%);border:3px solid #000;overflow:hidden}
.mn .sk,.mn .real{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--nasakh);font-size:140px;font-weight:700;line-height:1.7;transition:opacity .6s;padding-bottom:34px}
.mn .sk{color:#2a1d24}
.mn .real{opacity:0}
.mn.done .sk{opacity:0}.mn.done .real{opacity:1}
.mn .ob{position:absolute;width:44px;height:44px;animation:fall .75s cubic-bezier(.3,1.5,.6,1) both;transition:opacity .6s}
.mn.done .ob{opacity:0}
@keyframes fall{from{transform:translateY(-300px)}}
.naskh-box{background:#fffdf5;border:3px solid #000;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:280px}
.naskh-box .cap{font-weight:800;font-size:14px;background:#2a1d24;color:#fff;padding:2px 10px}
.naskh-box .big{font-family:var(--nasakh);font-size:120px;font-weight:700;line-height:1.6}
@media (max-width:600px){.panel-h h3{font-size:17px}.panel-h h3 span{display:none}.mn{height:240px}.mn .sk,.mn .real{font-size:120px}}
.naskh-box .fs{display:flex;gap:14px;font-family:var(--nasakh);font-size:40px;font-weight:700;direction:rtl}
.story-line{font-size:18px;font-weight:700;text-align:center;margin:10px auto 0;max-width:720px;line-height:1.7}
.keyword{font-family:var(--naskh);font-size:46px;font-weight:700}
.forms-t{border-collapse:separate;border-spacing:6px;margin:0 auto}
.forms-t th{font-size:14px;font-weight:800;background:#2a1d24;color:#fff;padding:4px 10px}
.forms-t td{background:#fff;border:3px solid #000;text-align:center;padding:2px 10px;min-width:96px}
.forms-t td .f{font-family:var(--nasakh);font-size:48px;font-weight:700;line-height:1.5;display:block}
.forms-t td .ex{font-family:var(--naskh);font-size:22px;font-weight:700;display:block;cursor:pointer}
.forms-t td.L{font-family:var(--nasakh);font-size:56px;font-weight:700}
.forms-t td.nj{font-size:12px;font-weight:800;color:#7c2d12}
.wchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:860px;margin:0 auto}
.wchip{background:#fff;border:3px solid #000;padding:0 16px;font-family:var(--naskh);font-size:40px;font-weight:700;line-height:1.6;box-shadow:inset 0 -4px 0 #ddd}
.wchip:hover{background:#fff7d6}
.qword{font-family:var(--naskh);font-size:clamp(60px,10vw,92px);font-weight:700;text-align:center;line-height:1.5}
.lopt{min-width:96px;height:96px;font-family:var(--nasakh);font-size:56px}
.popt{min-width:120px;font-size:22px}

.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:860px;margin:0 auto}
.wpic{padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wpic.ok{outline:6px solid var(--green-l);outline-offset:-3px}.wpic.no{outline:6px solid var(--coral);outline-offset:-3px;animation:shake .35s}
.wtxt{font-family:var(--naskh);font-size:40px;font-weight:700;line-height:1.5}
.wpos{font-size:13px;font-weight:800;background:#2a1d24;color:#fff;padding:1px 10px}
.soundblk{width:min(220px,60vw);height:min(220px,60vw);font-family:var(--nasakh);font-size:min(130px,34vw);margin:0 auto}
.hands{max-width:860px;margin:14px auto 0;background:#fffdf5;border:3px solid #000;padding:10px}
.hands-t{font-weight:800;text-align:center;margin-bottom:8px}
.hands-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:620px){.hands-row{grid-template-columns:repeat(2,1fr)}}
.hand-card{background:#fff;border:2px solid #000;padding:6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.hf{font-family:var(--nasakh);font-size:52px;font-weight:700;line-height:1.5}
.ht{font-size:13px;font-weight:700;line-height:1.5}
.hands-note{text-align:center;font-weight:800;color:#7c2d12;margin-top:8px}
.lego-intro{padding:14px 18px;text-align:center;font-size:19px;font-weight:700;max-width:720px;margin:0 auto;line-height:1.9}
.lego-row{display:flex;justify-content:center;align-items:center;gap:22px;margin:40px 0 12px;transition:gap .7s ease}
.lego-row.snap{gap:0}.lego-row.snap .plus{display:none}
.plus{font-size:44px;font-weight:800}
.brick{position:relative;display:inline-flex;width:96px;height:84px;align-items:center;justify-content:center;font-family:var(--nasakh);font-size:58px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;border:3px solid #000;border-radius:4px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.3)}
.brick::before,.brick::after{content:'';position:absolute;top:-14px;width:24px;height:12px;background:inherit;border:3px solid #000;border-bottom:0;border-radius:5px 5px 0 0}
.brick::before{left:14px}.brick::after{right:14px}
.lego-result{display:flex;flex-direction:column;align-items:center;gap:4px}
.arcade{width:100%;height:min(700px,74vh);border:3px solid #000;background:#fff;display:block}
.sort-items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:90px;margin-bottom:14px}
.sort-card{padding:6px 10px;display:flex;align-items:center;gap:8px}
.sort-card.sel{outline:5px solid var(--gold);outline-offset:-2px}
.sort-word{display:flex;align-items:center;gap:8px;font-family:var(--naskh);font-size:34px;font-weight:700}
.mini-pic{width:84px;height:54px;border:2px solid #000}
.pic-card img{width:150px;height:96px;border:2px solid #000;display:block}
.sort-letter{font-family:var(--nasakh);font-size:54px;font-weight:700;min-width:60px;display:inline-block;line-height:1.4}
.sort-bins{display:grid;gap:10px;max-width:900px;margin:0 auto}
.sort-bin{background:#8b5a2b;border:3px solid #000;padding:6px;min-height:150px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 3px #a87b46;font-family:var(--ui)}
.sort-bin.ready{box-shadow:inset 0 0 0 4px var(--gold)}
.bin-h{font-weight:800;font-size:17px;background:#3a2a1c;padding:4px}
.bin-in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin-chip{background:#fff;color:#2a1d24;border:2px solid #000;padding:0 6px;font-family:var(--naskh);font-size:24px;font-weight:700}
.bin-chip img{width:60px;height:39px;display:block;image-rendering:pixelated}
.blk.good{outline:5px solid var(--green-l);outline-offset:-4px}.blk.wrong{outline:5px solid var(--coral);outline-offset:-4px}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:860px;margin:0 auto 12px}
.tile{aspect-ratio:1.3;border:3px solid #000;background:#d8d8d8;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.tile.ladder{background:#bfe6a8}.tile.hole{background:#f5c2c2}.tile.goal{background:var(--gold)}
.tok{position:absolute;font-size:22px;font-weight:800;line-height:1}.tok.x{color:var(--coral);top:2px;right:4px}.tok.o{color:var(--teal);bottom:2px;left:4px}
.race-card{text-align:center;padding:10px}
.house-note{text-align:center;font-weight:800;color:#7c2d12;margin:-6px 0 10px}
.clue{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;max-width:820px;margin:8px auto 0;align-items:stretch}
.clue.small{max-width:460px;grid-template-columns:1.2fr .8fr}
.clue-pic{position:relative;transition:opacity .5s}
.clue-pic .scene{height:100%;object-fit:cover}
.clue-pic .scene.portrait{object-fit:contain;background:radial-gradient(#fff7e6,#f0dcb4);padding:10px;aspect-ratio:auto;height:100%;max-height:300px;min-height:220px}
.clue-pic.soft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fffdf5;border:3px solid #000;border-radius:22px;padding:10px}
.soft-pic{width:100%;max-width:420px;aspect-ratio:200/140;display:block;border-radius:16px}
.clue-pic.soft .bubble{position:static;max-width:none;border-radius:999px;padding:0 22px;line-height:1.6}
.bubble{position:absolute;top:8%;left:6%;background:#fff;border:3px solid #000;border-radius:18px;padding:2px 14px;font-family:var(--naskh);font-size:clamp(26px,4vw,40px);font-weight:700;box-shadow:3px 3px 0 #000;max-width:60%}
.clue.small .bubble{font-size:22px}
.clue-glyph{display:flex;align-items:center;justify-content:center;background:#fffdf5;border:3px solid #000;font-family:var(--nasakh);font-size:clamp(110px,16vw,170px);font-weight:700;line-height:1.5;transition:color .5s;min-height:200px}
.clue.small .clue-glyph{font-size:84px;min-height:120px}
.clue-kind{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:16px;text-align:center;max-width:820px;margin:0 auto}
.fade-steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fade-steps span{font-size:12px;font-weight:800;padding:2px 8px;border:2px solid #000;background:#e2e2e2}
.fade-steps span.on{background:var(--gold)}.fade-steps span.ok{background:#bfe6a8}
.forms-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start;max-width:980px;margin:0 auto}
@media (max-width:760px){.forms-wrap,.clue{grid-template-columns:1fr}}
.trace{background:#fffdf5;border:3px solid #000;padding:8px;text-align:center}
.trace-h{font-weight:800;margin-bottom:6px}
.trace canvas{width:100%;max-width:300px;aspect-ratio:1;background:#fff;border:2px dashed #b8860b;touch-action:none;cursor:crosshair}
.picbtn{display:flex;flex-direction:column;gap:6px}
.train{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:900px;margin:0 auto 12px;direction:rtl}
.car{width:46px;height:42px;border:3px solid #000;background:#8b8b8b;display:flex;align-items:center;justify-content:center;font-family:var(--nasakh);font-size:26px;font-weight:700;color:#fff;border-radius:4px 4px 10px 10px}
.car.lit{background:#3c8527}.car.next{background:var(--gold);animation:pulse 1s infinite}
.dots-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin:0 auto 12px;align-items:center}
.dots-wrap .clue{grid-template-columns:1fr;margin:0}
.dots-wrap .clue .clue-glyph{display:none}
.skel{font-family:var(--nasakh);font-size:150px;font-weight:700;text-align:center;background:#fffdf5;border:3px solid #000;line-height:1.5}
.race-card.gold{box-shadow:inset 0 0 0 5px var(--gold)}
/* الكلمات */
.word-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center;max-width:920px;margin:0 auto}
@media (max-width:760px){.word-wrap{grid-template-columns:1fr}}
.scene{width:100%;aspect-ratio:56/36;border:3px solid #000;image-rendering:pixelated;background:#222;display:block}
.wordline{display:flex;justify-content:center;align-items:center;font-family:var(--naskh);font-size:clamp(56px,9vw,84px);font-weight:700;line-height:1.5;direction:rtl;min-height:130px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:96px;border:3px dashed #000;background:#fff7d6;font-family:var(--ui);font-size:44px;margin:0 2px}
.slot.ok{border-style:solid;background:#d9f7c8;font-family:var(--naskh);font-size:clamp(56px,9vw,84px)}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{min-width:96px;height:96px;font-size:54px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.merge{display:flex;justify-content:center;transition:gap .7s ease;font-family:var(--naskh);font-size:clamp(56px,9vw,84px);font-weight:700;line-height:1.5}
.merge span{background:#fff;border:3px solid #000;padding:0 12px;transition:all .7s}
.merge.close span{border-color:transparent;background:transparent;padding:0}
.big-word{font-family:var(--naskh);font-size:clamp(70px,12vw,110px);font-weight:700;text-align:center;line-height:1.5;animation:pop2 .4s}
@keyframes pop2{from{transform:scale(.6);opacity:0}}

/* القصة */
.story-text{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--naskh);font-size:clamp(48px,8vw,74px);font-weight:700;line-height:1.6;margin-top:12px}
.story-text span{transition:filter .35s,opacity .35s;cursor:pointer}
.story-text span.hid{filter:blur(9px);opacity:.25}
.pics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:720px;margin:12px auto 0}
.pics button{padding:0;border:4px solid #000;background:none}
.pics button.ok{outline:5px solid var(--green-l)}
.pics button.no{outline:5px solid var(--coral)}

/* الألعاب */
.games-hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:900px;margin:0 auto}
.gcard{padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.gcard h4{margin:0;font-size:21px}
.gcard p{margin:0;font-size:14px;font-weight:600;line-height:1.6}
.teams{display:flex;justify-content:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:10px;padding:6px 16px;border:3px solid #000;background:#fff;font-weight:800;font-size:19px}
.team.turn{outline:5px solid var(--gold)}
.team i{font-style:normal;font-size:28px;line-height:1}
.team.x i{color:var(--coral)}.team.o i{color:var(--teal)}
.team .sc{background:var(--ink);color:#fff;min-width:34px;text-align:center;padding:0 6px}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:min(470px,100%);margin:0 auto;background:#3f3f3f;padding:8px;border:3px solid #000}
.cell{position:relative;aspect-ratio:1;border:3px solid #000;background:#d8d8d8;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #8b8b8b;display:flex;align-items:center;justify-content:center;gap:10%;font-family:var(--naskh);font-weight:700;padding:0}
.cell .hk{font-size:clamp(40px,8vw,64px);color:#a14d00}
.cell .lt{font-size:clamp(42px,8vw,64px);color:var(--ink)}
.cell .lt.solo{font-family:var(--nasakh);font-size:clamp(52px,10vw,80px)}
.cell .sep{width:3px;height:55%;background:#9a9a9a}
.cell.own{background:#fff}
.cell .syl{font-size:clamp(44px,8vw,66px)}
.cell .ow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-size:clamp(70px,14vw,120px);opacity:.28;pointer-events:none}
.cell.x .ow{color:var(--coral)}.cell.o .ow{color:var(--teal)}
.cell.win{background:#fff4b8}
.judge{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.judge .box{padding:18px;text-align:center;width:min(520px,100%)}
.judge .pair{display:flex;justify-content:center;align-items:center;gap:26px;font-family:var(--naskh);font-weight:700;margin:6px 0}
.judge .pair .hk{font-size:96px;color:#b8860b}
.judge .pair .lt{font-size:110px}
.judge .ans{font-family:var(--naskh);font-size:80px;font-weight:700;line-height:1.3}
.race{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
@media (max-width:760px){.race{grid-template-columns:1fr 1fr}.race .mid{grid-column:1/-1;order:-1}}
.half{border:3px solid #000;padding:10px;background:#efefef}
.half.x{box-shadow:inset 0 6px 0 var(--coral)}.half.o{box-shadow:inset 0 6px 0 var(--teal)}
.half.lock{opacity:.45}
.half .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.half .grid .blk{font-size:40px}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:170px}
.secret{font-family:var(--naskh);font-size:56px;font-weight:700;background:#fff;border:3px solid #000;min-width:110px;text-align:center;line-height:1.3}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
.card{aspect-ratio:3/4;border:3px solid #000;background-size:100% 100%;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--naskh);font-weight:700;padding:0;transition:transform .2s}
.card.up{background:#fff!important}
.card .hk{font-size:40px;color:#b8860b}.card .lt,.card .syl{font-size:52px}
.card.x{background:#ffe1e3!important}.card.o{background:#d6f4f8!important}
.win-banner{text-align:center;font-size:30px;font-weight:800;margin:14px 0 4px}

.celebrate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.celebrate .mc{padding:26px 34px;text-align:center}
.celebrate h2{margin:0 0 6px;font-size:40px}
.stars{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.stars i{width:30px;height:30px;background:var(--gold);border:3px solid #000;transform:rotate(45deg);animation:star .6s ease-out both}
.stars i:nth-child(2){animation-delay:.1s}.stars i:nth-child(3){animation-delay:.2s}
@keyframes star{from{transform:rotate(45deg) scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* سرّ المعلّم */
.tsecret{max-width:720px;margin:0 auto 14px;background:#fff7d6;border:2px dashed #b8860b;padding:8px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.tsecret-steps{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:14px;font-weight:700;text-align:center}
.tsecret-cover{position:fixed;inset:0;z-index:9999;background:#1d1420;display:flex;align-items:center;justify-content:center;padding:16px}
.tsecret-card{background:#fffdf5;border:4px solid #000;padding:20px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:560px;width:100%}
.tsecret-warn{background:#b3343c;color:#fff;font-weight:800;padding:4px 12px}
.tsecret-big{font-family:var(--naskh);font-size:clamp(64px,12vw,120px);font-weight:700;line-height:1.5}
/* طريق اللافتات */
.road-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 auto 8px;font-size:20px}
.road-strip span{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:3px solid #000;background:#e2e2e2;border-radius:8px}
.road-strip span.done{background:#bfe6a8}.road-strip span.cur{background:var(--gold)}
.road-scene{position:relative;max-width:720px;margin:0 auto 6px;aspect-ratio:240/120;border:3px solid #000;border-radius:16px;overflow:hidden;background:#dff3ff}
.road-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.road-hero{position:absolute;left:5%;bottom:22%;width:12%}
.road-hero.high{bottom:47%}
.road-msg{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #000;border-radius:14px;padding:3px 14px;font-weight:800;font-size:clamp(13px,2.2vw,19px);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.road-msg.ok{background:#d9f7c8}.road-msg.no{background:#ffe3e3}
.signs{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.sign{position:relative;background:#1f7a4d;color:#fff;border:4px solid #fff;outline:3px solid #000;border-radius:12px;padding:0 28px 6px;font-family:var(--naskh);font-size:clamp(46px,7vw,64px);font-weight:700;line-height:1.5;cursor:pointer;box-shadow:0 5px 0 #000;margin-bottom:44px}
.sign::after{content:'';position:absolute;left:50%;top:100%;width:10px;height:40px;background:#868e96;border:3px solid #000;transform:translateX(-50%);margin-top:8px}
button.sign:hover{background:#2b9a62}
@keyframes a-run{to{left:80%}}
@keyframes a-jump{50%{left:42%;bottom:62%}100%{left:80%;bottom:22%}}
@keyframes a-swim{30%{left:36%;bottom:8%}70%{left:58%;bottom:8%}100%{left:80%;bottom:22%}}
@keyframes a-stop{35%{left:30%}75%{left:30%}100%{left:80%}}
@keyframes a-walkto{45%{left:44%}70%{left:44%}100%{left:80%}}
@keyframes a-down{100%{left:80%;bottom:22%}}
@keyframes a-oops{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.road-hero.a-run{animation:a-run 1.6s ease-in-out forwards}
.road-hero.a-jump{animation:a-jump 1.4s ease-in-out forwards}
.road-hero.a-swim{animation:a-swim 2s ease-in-out forwards}
.road-hero.a-stop{animation:a-stop 2.2s ease-in-out forwards}
.road-hero.a-open,.road-hero.a-eat,.road-hero.a-take{animation:a-walkto 2.2s ease-in-out forwards}
.road-hero.a-down{animation:a-down 1.6s ease-in-out forwards}
.road-hero.a-oops{animation:a-oops .8s}
/* صور SVG الناعمة لا تُرسم بكسلًا */
img[src^="data:image/svg"]{image-rendering:auto !important}
.scene[src^="data:image/svg"]{background:#fff8ea}
/* صيد الحرف في الكلمة */
.find-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;max-width:820px;margin:0 auto}
@media (max-width:760px){.find-wrap{grid-template-columns:1fr}}
.find-word{direction:rtl;text-align:center;font-family:var(--naskh);font-size:clamp(64px,10vw,96px);font-weight:700;line-height:1.6;background:#fffdf5;border:3px solid #000;padding:6px 10px}
.find-word span{cursor:pointer;border-radius:6px}
.find-word span:hover{background:#fff3bf}
.find-word span.hit{color:#d6336c;background:#d9f7c8}
.find-word span.miss{background:#ffe3e3}
/* مستوى اللعبة */
.lvl{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border:2px solid #000;margin-bottom:4px}
.lvl.l1{background:#bfe6a8}.lvl.l2{background:#ffe066}.lvl.l3{background:#ffc9c9}
/* اختيار الترتيب */
.order-pick{max-width:760px;margin:16px auto 0;padding:12px 14px;text-align:center;background:#fffdf5}
.order-desc{font-size:14px;font-weight:700;margin-top:6px}
.known-box{margin-top:8px;font-size:14px;font-weight:700}
.known-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;direction:rtl}
.known-row button{font-family:var(--nasakh);font-size:24px;font-weight:700;width:42px;height:42px;border:3px solid #000;background:#e9ecef;cursor:pointer}
.known-row button:hover{background:var(--gold)}
/* اختبار تحديد المستوى */
.pl-offer{max-width:760px;margin:10px auto 14px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff3bf;font-weight:700}
.pl-path{position:relative;height:46px;max-width:620px;margin:0 auto 10px;background:#e9ecef;border:3px solid #000;border-radius:24px;overflow:visible}
.pl-bar{position:absolute;top:0;bottom:0;right:0;background:#bfe6a8;border-radius:20px;transition:width .4s}
.pl-path img{position:absolute;bottom:2px;width:36px;transition:right .4s}
.pl-card{display:inline-block;min-width:170px;padding:0 30px;margin:6px auto 12px;background:#fffdf5;border:4px solid #000;border-radius:18px;box-shadow:0 6px 0 #000;font-family:var(--nasakh);font-size:clamp(96px,16vw,150px);font-weight:700;line-height:1.5}
.pl-card.word{font-family:var(--naskh);font-size:clamp(64px,11vw,100px)}
.pl-res{display:flex;gap:14px;justify-content:center;margin:10px 0}
.pl-res .mc{padding:10px 24px;background:#fff}
.pl-num{font-size:34px;font-weight:800}

/* =========================================================
   الأسلوب الناعم الموحّد (يحلّ محلّ طراز البكسل)
   ========================================================= */
body{background:#fdf3e4;color:#3d2b1f}
.mc{background:#fff;border:0;border-radius:22px;box-shadow:0 6px 20px rgba(120,80,40,.13)}
.mc-btn{background:#7d8db0;color:#fff;text-shadow:none;border:0;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.14);padding:8px 20px;font-weight:800;transition:transform .12s,filter .12s}
.mc-btn:hover{filter:brightness(1.08);background:#7d8db0}
.mc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mc-btn.go,.mc-btn.go:hover{background:#2f9e44}.mc-btn.red,.mc-btn.red:hover{background:#d6455c}.mc-btn.teal,.mc-btn.teal:hover{background:#1597a8}
.mc-btn[disabled]{background:#c9c3b8;color:#fff;box-shadow:none}
.mc-btn.sm{min-height:36px;padding:4px 14px}
.panel-h{background:linear-gradient(90deg,#f08a24,#e2731f);border:0;border-radius:22px 22px 0 0}

.panel{border-radius:22px;overflow:hidden}
.blk{border:0;border-radius:16px;text-shadow:0 2px 0 rgba(0,0,0,.18);box-shadow:0 5px 0 rgba(0,0,0,.12);image-rendering:auto}
.blk.on{outline:4px solid #ffd166;outline-offset:-4px}
.count{border:0;border-radius:999px;background:#fff3d6;padding:2px 12px}
.bar{border:0;border-radius:999px;background:#eadcc4;overflow:hidden}.bar i{background:#57c271;border-radius:999px}
.phases button{border:0;border-radius:999px;background:#f1e7d6;padding:4px 12px}
.phases button.on{background:#ffd166}.phases button.ok{background:#c9efc0}
.teacher-note{border-radius:14px;border:2px dashed #e2b04a;background:#fff8e6}
.wchip,.trace,.hands,.naskh-box,.find-word,.skel,.clue-glyph,.forms-t td,.hand-card,.secret,.half,.tile,.team,.cell,.card,.xo,.sort-bin,.bin-chip,.road-scene,.pl-card,.pl-path,.car{border-color:transparent!important;border-radius:16px}
.clue-glyph{background:#fffaf1;box-shadow:inset 0 0 0 2px #f1e3c6}
.xo{background:#efe3cf}.cell{background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.sort-bin{background:linear-gradient(160deg,#eab27a,#c07f41);box-shadow:0 5px 0 rgba(0,0,0,.12)}.bin-h{background:rgba(0,0,0,.18);border-radius:10px}
.scene{border:0;border-radius:16px;image-rendering:auto}
.wpic img.scene{background:transparent}
.stars i{border:0;border-radius:6px}
.toast{border:0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
img.px,canvas{image-rendering:auto}
.soft-screen{background:radial-gradient(ellipse at 50% 0%,#fff8ec 0%,#ffe8c8 55%,#f6d6a8 100%)!important}

/* القرائن المتحرّكة */
.clue-card{width:100%;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(120,80,40,.15);background:#fff}
.clue-pic.soft{background:transparent!important;border:0!important;padding:0!important}
.clue.small .clue-card{max-width:300px;margin:0 auto}
.join-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:4px 0 12px}
.join-card{border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(28,78,128,.12)}
.join-cap{font-weight:800;line-height:1.8;font-size:16px}
@media (max-width:620px){.join-wrap{grid-template-columns:1fr}}
.guide-btn{background:#fff3d6!important;color:#8a5a00!important;box-shadow:none!important;font-size:13px!important}

/* الخريطة الموجّهة */
.stage{background:#dff5d6}
.map-wrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.city-map{display:block;width:min(560px,100%);margin:0 auto;height:auto}
.map-go{position:sticky;bottom:0;display:flex;justify-content:center;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(223,245,214,.95) 40%)}
.big-go{font-size:21px!important;padding:12px 30px!important;min-height:54px}
.stn-now{animation:stnPulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes stnPulse{50%{transform:translateY(-5px)}}
.next-flag{animation:stnPulse 1.1s ease-in-out infinite}
.hero-walk{animation:heroBob .32s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes heroBob{50%{transform:translateY(-4px) rotate(2deg)}}
.hud{background:#fff;border:0;box-shadow:0 3px 12px rgba(120,80,40,.12)}
.hud .cname{color:#3d2b1f;text-shadow:none;flex:1;flex-wrap:wrap}
.hud .who{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui);font-size:15px;font-weight:800;background:#fff3d6;border-radius:999px;padding:2px 10px}

/* الدخول ولوحة المعلّم */
.login-wrap{max-width:860px;margin:5vh auto 0;text-align:center}
.brand{font-size:clamp(46px,9vw,84px);margin:0;color:#c2410c;line-height:1.1}
.login-wrap .tag{font-weight:700;color:#7a5236;margin:8px 0 26px}
.login-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.login-card{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:var(--ui)}
.login-card .lc-ic{font-size:54px}.login-card b{font-size:26px}.login-card span{font-weight:700;color:#7a6250}
.login-box{max-width:420px;margin:0 auto;padding:20px}.login-box.wide{max-width:760px}
.login-box h3{margin:0 0 12px}
.pin{display:block;width:100%;font-size:26px;text-align:center;letter-spacing:8px;padding:10px;border:2px solid #f1e3c6;border-radius:14px;margin:8px 0;font-family:var(--ui)}

.rn-crowd b{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#ffd43b;border:3px solid #2b1d2a;border-radius:16px;padding:0 14px;font-size:22px}
.rn-crowd.mine{bottom:10px}
.rn-crowd.mine.run img{animation:rnbob .3s ease-in-out infinite alternate}
.rn-crowd.mine.run img:nth-child(even){animation-delay:.15s}
@keyframes rnbob{to{transform:translateY(-7px)}}
.rn-crowd.enemy{top:30%}
.rn-crowd.enemy img{filter:hue-rotate(160deg) saturate(1.5) brightness(.75);width:34px}
.rn-crowd.enemy b{background:#c92a2a;color:#fff}
.rn-crowd.lost{opacity:.12}
.rn-vs{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);font-size:46px;font-weight:800;color:#fff;text-shadow:0 4px 0 #2b1d2a,3px 0 0 #2b1d2a,-3px 0 0 #2b1d2a;animation:shake .35s infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, useContext } = React;
const D = window.DAAD;
const FATHA = D.FATHA, DOT = '◌';
/* القرائن المعتمدة (mudun_clues_scenes.js) هي المصدر الوحيد: نوعها وكلمتها ووصفها */
CLUES.inject();
CLUES.letters.forEach(l => {
  const [kind, how, sayTxt] = CLUES.info(l), old = D.CLUES[l] || {};
  D.CLUES[l] = { kind: kind === 'مدمجة' ? 'شكلية' : 'صوتية', ic: null, say: sayTxt, how, col: old.col || '#c2410c' };
  D.HURUF.key[l] = sayTxt;
});
/* صور كلمات أدقّ دلالة */
(() => { const fix = { 'صَمْغُ': 'glue', 'رَأْسُ': 'head', 'صَقْرُ': 'falcon', 'ثَوْبُ': 'thobe' }; Object.values(D.LW).forEach(ws => ws.forEach(x => { if (fix[x[0]]) x[1] = fix[x[0]]; })); })();
/* بطاقة القرينة المتحرّكة داخل React */
function ClueCard({ l, noLetter, cls }) {
  const html = useMemo(() => CLUES.card(l, { noLetter }), [l, noLetter]);
  return <div className={'clue-card ' + (cls || '')} dangerouslySetInnerHTML={{ __html: html }} />;
}
function JoinCard({ l }) {
  const html = useMemo(() => CLUES.joinCard(l), [l]);
  return <div className="join-card" dangerouslySetInnerHTML={{ __html: html }} />;
}

/* ---------------- تخزين ---------------- */
const KEY = 'daad_mudun_v1';
const loadState = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const saveState = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

/* ---------------- صوت ---------------- */
const Snd = { on: true, ctx: null, voice: null, hasVoice: false };
function pickVoice() { try { const v = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang)); Snd.voice = v[0] || null; Snd.hasVoice = !!Snd.voice; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(t) {
  if (!Snd.on || !t) return;
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; if (Snd.voice) u.voice = Snd.voice; u.rate = .75; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function beep(kind) {
  if (!Snd.on) return;
  try {
    Snd.ctx = Snd.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
    const t = c.currentTime, f = { ok: [660, 990], bad: [220, 160], pop: [520, 520], win: [523, 1046] }[kind] || [440, 440];
    o.type = kind === 'bad' ? 'sawtooth' : 'square'; o.frequency.setValueAtTime(f[0], t); o.frequency.linearRampToValueAtTime(f[1], t + .15);
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + (kind === 'win' ? .5 : .18));
    o.start(t); o.stop(t + (kind === 'win' ? .5 : .2));
  } catch (e) {}
}

/* ---------------- أدوات ---------------- */
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const sample = (a, n) => shuffle(a).slice(0, n);
const TEX = {};
/* ألوان ناعمة بدل أنسجة البكسل */
const SOFT = { stone: 'linear-gradient(160deg,#7d8db0,#566685)', grass: 'linear-gradient(160deg,#5fc77d,#2f9e44)', planks: 'linear-gradient(160deg,#eab27a,#c07f41)', cobble: 'linear-gradient(160deg,#9aa3b5,#6b7489)', dark: 'linear-gradient(160deg,#4b4f63,#2f3242)', bricks: 'linear-gradient(160deg,#ef8a6f,#c95a43)', leaves: 'linear-gradient(160deg,#7fd38a,#3f9e4f)', sand: 'linear-gradient(160deg,#f6dfae,#e2bf7a)' };
const bg = k => ({ background: SOFT[k] || SOFT.stone });
const SCREEN_BG = 'radial-gradient(ellipse at 50% 0%,#fff8ec 0%,#ffe8c8 55%,#f6d6a8 100%)';
const syl = l => l + FATHA;
const ORD = ['الأوّل', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع'];
const LCOL = ['#d6336c', '#1c7ed6', '#e67700', '#2b8a3e', '#7c4bd6', '#0b7285'];

/* تقسيم الكلمة إلى حروف مع حركاتها، وتلوين حروف بعينها مع الحفاظ على الوصل */
const DIAC = /[ً-ْٰ]/;
const clusters = w => { const o = []; for (const ch of w) { if (DIAC.test(ch) && o.length) o[o.length - 1] += ch; else o.push(ch); } return o; };
const fam = c => c;
const joinsNext = c => !'اأإآدذرزوةءى'.includes(c);
function Colored({ w, letters, colors, only }) {
  const cs = clusters(w);
  return <span>{cs.map((c, i) => {
    const b = c[0], k = letters.indexOf(fam(b)), hit = k >= 0 && (only === undefined || only === i);
    const txt = (i > 0 && joinsNext(cs[i - 1][0]) ? '‍' : '') + c + (i < cs.length - 1 && joinsNext(b) ? '‍' : '');
    return <span key={i} style={hit ? { color: colors[k] } : null}>{txt}</span>;
  })}</span>;
}
const formsOf = l => joinsNext(l) ? [l, l + 'ـ', 'ـ' + l + 'ـ', 'ـ' + l] : [l, l, 'ـ' + l, 'ـ' + l];
const keyOf = l => D.HURUF.key[l];
const ALLWORDS = [...new Set([...D.HURUF.groups.flatMap(g => g.words), ...Object.values(D.HURUF.key)])];
function posOf(w, l) { const b = clusters(w).map(c => fam(c[0])); const idx = b.map((x, i) => x === l ? i : -1).filter(i => i >= 0); return { idx, n: b.length }; }
function exampleAt(l, p) {
  return ALLWORDS.find(w => { const { idx, n } = posOf(w, l); return idx.some(i => p === 0 ? i === 0 : p === 2 ? i === n - 1 : (i > 0 && i < n - 1)); });
}

function Celebrate({ title, sub, onClose }) {
  useEffect(() => { beep('win'); const t = setTimeout(onClose, 2300); return () => clearTimeout(t); }, []);
  return <div className="celebrate" onClick={onClose}><div className="mc"><div className="stars"><i /><i /><i /></div><h2>{title}</h2>{sub && <div style={{ fontWeight: 800, fontSize: 18 }}>{sub}</div>}</div></div>;
}
function Phases({ list, cur, set, seen }) {
  return <div className="phases">{list.map(([id, t]) => <button key={id} className={(cur === id ? 'on' : '') + (seen[id] ? ' ok' : '')} onClick={() => set(id)}>{seen[id] ? '✓ ' : ''}{t}</button>)}</div>;
}

/* =========================================================
   مدينة الحروف — بيت فيه أربعة حروف
   ========================================================= */
/* قصة اليد: كيف يتصل الحرف بما بعده */
function HandForm({ f, color }) {
  const cs = [...f];
  const jn = c => c === 'ـ' || joinsNext(c);
  return <span>{cs.map((c, i) => {
    const txt = (i > 0 && jn(cs[i - 1]) ? '\u200D' : '') + c + (i < cs.length - 1 && jn(c) ? '\u200D' : '');
    return <span key={i} style={{ color: c === 'ـ' ? '#e0a100' : color }}>{txt}</span>;
  })}</span>;
}
function HandStory({ l, color }) {
  const j = joinsNext(l), fs = formsOf(l);
  const T = j
    ? ['وحده: ذيله مرتاح', 'في أوّل الكلمة: يكسر ذيله ويمدّ يده لمن بعده', 'في وسطها: يمسك بيدين، يدٍ لمن قبله ويدٍ لمن بعده', 'في آخرها: يمسك يد من قبله، ويرتاح ذيله']
    : ['وحده', 'في أوّل الكلمة: لا يمدّ يده لمن بعده', 'في وسطها: يمسك يد من قبله فقط', 'في آخرها: يمسك يد من قبله'];
  return (<div className="hands">
    <div className="hands-t">قصة اليد: كيف يمسك الحرف بيد صاحبه؟ <span style={{ color: '#e0a100' }}>(اليد باللون الذهبي)</span></div>
    <div className="join-wrap"><JoinCard l={l} /><div className="join-cap">{j ? 'انظر: الحرف نفسه يكسر ذيله ويمدّ يده إلى الحرف الذي بعده — في حركة واحدة.' : 'هذا الحرف لا يمدّ يده لمن بعده؛ يمسك بمن قبله فقط.'}</div></div>
    <div className="hands-row">{fs.map((f, i) => <div key={i} className="hand-card"><span className="hf"><HandForm f={f} color={color} /></span><span className="ht">{T[i]}</span></div>)}</div>
    {!j && <div className="hands-note">هذا من الحروف الخجولة التي لا تمدّ يدها لمن بعدها: أ د ذ ر ز و</div>}
  </div>);
}

/* تمهيد الليغو: حرف + حرف = كلمة */
const LEGO_EX = [
  { ls: ['ي', 'د'], w: 'يَدُ', ic: 'hand' },
  { ls: ['د', 'ب'], w: 'دُبُّ', ic: 'bear' },
  { ls: ['أ', 'س', 'د'], w: 'أَسَدُ', ic: 'lion' },
  { ls: ['ق', 'ل', 'م'], w: 'قَلَمُ', ic: 'pen' },
];
const BRICK = ['#e8505b', '#2f7fd6', '#f2b705', '#3c8527'];
function Lego({ hero, onNext }) {
  const [i, setI] = useState(0), [snap, setSnap] = useState(false), [word, setWord] = useState(false);
  const ex = LEGO_EX[i];
  useEffect(() => { setSnap(false); setWord(false); }, [i]);
  const build = () => { beep('pop'); setSnap(true); setTimeout(() => { setWord(true); beep('ok'); say(ex.w); }, 900); };
  return (<div>
    <div className="mc lego-intro">
      <div>الحرف وحده مثل <b>قطعة ليغو</b> صغيرة.</div>
      <div>قطعة + قطعة = لعبة… و<b style={{ color: '#c2410c' }}>حرف + حرف = كلمة!</b></div>
      <div>وحين تلتصق الحروف، يمدّ كلّ حرفٍ يده ليمسك يد الحرف الذي بعده.</div>
    </div>
    <div className={'lego-row' + (snap ? ' snap' : '')}>{ex.ls.map((x, k) => (
      <React.Fragment key={k}>{k > 0 && <span className="plus">+</span>}<span className="brick" style={{ background: BRICK[k % 4] }}>{x}</span></React.Fragment>
    ))}</div>
    {word && <div className="lego-result">
      <img className="scene" src={picOf(ex.ic)} alt="" style={{ maxWidth: 240 }} />
      <div className="big-word">{ex.w}</div>
    </div>}
    <div className="center">
      {!snap && <button className="mc-btn go" onClick={build}>ركّب القطع!</button>}
      {word && <button className="mc-btn teal" onClick={() => say(ex.w)}>🔊 اسمع</button>}
      {word && i < LEGO_EX.length - 1 && <button className="mc-btn go" onClick={() => setI(i + 1)}>كلمة أخرى ←</button>}
      {word && <button className="mc-btn go" onClick={onNext}>هيّا نتعرّف الحروف ←</button>}
    </div>
  </div>);
}

function Mnemonic({ l, color }) {
  const m = D.MNEMO[l];
  const [run, setRun] = useState(0), [done, setDone] = useState(!m);
  useEffect(() => {
    setDone(!m);
    const t = setTimeout(() => { setDone(true); beep('ok'); say(keyOf(l)); }, m ? 1250 : 200);
    return () => clearTimeout(t);
  }, [l, run]);
  const top = m && (m.place === 'up' ? '20%' : m.place === 'down' ? '62%' : '48%');
  return (<div>
    <div className="mnwrap">
      <div className={'mn' + (done ? ' done' : '')} key={l + run} onClick={() => setRun(r => r + 1)} title="أعِد القرينة">
        {m && <span className="sk">{m.skel}</span>}
        <span className="real" style={{ color }}>{l}</span>
        {m && Array.from({ length: m.n }).map((_, i) => (
          <img key={i} className="ob px" src={PX.objURL(m.obj)} alt="" style={{ left: `calc(50% - 22px + ${(i - (m.n - 1) / 2) * 48}px)`, top, animationDelay: (i * .18) + 's' }} />
        ))}
      </div>
      <div className="naskh-box">
        <span className="cap">هكذا يُكتب بخطّ النسخ</span>
        <span className="big" style={{ color }}>{l}</span>
        
      </div>
    </div>
    <p className="story-line">{m ? m.story : D.SHAPE[l]}</p>
    <HandStory l={l} color={color} />
    <div className="center">
      <span className="keyword"><Colored w={keyOf(l)} letters={[l]} colors={[color]} only={0} /></span>
      <button className="mc-btn teal sm" onClick={() => say(keyOf(l))}>🔊 اسمع</button>
      {m && <button className="mc-btn sm" onClick={() => setRun(r => r + 1)}>أعِد القرينة</button>}
    </div>
  </div>);
}

const ROOMY = ['finger_up', 'knock', 'kid_belly', 'blow', 'whistle', 'drum', 'lollipop', 'loop', 'plate_egg', 'plate_apples', 'bowl_star', 'book', 'books', 'pen', 'chair', 'clock', 'cup', 'box', 'gift', 'glasses', 'envelope', 'candle', 'dress', 'shirt', 'bucket', 'bed', 'sickbed', 'knife', 'pot', 'plate', 'juice', 'bread', 'egg', 'teacher', 'baker', 'newspaper', 'toys', 'hand', 'face', 'ear', 'eye', 'gold', 'triangle', 'jug', 'soap', 'beads', 'bulb', 'stick', 'lemon', 'apple', 'peach', 'pomegranate', 'watermelon', 'banana', 'dates', 'berries', 'fig', 'beans', 'corn', 'olive', 'mug', 'medal', 'bell', 'crown'];
const SEAY = ['whale', 'fish', 'ship', 'sea', 'duck', 'island'];
const NIGHTY = ['moon', 'crescent', 'star'];
const bgFor = ic => /^face_/.test(ic) ? 'room' : SEAY.includes(ic) ? 'sea' : NIGHTY.includes(ic) ? 'night' : ROOMY.includes(ic) ? 'room' : 'out';
const POSN_J = ['في أوّلها: يمدّ يده', 'في وسطها: يمسك بيدين', 'في آخرها: يرتاح ذيله'];
const POSN_N = ['في أوّل الكلمة', 'في وسط الكلمة', 'في آخر الكلمة'];
function posLabel(w, l) { const { idx, n } = posOf(w, l); if (!idx.length) return ''; const i = idx[0], k = i === 0 ? 0 : i === n - 1 ? 2 : 1; return (joinsNext(l) ? POSN_J : POSN_N)[k]; }
function WordPic({ w, ic, l, color, hero, cls, onClick, hideWord, label }) {
  return (<button className={'mc wpic ' + (cls || '')} onClick={onClick || (() => say(w))}>
    <img className="scene" src={picOf(ic, hero)} alt="" />
    {!hideWord && <span className="wtxt"><Colored w={w} letters={l ? [l] : []} colors={[color]} /></span>}
    {label && <span className="wpos">{label}</span>}
  </button>);
}

/* ملعب الدرس: محرّك الألعاب الأحد عشر بحروف الدرس */
function Arcade({ pack, diff }) {
  const src = 'daad_games_engine.html?pack=' + encodeURIComponent(JSON.stringify(pack)) + '&diff=' + (diff || 'syllables');
  return (<div>
    <div className="teacher-note">ملعب الدرس: إحدى عشرة لعبة تعمل على حروف هذا الدرس. من زرّ «إعدادات» داخل الملعب يغيّر المعلّم الصعوبة (حروف ومقاطع / كلمات) والسرعة وعدد النقاط للنجاح.</div>
    <iframe className="arcade" src={src} title="ملعب الدرس" />
  </div>);
}
function housePack(gi) {
  const G = D.HURUF.groups[gi], prev = D.HURUF.groups.slice(0, gi).flatMap(g => g.letters);
  const sib = l => (D.LOOKALIKE.find(g => g.includes(l)) || [l]);
  const syls = [...new Set([...G.letters, ...G.letters.flatMap(sib)])].map(syl);
  const easy = [...new Set(G.letters.flatMap(l => (D.LW[l] || []).map(x => x[0])))];
  const hard = [...new Set([...G.words, ...shuffle(prev.flatMap(l => (D.LW[l] || []).map(x => x[0]))).slice(0, 6)])];
  return { name: 'حروف البيت: ' + G.letters.join(' '), syllables: syls, easy, hard, sentences: [] };
}
const fathaPack = () => { const C = D.CONTENT.fatha; return { name: 'مدينة الفتحة', syllables: C.syllables, easy: C.words.map(w => w.w), hard: C.words.map(w => w.w), sentences: C.story.map(x => x.t) }; };

/* =========================================================
   ألعاب أكاديمية بلا سرعة: تصنيف وأدوار — كلّ لعبة تعالج مشكلة
   ========================================================= */
const DOTS = { 'ب': 'd1', 'ج': 'd1', 'ت': 'n2', 'ق': 'n2', 'ي': 'n2', 'ث': 'n3', 'ش': 'n3', 'خ': 'u1', 'ذ': 'u1', 'ز': 'u1', 'ض': 'u1', 'ظ': 'u1', 'غ': 'u1', 'ف': 'u1', 'ن': 'u1' };
const DOT_BINS = { n0: 'بلا نقاط', u1: 'نقطة واحدة فوقه', d1: 'نقطة واحدة تحته', n2: 'نقطتان', n3: 'ثلاث نقاط' };
const dotOf = l => DOTS[l] || 'n0';
/* كل صور الكلمات من مكتبة الرسوم الناعمة الموحّدة (mudun_art_pics.js) */
const picOf = ic => (ic && ART.has(ic)) ? ART.picURL(ic) : ART.picURL('star');
const startsWith = (w, l) => fam(clusters(w)[0][0]) === l;

function SortGame({ title, note, items, bins, onDone }) {
  const [sel, setSel] = useState(null), [placed, setPlaced] = useState({}), [bad, setBad] = useState(null), [badBin, setBadBin] = useState(null);
  const left = items.filter(it => !placed[it.id]);
  const put = b => {
    if (!sel) { beep('bad'); return; }
    const it = items.find(x => x.id === sel);
    if (it.bin === b) { beep('ok'); setPlaced(p => ({ ...p, [it.id]: b })); setSel(null); if (left.length === 1) setTimeout(() => onDone && onDone(), 900); }
    else { beep('bad'); setBad(it.id); setBadBin(b); setTimeout(() => { setBad(null); setBadBin(null); }, 500); }
  };
  return (<div>
    <p className="lead">{title}</p>
    {note && <div className="teacher-note">{note}</div>}
    <div className="sort-items">{left.map(it => (
      <button key={it.id} className={'mc sort-card' + (sel === it.id ? ' sel' : '') + (bad === it.id ? ' shake' : '')} onClick={() => { setSel(it.id); beep('pop'); it.say && say(it.say); }}>{it.label}</button>
    ))}{!left.length && <div className="win-banner">أحسنت! صنّفتها كلّها ✓</div>}</div>
    <div className="sort-bins" style={{ gridTemplateColumns: `repeat(${Math.min(bins.length, 4)}, 1fr)` }}>{bins.map(b => (
      <button key={b.id} className={'sort-bin' + (badBin === b.id ? ' shake' : '') + (sel ? ' ready' : '')} onClick={() => put(b.id)}>
        <div className="bin-h">{b.label}</div>
        <div className="bin-in">{items.filter(it => placed[it.id] === b.id).map(it => <span key={it.id} className="bin-chip">{it.mini || it.label}</span>)}</div>
      </button>
    ))}</div>
  </div>);
}

/* اختبارات الحرف الواحد: أين يسكن؟ + التوائم */
function LetterTests({ l, col, hero, onDone }) {
  const [t, setT] = useState(0);
  const posItems = useMemo(() => (D.LW[l] || []).map(([w, ic]) => {
    const { idx, n } = posOf(w, l), i = idx[0];
    return { id: w, say: w, bin: i === 0 ? 'p0' : i === n - 1 ? 'p2' : 'p1',
      label: <span className="sort-word"><img className="px mini-pic" src={picOf(ic, hero)} alt="" /><Colored w={w} letters={[l]} colors={[col]} /></span>,
      mini: <Colored w={w} letters={[l]} colors={[col]} /> };
  }), [l]);
  const posBins = [{ id: 'p0', label: 'في أوّلها' }, { id: 'p1', label: 'في وسطها' }, { id: 'p2', label: 'في آخرها' }].filter(b => posItems.some(it => it.bin === b.id) || true);
  const cards = useMemo(() => {
    const sib = (D.LOOKALIKE.find(g => g.includes(l)) || []).filter(x => x !== l);
    const others = sib.length ? sib : sample(D.LETTERS.filter(x => x !== l && x !== 'أ'), 2);
    return shuffle([...new Set(formsOf(l))].map(f => ({ f, ok: true })).concat(others.flatMap(o => sample([...new Set(formsOf(o))], 2).map(f => ({ f, ok: false })))));
  }, [l]);
  const [chosen, setChosen] = useState({}), [checked, setChecked] = useState(false);

    <p className="lead">أحسنت! عبرتَ طريق الحروف. أمامك الآن جسرٌ من الحركات: كلّ لوحٍ فيه مقطعٌ أو كلمة.</p>
    <div className="teacher-note">ثلاثة ألواح للفتحة: مقطعان ثم كلمة. النتيجة تحدّد المحطة داخل مدينة الفتحة.</div>
    <div className="center"><button className="mc-btn go" onClick={() => setStage('harakat')}>اعبر الجسر ←</button></div>
  </div>);
  else if (stage === 'harakat') body = (<div style={{ textAlign: 'center' }}>
    <Path />
    <p className="lead">مدينة {PL_LEVELS[hv].name}: اقرأ <span className="count">{hi + 1} / 3</span></p>
    <div className="pl-card word">{PL_LEVELS[hv].items[hi]}</div>
    <Judge on={judgeH} />
  </div>);
  else body = (<div>
    <div className="win-banner">انتهت رحلة الاستكشاف 🎉</div>
    <div className="why-kid"><img src={ART.hero(student.hero === 'girl')} alt="" /><div>{plan.kid}</div></div>
    <div className="pl-res">
      <div className="mc"><b>عرفها وحده</b><div className="pl-num">{known.length} / 28</div></div>
      <div className="mc"><b>بمساعدة</b><div className="pl-num">{weak.length}</div></div>
      <div className="mc"><b>لم يعرفها</b><div className="pl-num">{unknown.length}</div></div>
    </div>
    <div className="why-teacher"><b>لماذا هذا الموضع؟ (للمعلّم)</b><p>{plan.why}</p>
      {unknown.length + weak.length > 0 && <p>الحروف التي سيتعلّمها: <span className="why-letters">{[...weak, ...unknown].join(' ')}</span></p>}
      <p>نقطة البداية: <b>{CITY_NAMES[plan.city]}</b>. يمكنك تعديلها لاحقًا من لوحة المعلّم.</p></div>
    <div className="center"><button className="mc-btn go" style={{ fontSize: 20 }} onClick={apply}>اعتمد وادخل المدينة ←</button><button className="mc-btn sm" onClick={onCancel}>إلغاء دون اعتماد</button></div>
  </div>);
  return (<div className="screen soft-screen"><div className="mc panel pl-panel">
    <div className="panel-h"><h3>اختبار تحديد المستوى{student.name ? ' — ' + student.name : ''}</h3>{onCancel && <button className="mc-btn sm" onClick={onCancel}>إغلاق</button>}</div>
    <div className="panel-b">{body}</div>
  </div></div>);
}

/* تجاوز يدويّ للمعلّم: ترتيب الحروف ونقطة البداية */
function OrderPicker({ state, setState }) {
  const order = ['abc', 'custom'].includes(state.order) ? state.order : 'shape';
  const [msg, setMsg] = useState('');
  const setOrder = o => { if (o === 'custom') applyCustom(state.report); setState(s => ({ ...s, order: o })); setMsg(''); };
  const city = state.city === 'fatha' ? 'fatha' : 'huruf';
  if (order === 'custom') applyCustom(state.report);
  const stns = city === 'huruf' ? D.hurufStations(order) : D.STATIONS.map(s => ({ ...s, pip: s.label }));
  const placeAt = id => {
    const k = stns.findIndex(x => x.id === id);
    setState(s => {
      const p = {}; stns.forEach((x, i) => { if (i < k) p[x.id] = 1; });
      const prog = { ...(s.prog || {}), [city]: p };
      if (city === 'fatha') prog.huruf = Object.fromEntries(D.hurufStations(s.order === 'abc' ? 'abc' : 'shape').map(x => [x.id, 1]));
      return { ...s, city, prog };
    });
    setMsg('وُضع الطالب عند «' + stns[k].label + '» وعُلّم ما قبلها منجزًا.');
  };
  return (<div className="mc order-pick">
    <b>ترتيب مدينة الحروف:</b>
    <div className="center" style={{ margin: '8px 0 4px' }}>
      <button className={'mc-btn sm' + (order === 'custom' ? ' go' : '')} onClick={() => setOrder('custom')} disabled={!state.report}>مسار شخصي من الاختبار</button>
      <button className={'mc-btn sm' + (order === 'shape' ? ' go' : '')} onClick={() => setOrder('shape')}>بحسب سهولة الرسم</button>
      <button className={'mc-btn sm' + (order === 'abc' ? ' go' : '')} onClick={() => setOrder('abc')}>بالترتيب الأبجدي</button>
    </div>
    <div className="order-desc">{order === 'custom' ? 'حروفه المعروفة في بيتٍ منجز، ثم عائلات الشكل بالحروف التي لم يتقنها فقط.' : order === 'shape' ? 'ستّة بيوت: من الحروف التي لا يتغيّر شكلها إلى التي تتغيّر كثيرًا.' : 'سبعة بيوت بترتيب الأبجدية، أربعة حروف في كلّ بيت.'}</div>
    <div style={{ marginTop: 10 }}><b>نقطة البداية:</b>
      <div className="center" style={{ marginTop: 6 }}>
        <button className={'mc-btn sm' + (city === 'huruf' ? ' teal' : '')} onClick={() => setState(s => ({ ...s, city: 'huruf' }))}>مدينة الحروف</button>
        <button className={'mc-btn sm' + (city === 'fatha' ? ' teal' : '')} onClick={() => setState(s => ({ ...s, city: 'fatha' }))}>مدينة الفتحة</button>
      </div>
      <div className="known-row">{stns.map(x => <button key={x.id} className="stn-pick" onClick={() => placeAt(x.id)}>{x.label}{x.pip && x.pip !== x.label ? ' · ' + x.pip : ''}</button>)}</div>
    </div>
    {msg && <div className="order-desc" style={{ color: '#2b8a3e' }}>{msg}</div>}
  </div>);
}

/* حروف البيت معًا: بنك الألعاب */
function TogetherHub({ letters, learned, hero, onTest }) {
  const [g, setG] = useState(null);
  const soundItems = useMemo(() => letters.flatMap(x => (D.LW[x] || []).filter(([w]) => startsWith(w, x)).slice(0, 2).map(([w, ic]) => ({
    id: w, bin: x, say: w, label: <span className="pic-card"><img className="px" src={picOf(ic, hero)} alt="" /></span>, mini: <img className="px" src={picOf(ic, hero)} alt="" />,
  }))).sort(() => Math.random() - .5), [letters.join('')]);
  const soundBins = letters.map(x => ({ id: x, label: <span style={{ fontFamily: 'var(--nasakh)', fontSize: 44, color: '#fff', textShadow: '2px 2px 0 #000' }}>{x}</span> }));
  const dotLetters = useMemo(() => shuffle([...new Set([...letters, ...sample(learned, 8)])]).slice(0, 10), [letters.join('')]);
  const dotItems = dotLetters.map(x => ({ id: x, bin: dotOf(x), label: <span className="sort-letter">{x}</span> }));
  const dotBins = Object.keys(DOT_BINS).filter(k => dotItems.some(it => it.bin === k)).map(k => ({ id: k, label: DOT_BINS[k] }));
  const LIST = [
    { id: 'where', lvl: 1, name: 'أين الحرف؟', fix: 'يربط الصوت بشكل الحرف', desc: 'المعلّم ينطق صوت حرف لا يراه الطالب، والطالب يشير إليه بين ثلاثة أو أربعة حروف.', C: () => <WhereLetter letters={letters} learned={learned} /> },
    { id: 'find', lvl: 1, name: 'صيد الحرف في الكلمة', fix: 'يرى الحرف داخل الكلمة', desc: 'كلمة بصورتها، ويضغط الطالب على مكان الحرف فيها: في أوّلها أو وسطها أو آخرها.', C: () => <FindInWord letters={letters} hero={hero} /> },
    { id: 'whose', lvl: 1, name: 'من صاحب القرينة؟', fix: 'يثبّت القرينة الصوتية', desc: 'يُعرض مشهد القرينة وصوتها، فيختار الطالب حرفها.', C: () => <WhoseSound letters={letters} hero={hero} /> },
    { id: 'sound', lvl: 2, name: 'صندوق الأصوات', fix: 'يربط الصوت بالحرف', desc: 'اسمع اسم الصورة، ثم ضعها في صندوق الحرف الذي تبدأ به كلمتها.', C: () => <SortGame title="ضع كلّ صورة في صندوق الحرف الذي تبدأ به كلمتها" note="اضغط الصورة لتسمع اسمها (أو ينطقه المعلّم)، ثم اضغط الصندوق." items={soundItems} bins={soundBins} /> },
    { id: 'mem', lvl: 1, name: 'ذاكرة الحرف والكلمة', fix: 'ثلاث درجات: القرينة ← الكلمة ← الشكل المتصل', desc: 'فريقان بالأدوار يطابقان الحرف مع قرينته، ثم مع كلمته، ثم شكله المتصل مع كلمته.', C: () => <LetterMemory pool={learned} hero={hero} /> },
    { id: 'place', lvl: 3, name: 'ضع النقاط', fix: 'يعالج خلط العائلات', desc: 'اسمع القرينة، ثم ضع النقاط الصحيحة على هيكل الحرف.', C: () => <PlaceDots learned={learned} hero={hero} /> },
    { id: 'odd', lvl: 3, name: 'الدخيل', fix: 'يعالج خلط المتشابهات', desc: 'ثلاثة أشكال لحرف واحد ودخيل يشبهها في الرسم.', C: () => <OddForm learned={learned} /> },
    { id: 'dots', lvl: 3, name: 'فرز النقاط', fix: 'يثبّت قاعدة النقاط', desc: 'صنّف الحروف بحسب نقاطها: فوقه، تحته، نقطتان، ثلاث…', C: () => <SortGame title="صنّف كلّ حرفٍ بحسب نقاطه" note="انظر: أين النقاط؟ وكم عددها؟" items={dotItems} bins={dotBins} /> },
    { id: 'xo', lvl: 2, name: 'إكس-أو الحروف', fix: 'يقيس النطق أمام الصف', desc: 'يختار الطالب خانة ويقول صوت الحرف أو قرينته.', C: () => <XOGame mode="letter" pool={learned} /> },
    { id: 'race', lvl: 2, name: 'سباق الدرجات', fix: 'الجرأة ميزة لا السرعة', desc: 'لوحة أدوار: بطاقة عادية أو ذهبية، و⚡ بقرار المعلّم.', C: () => <BoardRace pool={learned} hero={hero} /> },
  ];
  const G = LIST.find(x => x.id === g);
  if (G) return (<div>
    <div className="center" style={{ marginTop: 0, marginBottom: 12, justifyContent: 'space-between' }}><button className="mc-btn sm" onClick={() => setG(null)}>→ كلّ الألعاب</button><b style={{ fontSize: 20 }}>{G.name}</b><GuideBtn id={{ sound: 'sort', xo: 'xoL' }[G.id] || G.id} /></div>
    {G.C()}
  </div>);
  return (<div>
    <p className="lead">حروف البيت معًا: ألعاب بلا سرعة، تصنيفٌ وأدوار — وكلّ لعبة تعالج مشكلة</p>
    <div className="games-hub">{[...LIST].sort((a, b) => a.lvl - b.lvl).map(x => (
      <div key={x.id} className="mc gcard"><span className={'lvl l' + x.lvl}>{['', 'سهل', 'متوسّط', 'متقدّم'][x.lvl]}</span><h4>{x.name}</h4><GuideBtn id={{ sound: 'sort', xo: 'xoL' }[x.id] || x.id} /><span className="count" style={{ fontSize: 13 }}>{x.fix}</span><p>{x.desc}</p><button className="mc-btn go" onClick={() => setG(x.id)}>ابدأ</button></div>
    ))}</div>
    <div className="center"><button className="mc-btn go" onClick={onTest}>اختبار حروف البيت ←</button></div>
  </div>);
}

function LetterGroupStation({ gi, groups, onDone, openXO, onResult, hero }) {
  const G = groups[gi], letters = G.letters;
  const learned = useMemo(() => groups.slice(0, gi + 1).flatMap(g => g.letters), [gi, groups]);
  const [li, setLi] = useState(0), [step, setStep] = useState(gi === 0 ? 'lego' : 'sound'), [doneL, setDoneL] = useState({});
  const [fat, setFat] = useState(false), [drop, setDrop] = useState(false);
  const STEPS = [['sound', 'صوته مع الفتحة'], ['clue', 'القرينة'], ['forms', 'أحواله وتتبّعه'], ['words', 'كلمات بالصور'], ['tests', 'اختبارات'], ['game', 'لعبة الحرف']];
  const l = letters[li], col = LCOL[li % LCOL.length];
  useEffect(() => { setFat(false); setDrop(false); setGr(0); setPick(null); }, [li, step]);
  const goLetter = i => { setLi(i); setStep('sound'); };
  const nextStep = () => {
    const i = STEPS.findIndex(x => x[0] === step);
    if (i < STEPS.length - 1) { setStep(STEPS[i + 1][0]); return; }
    setDoneL(d => ({ ...d, [li]: 1 }));
    if (li < letters.length - 1) goLetter(li + 1); else setStep('together');
  };
  const pool = useMemo(() => Object.entries(D.LW).flatMap(([k, ws]) => ws.map(([w, ic]) => ({ w, ic }))), []);
  const gameRounds = useMemo(() => {
    const has = (w, x) => posOf(w, x).idx.length > 0;
    return (D.LW[l] || []).map(([w, ic]) => {
      const others = shuffle(pool.filter(o => !has(o.w, l) && o.ic !== ic)).filter((o, i, arr) => arr.findIndex(z => z.ic === o.ic) === i).slice(0, 2);
      return { w, ic, opts: shuffle([{ w, ic, ok: true }, ...others]) };
    });
  }, [l]);
  const [gr, setGr] = useState(0), [pick, setPick] = useState(null);
  const randForm = x => { const fs = [...new Set(formsOf(x))]; return fs[Math.floor(Math.random() * fs.length)]; };
  const testRounds = useMemo(() => {
    const prev = shuffle(learned.filter(x => !letters.includes(x))).slice(0, 4);
    return shuffle([...letters, ...prev]).map(x => ({ l: x, f: randForm(x) }));
  }, [gi]);
  const [rvList, setRvList] = useState(null), [res, setRes] = useState({}), [ri, setRi] = useState(0), [help, setHelp] = useState(false), [reveal, setReveal] = useState(false);

  let body;
  if (step === 'together') {
    body = <TogetherHub letters={letters} learned={learned} hero={hero} onTest={() => { setStep('test'); setRi(0); }} />;
  } else if (step === 'lego') {
    body = <Lego hero={hero} onNext={() => goLetter(0)} />;
  } else if (step === 'sound') {
    body = (<div style={{ textAlign: 'center' }}>
      <p className="lead">هذا حرفٌ جديد. اضغطه لتنزل عليه الفتحة، ثم انطق صوته</p>
      <button className="blk soundblk" style={{ ...bg(fat ? 'grass' : 'stone'), color: '#fff' }} onClick={() => {
        if (fat) { say(syl(l)); return; }
        setDrop(true); beep('pop'); setTimeout(() => { setFat(true); setDrop(false); say(syl(l)); }, 450);
      }}>{fat ? syl(l) : l}{drop && <span className="fd" />}</button>
      {fat && <p className="lead" style={{ marginTop: 12 }}>صوت الحرف <span className="keyword" style={{ color: col, fontFamily: 'var(--nasakh)' }}>{l}</span> مع الفتحة: <span className="keyword" style={{ color: col }}>{syl(l)}</span></p>}
      <div className="center"><button className="mc-btn go" onClick={nextStep}>القرينة ←</button></div>
    </div>);
  } else if (step === 'clue') {
    body = <ClueStep key={l} l={l} hero={hero} onDone={nextStep} />;
  } else if (step === 'forms') {
    body = (<div>
      <div className="forms-wrap"><HandStory l={l} color={col} /><TraceBox l={l} color={col} /></div>
      <div className="center"><button className="mc-btn go" onClick={nextStep}>كلمات بالصور ←</button></div>
    </div>);
  } else if (step === 'words') {
    body = (<div>
      <div className="teacher-note">اضغط الصورة لتسمع الكلمة، واطلب من الطالب أن يشير إلى الحرف الملوّن ويقول صوته.</div>
      <div className="wgrid">{(D.LW[l] || []).map(([w, ic]) => <WordPic key={w} w={w} ic={ic} l={l} color={col} hero={hero} label={posLabel(w, l)} />)}</div>
      <div className="center"><button className="mc-btn go" onClick={nextStep}>اختبارات الحرف ←</button></div>
    </div>);
  } else if (step === 'tests') {
    body = <LetterTests key={l} l={l} col={col} hero={hero} onDone={nextStep} />;
  } else if (step === 'game') {
    const r = gameRounds[gr];
    body = r ? (<div>
      <p className="lead">أيُّ صورةٍ في كلمتها حرف <span className="keyword" style={{ color: col, fontFamily: 'var(--nasakh)', fontSize: 40 }}>{l}</span>؟ <span className="count">{gr + 1} / {gameRounds.length}</span></p>
      <div className="teacher-note">انطق اسم كل صورة (أو اضغط «اسمع» تحتها)، ثم يختار الطالب.</div>
      <div className="wgrid">{r.opts.map(o => (
        <div key={o.ic + o.w} style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <WordPic w={o.w} ic={o.ic} l={o.ok ? l : null} color={col} hero={hero} hideWord={!pick} cls={pick ? (o.ok ? 'ok' : pick === o.w ? 'no' : '') : ''}
            onClick={() => { if (pick) return; setPick(o.w); if (o.ok) { beep('ok'); say(o.w); setTimeout(() => { setPick(null); setGr(gr + 1); }, 1500); } else { beep('bad'); setTimeout(() => setPick(null), 900); } }} />
          <button className="mc-btn sm teal" onClick={() => say(o.w)}>🔊 اسمع</button>
        </div>
      ))}</div>
    </div>) : (<div style={{ textAlign: 'center' }}>
      <p className="lead">أحسنت! أتقنت حرف <span className="keyword" style={{ color: col, fontFamily: 'var(--nasakh)' }}>{l}</span></p>
      <button className="mc-btn go" onClick={nextStep}>{li < letters.length - 1 ? 'الحرف التالي: ' + letters[li + 1] + ' ←' : 'ألعاب حروف البيت ←'}</button>
    </div>);
  } else {
    const list = rvList || testRounds, r = list[ri];
    const judge = v => {
      setRes(x => ({ ...x, [r.l]: v })); onResult && onResult(r.l, v);
      const next = () => { setHelp(false); setReveal(false); setRi(ri + 1); };
      if (v === 'no') { beep('bad'); setReveal(true); say(clueOf(r.l).say); setTimeout(next, 2200); }
      else { beep(v === 'ok' ? 'ok' : 'pop'); setTimeout(next, 250); }
    };
    if (r) {
      body = (<div>
        <div className="teacher-note">اختبار الحروف: اطلب من الطالب أن يقول صوت الحرف. إن تعثّر فاضغط «مساعدة» لتظهر قرينته، ثم قيّم إجابته.</div>
        <p className="lead">اختبار شفهي <span className="count">{ri + 1} / {list.length}</span></p>
        <div className="qword" style={{ fontFamily: 'var(--nasakh)', fontSize: 120 }}><HandForm f={r.f} color="#2a1d24" /></div>
        {(help || reveal) && <ClueScene l={r.l} level={0} hero={hero} small />}
        <div className="center">
          <button className="mc-btn go" onClick={() => judge('ok')}>✓ قالها</button>
          <button className="mc-btn" style={{ background: '#c99a1e' }} onClick={() => judge('help')}>◐ قالها بمساعدة</button>
          <button className="mc-btn red" onClick={() => judge('no')}>✗ لم يقلها</button>
        </div>
        <div className="center" style={{ marginTop: 8 }}>{!help && !reveal && <button className="mc-btn sm teal" onClick={() => { setHelp(true); say(clueOf(r.l).say); }}>مساعدة: أظهر قرينته</button>}</div>
      </div>);
    } else {
      const G3 = { ok: [], help: [], no: [] };
      Object.entries(res).forEach(([x, v]) => G3[v].push(x));
      const weak = [...G3.help, ...G3.no];
      const Box = ({ k, t, c }) => (<div className="mc" style={{ padding: 10, borderTop: '8px solid ' + c, minWidth: 150 }}>
        <div style={{ fontWeight: 800 }}>{t} ({G3[k].length})</div>
        <div style={{ fontFamily: 'var(--nasakh)', fontSize: 44, fontWeight: 700, minHeight: 60 }}>{G3[k].join(' ') || '—'}</div>
      </div>);
      body = (<div style={{ textAlign: 'center' }}>
        <p className="lead">نتيجة اختبار حروف البيت</p>
        <div className="center" style={{ alignItems: 'stretch' }}><Box k="ok" t="قالها" c="#3c8527" /><Box k="help" t="قالها بمساعدة" c="#c99a1e" /><Box k="no" t="لم يقلها" c="#b3343c" /></div>
        <div className="center">
          {weak.length > 0 && <button className="mc-btn teal" onClick={() => { setRvList(shuffle(weak).map(x => ({ l: x, f: randForm(x) }))); setRi(0); }}>أعِد الحروف التي لم يتقنها</button>}
          <button className="mc-btn go" onClick={onDone}>إنهاء البيت ✓</button>
        </div>
      </div>);
    }
  }
  return (<div>
    <div className="house-note">{G.note}</div>
    <div className="phases">
      {gi === 0 && <button className={step === 'lego' ? 'on' : ''} onClick={() => setStep('lego')}>تمهيد: الليغو</button>}
      {letters.map((x, i) => <button key={x} className={(!['test', 'lego', 'together'].includes(step) && li === i ? 'on' : '') + (doneL[i] ? ' ok' : '')} style={{ fontFamily: 'var(--nasakh)', fontSize: 22, minWidth: 54 }} onClick={() => goLetter(i)}>{doneL[i] ? '✓ ' : ''}{x}</button>)}
      <button className={step === 'together' ? 'on' : ''} onClick={() => setStep('together')}>🎮 ألعاب البيت</button>
      <button className={step === 'test' ? 'on' : ''} onClick={() => { setStep('test'); setRi(0); }}>اختبار حروف البيت</button>
    </div>
    {!['test', 'lego', 'together'].includes(step) && <Phases list={STEPS} cur={step} set={setStep} seen={{}} />}
    {step !== 'together' && <div className="center" style={{ marginTop: -6, marginBottom: 8 }}><GuideBtn id={{ game: 'pick', test: 'houseTest' }[step] || step} /></div>}
    {body}
    <div className="center" style={{ marginTop: 18 }}>
      <button className="mc-btn sm teal" onClick={() => openXO(learned)}>لعبة للصفّ: إكس-أو الحروف</button>
      <button className="mc-btn sm" onClick={onDone}>للمعلّم: اعتبر البيت منجزًا</button>
    </div>

function pickCells(n, hard, pool) {

  if (hard) { const out = []; shuffle(D.LOOKALIKE).forEach(g => g.forEach(l => { if (pool.includes(l)) out.push(l); })); if (out.length >= 4) src = out; }

}

function RoadGame({ onFinish }) {
  const pair = st => ROAD[st] ? shuffle([ROAD[st].need, ROAD[st].alt]) : [];
  const [stage, setStage] = useState(0), [opts, setOpts] = useState(() => pair(0)), [anim, setAnim] = useState(''), [msg, setMsg] = useState(null), [busy, setBusy] = useState(false);
  const S = ROAD[stage];
  const go = st => { setStage(st); setOpts(pair(st)); setAnim(''); setMsg(null); setBusy(false); if (st === ROAD.length) { beep('win'); onFinish && onFinish(); } };
  const pick = w => {
    if (busy) return;
    say(w);
    if (w === S.need) { beep('ok'); setBusy(true); setAnim('a-' + S.act); setMsg({ ok: true, t: S.yes }); setTimeout(() => go(stage + 1), 2600); }
    else { beep('bad'); setAnim('a-oops'); setMsg({ ok: false, t: S.no }); setTimeout(() => setAnim(''), 850); }
  };
  if (!S) return (<div style={{ textAlign: 'center' }}>
    <div className="win-banner">وصل البطل إلى الكنز! 🎉</div>
    <p className="lead">اقرأ اللافتة الأخيرة، وقلها لمن ساعدك:</p>
    <div className="signs"><span className="sign">شَكَرَ</span></div>
    <button className="mc-btn go" onClick={() => go(0)}>رحلة جديدة</button>
  </div>);
  return (<div>
    <div className="teacher-note">بلا وقت: يقرأ الطالب اللافتتين بصوتٍ عالٍ أوّلًا، ثم يختار ما يعبُر به البطل. إن اختار خطأً فعل البطل ما قرأه، فيرى الطالب أن لقراءته نتيجة.</div>
    <div className="road-strip">{ROAD.map((x, i) => <span key={x.k} className={i < stage ? 'done' : i === stage ? 'cur' : ''}>{x.icon}</span>)}<span>🏁</span></div>
    <div className="road-scene">
      <img className="road-bg" src={SVGX.road(S.k, S.after && msg && msg.ok)} alt="" />
      <img key={stage + anim} className={'road-hero ' + anim + (S.high ? ' high' : '')} src={SVGX.hero()} alt="" />
      {msg && <div className={'road-msg ' + (msg.ok ? 'ok' : 'no')}>{msg.t}</div>}
    </div>
    <p className="lead">{S.q}</p>
    <div className="signs">{opts.map(w => <button key={w} className="sign" onClick={() => pick(w)}>{w}</button>)}</div>
  </div>);
}

function MemoryGame({ onFinish }) {
  const deal = () => shuffle(sample(D.LETTERS, 6).flatMap(l => [{ l, k: 'sep' }, { l, k: 'syl' }])).map((c, i) => ({ ...c, id: i, up: false, own: null }));
  const [cards, setCards] = useState(deal), [turn, setTurn] = useState('x'), [sc, setSc] = useState({ x: 0, o: 0 }), [open, setOpen] = useState([]), [busy, setBusy] = useState(false);
  const done = cards.every(c => c.own);
  const flip = c => {
    if (busy || c.up || c.own) return;
    beep('pop'); if (c.k === 'syl') say(syl(c.l));
    const nc = cards.map(x => x.id === c.id ? { ...x, up: true } : x), no = [...open, c.id];
    setCards(nc); setOpen(no);
    if (no.length === 2) {
      const [a, b] = no.map(id => nc.find(x => x.id === id));
      setBusy(true);
      if (a.l === b.l && a.k !== b.k) {
        setTimeout(() => {
          beep('ok'); const fin = nc.map(x => (x.id === a.id || x.id === b.id) ? { ...x, own: turn } : x);
          setCards(fin); setSc(s => ({ ...s, [turn]: s[turn] + 1 })); setOpen([]); setBusy(false);
          if (fin.every(x => x.own)) { onFinish && onFinish(); beep('win'); }
        }, 450);
      } else {
        setTimeout(() => { setCards(cs => cs.map(x => (x.id === a.id || x.id === b.id) ? { ...x, up: false } : x)); setOpen([]); setBusy(false); setTurn(t => t === 'x' ? 'o' : 'x'); }, 1100);
      }
    }
  };
  return (<div>
    <div className="teacher-note">للمعلّم: يقلب الفريق بطاقتين؛ بطاقة «حرف + حركة» تطابق بطاقة «المقطع المدموج». من يجد زوجًا يأخذه ويكمل دوره.</div>
    <Teams sc={sc} turn={done ? null : turn} />
    <div className="mem">{cards.map(c => (
      <button key={c.id} className={'card' + (c.up || c.own ? ' up' : '') + (c.own ? ' ' + c.own : '')} style={bg('planks')} onClick={() => flip(c)}>
        {(c.up || c.own) && (c.k === 'syl' ? <span className="syl">{syl(c.l)}</span> : <><span className="hk">{DOT + FATHA}</span><span className="lt">{c.l}</span></>)}
      </button>
    ))}</div>
    {done && <div className="win-banner">{sc.x === sc.o ? 'تعادل!' : 'فاز ' + tname(sc.x > sc.o ? 'x' : 'o') + ' 🎉'}</div>}
    <div className="center"><button className="mc-btn go" onClick={() => { setCards(deal()); setSc({ x: 0, o: 0 }); setOpen([]); setTurn('x'); }}>لعبة جديدة</button></div>
  </div>);
}
